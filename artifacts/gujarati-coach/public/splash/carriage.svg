<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <!-- Splash v2 carriage, redrawn to match the boarding-pass TrainEngine
       (src/components/train-svg.tsx): ONE canonical train. Livery: indigo
       body (primary #4F46E5), slate roof/chassis/wheels (foreground
       #0F172A), teal trim (secondary #0D9488), white glazing/spokes with
       the engine's opacities. Hardcoded light-mode hex because an <img>
       SVG cannot read page CSS vars. Owner final art supersedes both via
       SPLASH_V2_ASSETS in brand-splash.tsx.
       The CENTER WINDOW is a true transparent aperture (evenodd hole):
       x 88..152, y 34..82 in this 240x140 viewBox. brand-splash.tsx
       positions Bolo behind it using those same fractions. -->
  <!-- roof vent: steam anchor, center x=195 (slate base, teal lip like the
       engine funnel) -->
  <rect x="186" y="0" width="18" height="12" rx="3" fill="#0F172A"/>
  <rect x="184" y="0" width="22" height="4" rx="2" fill="#0D9488"/>
  <!-- roof -->
  <rect x="14" y="8" width="212" height="16" rx="8" fill="#0F172A"/>
  <!-- body with the empty center window (aperture cut via evenodd) -->
  <path fill-rule="evenodd" clip-rule="evenodd" fill="#4F46E5" d="M26 20h188a16 16 0 0 1 16 16v52a16 16 0 0 1-16 16H26a16 16 0 0 1-16-16V36a16 16 0 0 1 16-16Zm72 14h44a10 10 0 0 1 10 10v28a10 10 0 0 1-10 10H98a10 10 0 0 1-10-10V44a10 10 0 0 1 10-10Z"/>
  <!-- body bands, like the engine's boiler bands -->
  <rect x="77" y="26" width="2" height="62" fill="#FFFFFF" opacity="0.22"/>
  <rect x="161" y="26" width="2" height="62" fill="#FFFFFF" opacity="0.22"/>
  <!-- window frame ring around the aperture (engine-window white) -->
  <rect x="86" y="32" width="68" height="52" rx="12" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="4"/>
  <!-- flanking filled windows, engine-window white glazing -->
  <rect x="30" y="38" width="38" height="30" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <rect x="172" y="38" width="38" height="30" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <!-- teal trim stripe -->
  <rect x="10" y="92" width="220" height="7" rx="3.5" fill="#0D9488"/>
  <!-- chassis bar (running board) -->
  <rect x="18" y="104" width="204" height="8" rx="4" fill="#0F172A"/>
  <!-- spoked wheels matching the engine: slate rim, white spokes and hub -->
  <g>
    <circle cx="64" cy="122" r="13" fill="#0F172A"/>
    <rect x="62.6" y="111.2" width="2.8" height="21.6" rx="1.4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="53.2" y="120.6" width="21.6" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="64" cy="122" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="64" cy="122" r="2" fill="#0F172A"/>
  </g>
  <g>
    <circle cx="176" cy="122" r="13" fill="#0F172A"/>
    <rect x="174.6" y="111.2" width="2.8" height="21.6" rx="1.4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="165.2" y="120.6" width="21.6" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="176" cy="122" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="176" cy="122" r="2" fill="#0F172A"/>
  </g>
  <!-- coupling rod, engine-style -->
  <rect x="60" y="119.75" width="120" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.55"/>
</svg>

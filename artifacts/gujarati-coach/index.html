<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Bolo! : Learn 22 South Asian Languages</title>
    <meta name="description" content="Bolo is the first app built to teach 22 South Asian languages, with a coach that actually listens to you speak." />
    <meta name="robots" content="index, follow" />
    <!-- Safari-only Smart App Banner for the native iOS app; the app id is
         ascAppId from bolo-mobile/eas.json. Ignored everywhere else. -->
    <meta name="apple-itunes-app" content="app-id=6790907772" />
    <!-- Static no-JS defaults. lib/seo.ts (applyDocumentHead) owns these tags
         at runtime on public pages and overwrites them per page; social
         scrapers that skip JS read the values below. -->
    <link rel="canonical" href="https://bolo-india.app/" />
    <meta property="og:title" content="Bolo! : Learn 22 South Asian Languages" />
    <meta property="og:description" content="Bolo is the first app built to teach 22 South Asian languages, with a coach that actually listens to you speak." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bolo-india.app/" />
    <meta property="og:image" content="https://bolo-india.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bolo! : Learn 22 South Asian Languages" />
    <meta name="twitter:description" content="Bolo is the first app built to teach 22 South Asian languages, with a coach that actually listens to you speak." />
    <meta name="twitter:image" content="https://bolo-india.app/og-image.png" />
    <!-- Shares its id with useHomepageStructuredData (lib/seo.ts): on the
         homepage the runtime hook replaces this element's content instead of
         adding a second SoftwareApplication block. -->
    <script type="application/ld+json" id="bolo-structured-data">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Bolo!",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "iOS, Web",
        "description": "Bolo is the first app built to teach 22 South Asian languages, with a coach that actually listens to you speak.",
        "url": "https://bolo-india.app/"
      }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <!-- Boot gap fix (splash v2, item 4): the document's first paint must
         match the splash backdrop exactly so no white flash precedes the
         splash. Keep in sync with the brand-splash.tsx overlay background.
         Once React mounts, body paints its normal background beneath content
         as before.

         #89695B, NOT #ffffff, since 2026-08-26. It was white because the old
         film opened on a white plate. The new film opens on the bazaar at
         dusk, whose first frame averages #89695B, so white was flashing here
         for exactly the reason this block exists to prevent. Mobile had the
         identical bug in app.json's native splash and was fixed with it. -->
    <!-- Is a splash coming? Clerk publishes `__client_uat`, a plain readable
         cookie holding the session's last-updated timestamp: absent or "0"
         means signed out. That is the only signed-in signal available before
         any JS bundle loads, which is exactly when the boot plate has to
         decide whether to paint. Wrong in the safe direction either way: a
         false negative costs a signed-in visitor the plate they used to get,
         and a false positive shows a signed-out visitor the same brown flash
         they get today. Inline and synchronous on purpose, so it runs before
         first paint rather than after it. -->
    <script>
      try {
        var uat = document.cookie.match(/(?:^|;\s*)__client_uat=([^;]*)/);
        if (uat && uat[1] && uat[1] !== '0') {
          document.documentElement.setAttribute('data-boot', 'app');
        }
      } catch (e) {}
    </script>
    <style>
      /* THE BOOT PLATE IS FLAT WHITE (owner, 2026-09-06: "add 1 second of
         plain white to the splash video"). It carried the film's first frame
         at 160px, pre-blurred, from 2026-08-30 until then; the films now open
         on white and dissolve into the bazaar, so the frame this has to match
         is white and there is nothing left to blur. src/lib/splash-lqip.ts
         holds the same colour and splash-lqip.test.ts pins the two copies. */
      /* THE PLATE ONLY PAINTS WHEN A SPLASH IS ACTUALLY COMING, gated by the
         inline script above. It exists to cover the gap before BrandSplash
         renders, and BrandSplash only ever mounts on the signed-in home
         (pages/home.tsx). A signed-OUT visitor gets no splash, so on the
         landing page this was half a second of a blurred bazaar stretched
         across the viewport before the page appeared: "a distorted brown
         screen from the splash load first for a half second" (owner,
         2026-08-30). Signed-in boot is unchanged. */
      /* THE ROOT BOX IS 8px TALL AT BOOT. Owner, build 29: "still seeing
         glitchy brown screen on url load". #root is empty until React mounts,
         so the html element's own box is 8px high and a cover-fit background
         resolved against THAT box rather than the window. 100dvh gives the
         root the window to fill; dvh rather than vh so a phone's collapsing
         toolbar cannot reopen the same gap at the bottom. The background is a
         flat colour now, which cannot be mis-fitted, but the height still has
         to be right or the plate stops short of the fold. */
      /* AND IT STOPS PAINTING THE MOMENT REACT ARRIVES, which it did not
         before (found 2026-09-06). `data-boot` is set once by the script above
         and never removed, so this background used to sit on <html> for the
         whole session with only body's own background hiding it. Gated on the
         same :has() the body rule below already uses, so the plate covers the
         boot gap and nothing else; a browser without :has() keeps the old
         behaviour, which is the one it has had all along. */
      html[data-boot="app"]:has(#root:empty) {
        min-height: 100dvh;
        background: #FFFFFF;
      }
      /* Until React mounts into #root, let the boot gradient show through
         (in browsers without :has(), body simply paints its app background
         once the stylesheet loads, exactly as before). */
      body:has(> #root:empty) {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

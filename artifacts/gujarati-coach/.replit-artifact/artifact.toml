kind = "web"
previewPath = "/"
title = "Bolo!"
version = "1.0.0"
id = "artifacts/gujarati-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19724

[services.development]
run = "pnpm --filter @workspace/gujarati-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gujarati-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/gujarati-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19724"
BASE_PATH = "/"

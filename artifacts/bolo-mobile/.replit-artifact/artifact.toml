kind = "mobile"
previewPath = "/mobile/"
title = "Bolo! Mobile"
version = "1.0.0"
id = "artifacts/bolo-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20259

[services.development]
run = "pnpm --filter @workspace/bolo-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bolo-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bolo-mobile", "run", "serve" ]

[services.env]
PORT = "20259"
BASE_PATH = "/mobile/"

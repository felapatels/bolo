<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bolo – Bolo Bird holding an India flag">
  <!--
    Android adaptive icon foreground.
    Transparent background; illustration scaled to ~78% of canvas
    so it stays inside the ~66% safe zone on round/squircle masks.
  -->
  <defs>
    <clipPath id="flagClipA">
      <rect x="0" y="0" width="172" height="134" rx="2"/>
    </clipPath>
  </defs>

  <!-- Scale the whole illustration to 78% and center it -->
  <g transform="translate(512,512) scale(0.78) translate(-512,-512)">

    <!-- ── Tail feathers (behind body) ── -->
    <ellipse cx="510" cy="870" rx="38" ry="115" fill="#0FA6A0" transform="rotate(12 510 870)"/>
    <ellipse cx="480" cy="875" rx="52" ry="130" fill="#2EA855" transform="rotate(0 480 875)"/>
    <ellipse cx="450" cy="868" rx="36" ry="110" fill="#0FA6A0" transform="rotate(-12 450 868)"/>

    <!-- Body -->
    <ellipse cx="490" cy="640" rx="158" ry="198" fill="#3DB862"/>

    <!-- Belly highlight -->
    <ellipse cx="475" cy="670" rx="80" ry="120" fill="#6EDD88" opacity="0.35"/>

    <!-- Left wing (raised – holds flag) -->
    <path d="M 345 590 Q 285 500 305 380 Q 315 330 355 310 Q 375 300 390 340 Q 400 370 390 440 L 415 560 Z" fill="#2EA855"/>
    <path d="M 355 590 Q 300 510 318 400 Q 328 355 362 345 Q 375 340 380 370 Q 388 400 378 465 L 400 560 Z" fill="#0FA6A0" opacity="0.6"/>

    <!-- Right wing (folded at side) -->
    <path d="M 635 580 Q 710 550 730 650 Q 740 710 700 750 Q 670 770 630 720 L 635 580 Z" fill="#2EA855"/>
    <path d="M 640 590 Q 700 565 720 650 Q 728 700 695 738 L 645 700 Z" fill="#0FA6A0" opacity="0.5"/>

    <!-- Head -->
    <circle cx="478" cy="398" r="148" fill="#3DB862"/>

    <!-- Head highlight -->
    <ellipse cx="452" cy="370" rx="80" ry="65" fill="#6EDD88" opacity="0.28"/>

    <!-- Forehead tuft feathers -->
    <ellipse cx="438" cy="255" rx="22" ry="52" fill="#2EA855" transform="rotate(-18 438 255)"/>
    <ellipse cx="470" cy="248" rx="18" ry="46" fill="#0FA6A0" transform="rotate(-4 470 248)"/>
    <ellipse cx="500" cy="255" rx="16" ry="40" fill="#2EA855" transform="rotate(12 500 255)"/>

    <!-- Eye: white ring -->
    <circle cx="530" cy="378" r="42" fill="white"/>
    <!-- Iris -->
    <circle cx="530" cy="378" r="28" fill="#1a1a2e"/>
    <!-- Pupil highlight -->
    <circle cx="540" cy="369" r="10" fill="white"/>

    <!-- Beak (upper mandible) -->
    <path d="M 570 415 Q 635 435 628 462 Q 622 480 580 468 Q 565 462 560 445 Z" fill="#FF9933"/>
    <!-- Beak (lower mandible) -->
    <path d="M 572 448 Q 620 462 610 480 Q 600 495 572 482 Z" fill="#E07000"/>

    <!-- Feet / talons -->
    <g stroke="#FF9933" stroke-width="16" stroke-linecap="round">
      <line x1="440" y1="818" x2="418" y2="862"/>
      <line x1="440" y1="818" x2="442" y2="866"/>
      <line x1="440" y1="818" x2="464" y2="858"/>
    </g>
    <g stroke="#FF9933" stroke-width="16" stroke-linecap="round">
      <line x1="535" y1="822" x2="513" y2="866"/>
      <line x1="535" y1="822" x2="537" y2="868"/>
      <line x1="535" y1="822" x2="558" y2="862"/>
    </g>

    <!-- ── Flag stick ── -->
    <line x1="348" y1="580" x2="348" y2="200" stroke="#7B5E2A" stroke-width="14" stroke-linecap="round"/>
    <circle cx="348" cy="197" r="8" fill="#A0792F"/>

    <!-- ── Indian tricolor flag ── -->
    <rect x="354" y="195" width="172" height="134" rx="3" fill="white"/>
    <!-- Saffron stripe -->
    <rect x="354" y="195" width="172" height="44" fill="#FF9933" rx="2"/>
    <!-- Green stripe -->
    <rect x="354" y="283" width="172" height="46" fill="#138808" rx="2"/>
    <!-- Flag border -->
    <rect x="354" y="195" width="172" height="134" rx="3" fill="none" stroke="#ccc" stroke-width="1"/>

    <!-- Ashoka Chakra -->
    <circle cx="440" cy="262" r="22" fill="none" stroke="#06038D" stroke-width="3.5"/>
    <circle cx="440" cy="262" r="4" fill="#06038D"/>
    <g stroke="#06038D" stroke-width="1.8" stroke-linecap="round">
      <line x1="440" y1="240" x2="440" y2="284"/>
      <line x1="418" y1="262" x2="462" y2="262"/>
      <line x1="424.4" y1="246.4" x2="455.6" y2="277.6"/>
      <line x1="455.6" y1="246.4" x2="424.4" y2="277.6"/>
      <line x1="418.5" y1="251.5" x2="461.5" y2="272.5"/>
      <line x1="461.5" y1="251.5" x2="418.5" y2="272.5"/>
      <line x1="422" y1="244" x2="458" y2="280"/>
      <line x1="458" y1="244" x2="422" y2="280"/>
      <line x1="418" y1="256" x2="462" y2="268"/>
      <line x1="462" y1="256" x2="418" y2="268"/>
      <line x1="421" y1="248" x2="459" y2="276"/>
      <line x1="459" y1="248" x2="421" y2="276"/>
    </g>

  </g>
</svg>

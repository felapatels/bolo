# CI, 2026-09-04. Owner: "i want to know that nothing breaks in one of the
# games and stops the user from progressing." Until today a push could break
# main and nobody knew until a publish. Four jobs, in parallel, on every push
# to main and every pull request:
#
#   typecheck   pnpm run typecheck (tsc -b everywhere; tsc -p lies in this repo)
#   web         vitest, the whole suite
#   mobile      jest, the whole suite, --forceExit because workers leak
#   api-pure    the api-server test files that need no database (64 of 138,
#               listed in artifacts/api-server/pure-tests.txt). Fast signal.
#   api-db      the WHOLE api suite, against a throwaway postgres built from
#               migrations plus the seed. Added 2026-09-07 on the owner's
#               approval, and it exists because the deletion lockout (X53) was
#               a P0 whose only guard could not be executed by anything
#               automatic. The line that used to sit here said the db-backed
#               files "run only in the Repl Shell". THAT WAS FALSE and it cost
#               five forks a day of unverifiable fixes: the suite needs A
#               database, not the REPL'S database.
#
# PORTABLE TO BOLO INDIA AS IS, except pure-tests.txt: regenerate it there by
# running each api test file alone with SESSION_SECRET=x OPENAI_API_KEY=x and
# keeping the ones that report "fail 0".
#
# Known flakes (a single re-run clears them, a second failure is real): the
# web practice-streak toast, the mobile journey-map opening shot.
#
# NODE 26, THE MAC'S, NOT THE REPL'S 24. The first run (2026-09-04) went red
# on Node 24 in ways the Mac never sees: the web suite's storage stand-in in
# setup.ts is written for Node 26's localStorage behaviour (two storage
# tests failed), and one api pure test failed on 24 alone. The suites'
# baselines were all measured on Node 26; CI mirrors that. The api server
# itself still runs on 24 in the Repl, which its own DB-backed suite covers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI reads real services. The api's pure tests stub these two.
  SESSION_SECRET: ci-only
  OPENAI_API_KEY: ci-only
  CI: "true"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-conflict-markers.mjs
      - run: pnpm run typecheck

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/gujarati-coach exec vitest run

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      # --forceExit: workers leak (CLAUDE.md). --ci: no snapshot writes.
      - run: pnpm --filter @workspace/bolo-mobile exec jest --forceExit --ci --maxWorkers=2

  api-pure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # One pure test really runs ffmpeg (gpt-audio's pcm to mp3); the Repl
      # has it, a bare runner does not.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run test:pure

  # THE WHOLE api SUITE, ON A DATABASE THIS JOB BUILDS AND THROWS AWAY.
  #
  # Two things make this possible and both were traps first. The suite needs a
  # SEEDED database, not just a migrated one, because tests resolve fixture ids
  # from content rows. And it needs OPENAI_API_KEY set to any non-empty string:
  # integrations-openai-ai-server throws at import without one, which reads as a
  # broken test rather than a missing variable.
  #
  # WHAT A GREEN RUN HERE PROVES, AND WHAT IT DOES NOT.
  # A fresh database is a stronger proof than a reused one ONLY where a foreign
  # key exists to bind a fixture id to a real row. Measured on India's schema
  # 2026-09-07 (pg_constraint, contype='f'):
  #   lesson_group_progress.lesson_group_id   FK, so a phantom id raises
  #   lesson_group_testouts.lesson_group_id   FK, so a phantom id raises
  #   phrase_reports.phrase_id                FK, so a phantom id raises
  #   user_item_memory.phrase_id              FK, so a phantom id raises
  #   attempts.phrase_id                      NO FK, a phantom id inserts fine
  # A sibling fork measured a schema where NEITHER fixture column carries one,
  # and there the suite passes against rows that do not exist while looking
  # exactly as green as this. Absence of a foreign key is invisible from the
  # test file, so read pg_constraint before trusting a green on a clean
  # database.
  api-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bolo
          POSTGRES_PASSWORD: bolo
          POSTGRES_DB: bolo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bolo:bolo@localhost:5432/bolo_ci
      # Test-only values. Clerk is faked in the suite and never reached.
      SESSION_SECRET: ci-test-secret-not-a-credential
      # "no test calls OpenAI" USED TO BE TRUE AND WAS NOT. The comment above
      # this line said exactly that, and openai.tts-cache.test.ts deletes
      # ELEVENLABS_API_KEY on purpose so the gpt-audio fallback has to really
      # synthesise. With a placeholder it cannot, so that one test has failed on
      # EVERY run for as long as the history reaches: 16 failures and 8
      # cancellations in the last 25, and no successes at all. Proven both ways
      # on 2026-09-08 rather than argued: placeholder red, and with the owner's
      # real key that file is 19 of 19.
      #
      # A BOARD THAT IS RED EVERY TIME IS A BOARD NOBODY READS, and this one had
      # six commits and a store build pushed past it in one evening by somebody
      # who never thought to look. The owner's ruling: give it the real key.
      #
      # THE FALLBACK IS NOT TIDINESS, IT IS THE IMPORT GUARD. Four files import a
      # module that THROWS AT TOP LEVEL when this is empty, and a file that fails
      # to import reports one test and takes the rest with it UNCOUNTED: roughly
      # a sixth of the suite disappears and the summary says nothing. So an unset
      # secret must still yield a non-empty string. `${{ }}` gives "" for a
      # missing secret, which is precisely the value that would do that.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-placeholder-not-a-real-key-import-guard-only' }}
      # Clerk's backend SDK asserts on key FORMAT at import, not on validity, so
      # a well-formed fake is enough and no request ever reaches Clerk. Without
      # these, phraseReports' auth test returns 500 where it asserts 401, which
      # reads as a broken guard rather than a missing variable.
      CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_placeholder_not_a_credential
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # Same ffmpeg reason as api-pure: one test really shells out to it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm --filter @workspace/db run seed
      - run: pnpm --filter @workspace/api-server run test

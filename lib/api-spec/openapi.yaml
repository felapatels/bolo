openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Languages, categories, phrases, attempts and progress
  - name: openai
    description: OpenAI AI audio and content operations
  - name: friends
    description: Friends, friend requests, and the friends leaderboard
  - name: account
    description: Profile, notification and learning preferences, and account deletion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /languages:
    get:
      operationId: listLanguages
      tags: [learning]
      summary: List all supported learning languages
      responses:
        "200":
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /categories:
    get:
      operationId: listCategories
      tags: [learning]
      summary: List all lesson categories with progress for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /categories/{id}/lesson-groups/{lang}:
    get:
      operationId: listCategoryLessonGroups
      tags: [learning]
      summary: List a category's lesson groups (journey-map stations) for a language, with per-user progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered lesson groups plus the count of phrases not yet assigned to any group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupList"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lesson-groups/{id}/test-out:
    get:
      operationId: getLessonGroupTestout
      tags: [learning]
      summary: Sample phrases for a test-out assessment of one lesson group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A fresh random sample plus the pass requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutSample"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: submitLessonGroupTestout
      tags: [learning]
      summary: Submit a test-out assessment (server-signed evaluation tokens only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonGroupTestoutInput"
      responses:
        "200":
          description: Graded result; a pass persists tested_out for the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutResult"
        "400":
          description: Invalid submission (bad tokens, wrong phrases, or wrong count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /zones/{categoryId}/test-out/{lang}:
    get:
      operationId: getZoneTestout
      tags: [learning]
      summary: Sample one phrase per station for a zone test-out assessment
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A fresh random sample plus the pass requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutSample"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "403":
          description: Zone locked by the cross-zone progression gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /zones/{categoryId}/test-out:
    post:
      operationId: submitZoneTestout
      tags: [learning]
      summary: Submit a zone test-out (server-signed evaluation tokens only)
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneTestoutInput"
      responses:
        "200":
          description: Graded result; a pass latches tested_out for every group in the zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutResult"
        "400":
          description: Invalid submission (bad tokens, non-distinct stations, or wrong count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "403":
          description: Zone locked by the cross-zone progression gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lesson-groups/{id}/phrases:
    get:
      operationId: listLessonGroupPhrases
      tags: [learning]
      summary: List the ordered phrases of one lesson group (same phrase shape as the category listing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ordered phrases of the lesson group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/sentences/{lang}:
    get:
      operationId: listCategorySentences
      tags: [learning]
      summary: List the topic's Plus-only sentence stage for a language
      description: >-
        The topic's final step after the phrase list — full, natural sentences
        that build on the topic's vocabulary. Bolo! Plus only: callers without
        the sentences feature receive a 402 upgrade payload and no sentence
        text. Generated + cached on first request for dynamically generated
        lessons.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sentences (same shape as phrases)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only feature or language)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/phrases/{lang}:
    get:
      operationId: listCategoryPhrases
      tags: [learning]
      summary: List phrases in a category for a language (generated + cached on first request)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addCategoryPhrases
      tags: [learning]
      summary: Generate and append fresh AI phrases to a category's lesson
      description: >-
        Generates additional beginner phrases in the language's native script,
        avoiding phrases already in the lesson, and appends them to the existing
        lesson so they persist and count toward progress.


        Bounded three ways. Appends to one topic are serialized on a
        topic-keyed lock, so concurrent taps can never insert duplicates: a
        caller who loses the race gets 409 append_in_progress. The topic may not
        grow past the plan's phraseCeiling (see Category), counted in visible
        rows; a request near the boundary is clamped to the remaining headroom
        rather than refused, and only zero headroom refuses: 402
        phrase_ceiling when an upgrade would lift it, 409 topic_full on
        All-Access and Family, where nothing would. Each learner may append ten
        times per rolling hour across all topics; beyond that, 429
        append_rate_limited with retryAfterSeconds. Every refusal happens before
        any AI call, so a blocked tap costs nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPhrasesInput"
      responses:
        "200":
          description: >-
            The newly added phrases. An empty array means the request succeeded
            but the model only returned phrases the topic already had.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: >-
            Upgrade required, for a Plus-only language, or reason
            phrase_ceiling: the topic holds as many phrases as this plan allows
            and All-Access would lift it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Refused with nothing to upgrade to. reason append_in_progress: an
            append for this topic is already running, retry shortly. reason
            topic_full: the caller is on the top tier and the topic is at its
            ceiling, so no upgrade prompt should be shown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendRefused"
        "429":
          description: >-
            reason append_rate_limited: the learner has used their ten manual
            appends for this rolling hour. retryAfterSeconds says when they may
            continue; also sent as the Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendRefused"

  /review/phrases:
    get:
      operationId: listReviewPhrases
      tags: [learning]
      summary: The learner's due phrases for a language, soonest-due first
      description: >-
        Returns the phrases the learner has practiced, has not yet made
        stable, and is due to see again, for the given language, soonest-due
        first. The FSRS schedule in user_item_memory decides when a phrase is
        due: Good and Easy attempts push it out, Hard and Again attempts and a
        long hesitation before speaking bring it back sooner. Returns an empty
        array when nothing is due. `limit` caps the session; a request for
        three or fewer phrases is the between-stops flashback and is free to
        every plan, while the full drill above that is Bolo! Plus.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >-
            How many phrases to return, 1 to 12 (default 12). Three or fewer
            needs no plan: that is the flashback between stops.
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Weak phrases to review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (a session above three phrases is a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /phrases/{id}:
    get:
      operationId: getPhrase
      tags: [learning]
      summary: Get a single phrase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attempts:
    post:
      operationId: createAttempt
      tags: [learning]
      summary: Record a pronunciation practice attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "201":
          description: Created attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"

  /game-sessions:
    post:
      operationId: recordGameSession
      tags: [learning]
      summary: Record the results of a mini-game session and award XP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionInput"
      responses:
        "201":
          description: Game session recorded and XP awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSessionResult"

  /attempts/recent:
    get:
      operationId: listRecentAttempts
      tags: [learning]
      summary: Recent practice attempts feed for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attempt"

  /badges:
    get:
      operationId: listBadges
      tags: [learning]
      summary: Badge catalog annotated with earned/locked status for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of badges with earned status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [learning]
      summary: Overall learning progress summary for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/analytics:
    get:
      operationId: getProgressAnalytics
      tags: [learning]
      summary: Advanced progress analytics for a language (Bolo! Plus only)
      description: >-
        A deeper progress breakdown than the basic summary: per-category
        mastery, a recent daily-activity trend, and how many phrases are due for
        review. Advanced analytics are a Bolo! Plus feature.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Advanced analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressAnalytics"
        "402":
          description: Upgrade required (advanced analytics are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /entitlements:
    get:
      operationId: getEntitlements
      tags: [entitlements]
      summary: The caller's plan, unlocked features, and daily limits
      description: >-
        Returns the authenticated user's effective plan (Free vs Bolo! Plus),
        subscription status, the languages they may access, the feature flags
        they have unlocked. The daily new-lesson meter is retired: dailyNewLessons
        reports null limits for every plan and is kept only for installed builds.
        Clients call this to know what is unlocked and how to render the paywall.
      responses:
        "200":
          description: The caller's entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"

  /entitlements/chosen-language:
    post:
      operationId: setChosenLanguage
      tags: [entitlements]
      summary: Record the One Language tier's chosen language
      description: >-
        Records the single language a One Language ($6.99) subscriber unlocks on
        top of free Hindi, captured at purchase. Once set while on the middle
        tier the choice is locked: changing it returns 409, and only upgrading
        to all-access frees it. Choosing Hindi or an unknown language is
        rejected. Returns the fresh entitlements snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetChosenLanguageInput"
      responses:
        "200":
          description: The caller's updated entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "400":
          description: Missing or invalid language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Language not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The chosen language is locked for this subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: The caller's profile, preferences, and subscription summary
      description: >-
        Returns the authenticated learner's profile (name, email, avatar), their
        notification and learning preferences, and a compact subscription
        summary — everything the account settings screen renders from.
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the caller's account and all their data
      description: >-
        Permanently deletes the learner's Clerk identity and every local record
        (attempts, progress, friendships, subscription state). Idempotent and
        irreversible; the client signs the user out afterwards.
      responses:
        "200":
          description: The account was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResult"

  /account/profile:
    patch:
      operationId: updateAccountProfile
      tags: [account]
      summary: Update the caller's display name and/or avatar
      description: >-
        Updates the display name (mirrored to Clerk, the identity source of
        truth) and/or the avatar reference. Only the fields present in the body
        are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResult"
        "400":
          description: Nothing to update or an invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The identity service could not apply the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/preferences:
    patch:
      operationId: updateAccountPreferences
      tags: [account]
      summary: Update notification and/or learning preferences
      description: >-
        Updates any subset of the notification (daily reminder toggle + time)
        and learning (active language, daily goal, theme) preferences. Only the
        provided fields change; each is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesInput"
      responses:
        "200":
          description: The updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPreferencesResult"
        "400":
          description: An invalid preference value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The chosen language does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/memories:
    get:
      operationId: getAccountMemories
      tags: [account]
      summary: What Bolo remembers about the caller
      description: >-
        Returns every note Bolo has kept about this learner, newest first. Each
        is one short English sentence distilled server-side from a chat turn,
        never a transcript. There is no write endpoint on purpose, so a client
        can never put words in a learner's file.

        MANY OF THESE LEARNERS ARE CHILDREN. A thing that quietly remembers
        people needs a way to see what it holds, which is what this is for.
      responses:
        "200":
          description: The learner's memories, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMemoriesResult"
    delete:
      operationId: forgetAccountMemories
      tags: [account]
      summary: Make Bolo forget everything he has kept about the caller
      description: >-
        Deletes every memory held for this learner and returns how many went.
        There is no per-memory delete: the control is all or nothing.
      responses:
        "200":
          description: How many memories were forgotten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgetMemoriesResult"

  /account/subscription:
    get:
      operationId: getAccountSubscription
      tags: [account]
      summary: The caller's full subscription-management snapshot
      description: >-
        Returns the tier/status, relevant dates, chosen language, a best-effort
        payment-method summary, and billing/invoice history. Softer fields
        (payment method, history) are pulled from the provider where available
        and degrade to null/empty when it isn't configured or doesn't expose
        them.
      responses:
        "200":
          description: The subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/cancel:
    post:
      operationId: cancelAccountSubscription
      tags: [account]
      summary: Cancel the caller's subscription at the period boundary
      description: >-
        Marks the subscription canceled. Paid access continues until the current
        period ends (the plan stays live until currentPeriodEnd lapses).
        Canceling also clears any active pause.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No active subscription to cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/pause:
    post:
      operationId: pauseAccountSubscription
      tags: [account]
      summary: Pause the caller's subscription for a bounded window
      description: >-
        Pauses the subscription for 1–3 months. While paused the provider
        suspends paid access but does not expire the subscription; it resumes
        automatically when the window closes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseSubscriptionInput"
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No active subscription to pause or an invalid month count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The subscription is already paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/resume:
    post:
      operationId: resumeAccountSubscription
      tags: [account]
      summary: Resume a canceling subscription (undo a pending cancel)
      description: >-
        Clears a pending cancellation, returning the subscription status from
        canceled to active. No discount is applied, the retention offer is not
        consumed, and the current period end is unchanged. Idempotent for an
        already-active paid subscription and repeatable any number of times.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No paid subscription to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The subscription is paused, not canceling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/unpause:
    post:
      operationId: unpauseAccountSubscription
      tags: [account]
      summary: Resume a paused subscription early
      description: >-
        Lets a learner who changes their mind come back before the pause
        window closes. Clears the pause and resumes the underlying paid tier
        immediately — the same outcome as waiting for pauseUntil to elapse
        naturally, just early. Only applies to a currently-paused
        subscription; a canceling, active, or expired subscription has
        nothing to unpause.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: The subscription is not paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/retention:
    post:
      operationId: acceptRetentionOffer
      tags: [account]
      summary: Accept the one-time discounted 3-month retention offer
      description: >-
        Redeems the discounted 3-month retention offer. Resumes/keeps the paid
        tier (clearing any pending cancel or pause), extends the current period
        by three months, and records that the offer was accepted so it can only
        be redeemed once.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No subscription eligible for the retention offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The retention offer was already redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/by-code:
    post:
      operationId: sendFriendRequestByCode
      tags: [friends]
      summary: Send a friend request to the learner who owns a friend code
      description: >-
        Matches the code exactly (after uppercase/trim normalization) and creates
        a PENDING friend request the recipient must accept — never an instant
        friendship. A learner's friend code is their referral code, which is
        meant to be broadcast, so the accept step is what keeps a published code
        from becoming an open friend list. Rejection wording is deliberately
        uniform: an unknown code, a near-miss, and a code belonging to someone
        the caller already has a relationship with all return the same 404 and
        the same message, so the endpoint cannot be probed for which codes are
        real. Rate limited per account and per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestByCodeInput"
      responses:
        "201":
          description: The created pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          description: Missing code, or the caller's own code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            The code did not match anyone the caller can add. Returned for an
            unknown code and for an existing friendship or pending request
            alike, with identical wording.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many code attempts from this account or IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/incoming:
    get:
      operationId: listIncomingFriendRequests
      tags: [friends]
      summary: Pending friend requests awaiting the caller's response
      responses:
        "200":
          description: Incoming pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/outgoing:
    get:
      operationId: listOutgoingFriendRequests
      tags: [friends]
      summary: The caller's pending friend requests still awaiting the other learner
      responses:
        "200":
          description: Outgoing pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The now-accepted friendship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedFriendship"
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Request declined and removed
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: The caller's accepted friends
      responses:
        "200":
          description: Accepted friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"

  /friends/{userId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove an accepted friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Friendship removed
        "404":
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/invite:
    post:
      operationId: sendFriendInvite
      tags: [friends]
      summary: Invite a non-member to download Bolo! by email
      description: >-
        Sends a "download Bolo!" referral email to an address that does not
        belong to any existing learner. Rate-limited to one send per
        (caller, recipient) pair per 24 hours to prevent abuse. If the invited
        person later signs up with that email, a pending friend request is
        automatically created from the inviter so the new learner sees it
        immediately on sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendInviteInput"
      responses:
        "200":
          description: Invite sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendInviteResult"
        "400":
          description: Missing or invalid email, or that email belongs to an existing learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit reached — already sent an invite to this address recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/leaderboard:
    get:
      operationId: getFriendsLeaderboard
      tags: [friends]
      summary: The caller and their friends ranked by XP
      description: >-
        Returns the caller plus their accepted friends ranked by XP (summed
        across every language from the XP ledger), highest first. Each entry
        carries a display name, XP, current streak, and 1-based rank, and the
        caller's own entry is flagged with `isSelf` so clients can highlight
        their position. Ties break by current streak, then by whoever reached
        the total first. Available to all authenticated learners.
      parameters:
        - name: window
          in: query
          required: false
          description: >-
            Which stretch of time the XP is summed over. `all-time` (the
            default) covers every ledger row including the pre-ledger backfill.
            `week` covers the current UTC week, from Monday 00:00 UTC, and
            excludes backfill rows because they carry the backfill's own
            timestamp rather than the day the XP was earned.
          schema:
            type: string
            enum: [all-time, week]
            default: all-time
        - name: scope
          in: query
          required: false
          description: >-
            Whose numbers to show. `friends` (the default, and the behaviour of
            every client that predates this parameter) is the caller's accepted
            friends. `all` is every learner who has opted in by SETTING A
            USERNAME and has not since turned `shareStats` off. Eligibility is
            enforced in the query, so a learner without a username never
            appears. A global row carries the learner's `username` and never
            their private `displayName`.
          schema:
            type: string
            enum: [friends, all]
            default: friends
      responses:
        "200":
          description: The leaderboard, ranked highest XP first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /friends/feed:
    get:
      operationId: getFriendsFeed
      tags: [friends]
      summary: Recent activity from the caller's friends
      description: >-
        Returns what the caller's accepted friends have been doing, newest
        first. Friends only and never the caller's own events: whose activity
        comes back is resolved server-side from the accepted friendships, and
        no client input selects it. Each entry carries an actor with a display
        name and mascot only, never an email address.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            How many events to return. Defaults to 20 and is capped at 50; a
            malformed value falls back to the default rather than erroring.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: scope
          in: query
          required: false
          description: >-
            Whose numbers to show. `friends` (the default, and the behaviour of
            every client that predates this parameter) is the caller's accepted
            friends. `all` is every learner who has opted in by SETTING A
            USERNAME and has not since turned `shareStats` off. Eligibility is
            enforced in the query, so a learner without a username never
            appears. A global row carries the learner's `username` and never
            their private `displayName`.
          schema:
            type: string
            enum: [friends, all]
            default: friends
      responses:
        "200":
          description: The activity feed, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedEntry"

  /games/script-trace/progress:
    get:
      operationId: getScriptTraceProgress
      tags: [learning]
      summary: Get Script Trace chapter progress
      description: >-
        Returns the caller's per-character tracing progress for the requested
        Script Trace chapter. Plus-only — non-Plus callers receive a 402.
      parameters:
        - name: chapter
          in: query
          required: true
          description: >-
            A Script Trace chapter id, e.g. "gujarati-vowels" or
            "bengali-consonants". Validated server-side against the real chapter
            data. This was an enum of four ids, the same fault the POST body
            carried: twenty of the twenty-two languages could not read their own
            tracing progress.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: List of per-character progress entries for the chapter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptTraceCharacterProgress"
        "400":
          description: Invalid or missing chapter parameter
        "402":
          description: Upgrade required (Script Trace is a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
    post:
      operationId: recordScriptTraceProgress
      tags: [learning]
      summary: Record a Script Trace attempt
      description: >-
        Saves the result of a single character trace. Upserts so the best score
        is preserved and the `passed` flag is sticky (never reverted once true).
        Plus-only — non-Plus callers receive a 402.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptTraceProgressInput"
      responses:
        "201":
          description: The updated character progress after the attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptTraceCharacterProgress"
        "400":
          description: Validation error
        "402":
          description: Upgrade required (Script Trace is a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /games/daily-quiz/today:
    get:
      operationId: getDailyQuiz
      tags: [learning]
      summary: Get today's daily quiz for a language (Plus only)
      description: >-
        Returns today's 5-question daily quiz for the learner's active language.
        If the quiz hasn't been generated yet it is created on-demand.
        If the learner has already completed today's quiz, `completed` is true
        and their score is included. The same questions are served to every
        learner (shared daily experience). Requires Bolo! Plus.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: Language code (e.g. "gu")
      responses:
        "200":
          description: Today's quiz (and completion state if already played)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuizResponse"
        "400":
          description: Missing lang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required (Bolo! Plus only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "502":
          description: Quiz generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/daily-quiz/complete:
    post:
      operationId: completeDailyQuiz
      tags: [learning]
      summary: Submit the learner's answers for today's daily quiz (Plus only)
      description: >-
        Records the learner's score for today's quiz. Enforces one submission
        per user per language per UTC day. Returns the score and XP awarded
        (10 XP per correct answer, +20 bonus for a perfect 5/5). Requires
        Bolo! Plus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDailyQuizInput"
      responses:
        "200":
          description: Quiz completed — score and XP awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuizResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required (Bolo! Plus only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "409":
          description: Already completed today's quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/letter-stop/complete:
    post:
      operationId: completeLetterStop
      tags: [learning]
      summary: Record a letter recognition stop
      description: >-
        The letter stop, position 4 of every zone: hear the sound, pick the
        romanisation. Tracing at stop 2 teaches the hand and this is the only
        thing in the app that ever asks a learner to READ what they wrote.


        THE QUESTIONS ARE NOT SERVED FROM HERE, on purpose. letterStopFor lives
        in @workspace/script-trace and both clients call it directly, exactly as
        they already do for traceStopFor: the alphabet is shipped static data,
        so fetching it would buy a round trip and a second source of truth for
        no secret worth keeping. What the server owns is the gate, the ledger
        and the count.


        Scored by the client, like script-trace and unlike the daily quiz, and
        clamped by the server: correct and total are both floored at zero and
        capped at the stop's own length, and correct can never exceed total.


        THE FREE TASTE is journey 1 zone 1 in every language, matching tracing
        at stop 2 and the story at stop 3. Everything past it is All-Access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLetterStopInput"
      responses:
        "200":
          description: The stop recorded, with the clamped score and XP awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterStopResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required (every letter stop past zone 1 is All-Access)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: No letter stop for that language and zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The session could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/story/book:
    get:
      operationId: getStoryBook
      tags: [learning]
      summary: The storybook for one fare zone, resolved into one language
      description: >-
        Returns the scene graph's vocabulary for a zone's book: each concept the
        book names, resolved to that language's own phrase (native script,
        romanized, English). The scenes, their art and their branching are NOT
        returned, because they are language-neutral and live in @workspace/story
        on the client; only the lines are per language.


        A concept the language does not carry is simply ABSENT from `phrases`
        rather than returned empty, which is what makes the client's
        resolveScene() return null and skip the scene.


        THE FREE TASTE. The journey 1 zone 1 book serves its FIRST SCENE to
        every plan and answers 200 with `limited: true`, never 402: that stop is
        never locked on the journey map, and a stop that shows no lock and then
        bounces you to the paywall is the bug the Script Trace taste was created
        to fix. Every other zone's book is All-Access and answers 402 outright.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: Language code (e.g. "gu")
        - name: journey
          in: query
          required: true
          schema:
            type: integer
          description: 1-based journey number
        - name: zone
          in: query
          required: true
          schema:
            type: integer
          description: 1-based fare zone within the journey
      responses:
        "200":
          description: The book's vocabulary in this language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryBookResponse"
        "400":
          description: Missing or invalid lang, journey or zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required (every book past zone 1 is All-Access)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: >-
            No storybook in that zone. Not an error: most zones have none, and
            journey 2 has none at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contact:
    post:
      operationId: submitContactForm
      tags: [account]
      summary: Submit a support message via the Contact Us form
      description: >-
        Saves the message to the contact_submissions table and sends a
        notification email to the support inbox via Resend. The DB row is always
        saved; if the email send fails email_sent stays false and the caller still
        receives { success: true }. Rate-limited to 3 submissions per 10 minutes
        per user/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFormInput"
      responses:
        "200":
          description: Message saved (and notification email sent if configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFormResult"
        "400":
          description: Validation error (missing field or invalid email/category)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: DB insert failed — message was not saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /phrases/{id}/report:
    post:
      operationId: reportPhrase
      tags: [learning]
      summary: Flag a phrase as incorrect (Spec B2)
      description: >-
        Stores a phrase report (reason + optional note) in phrase_reports.
        language_code and stage are derived server-side from the phrase row —
        never client-supplied. Fire-and-forget from the client's perspective:
        beyond the rolling-hour cap (20 stored reports per user) the server
        returns { success: true } and stores nothing. Duplicate reports for
        the same phrase are allowed; dedup is a review-time concern.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhraseReportInput"
      responses:
        "200":
          description: Report stored (or silently dropped over the cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseReportResult"
        "400":
          description: Invalid phrase id, reason, or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Phrase not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}/report-username:
    post:
      operationId: reportUsername
      tags: [friends]
      summary: Flag another learner's public name
      description: >-
        Stores a username report (reason + optional note) in username_reports.
        The username is COPIED at write time, not joined later: the point of a
        report is the string that was on screen when it was made. The other
        half of the public-name safety story, alongside the write-time
        profanity screen, which catches the obvious and nothing else.
        Fire-and-forget: beyond the rolling-hour cap (20 per reporter) the
        server returns { success: true } and stores nothing. Nothing here hides
        a name; a report is an inbox, not an enforcement action.
      parameters:
        - name: id
          in: path
          required: true
          description: The learner being reported.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsernameReportInput"
      responses:
        "200":
          description: Report stored (or silently dropped over the cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseReportResult"
        "400":
          description: Invalid reason or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such learner, or they have no public name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}/block:
    post:
      operationId: blockUser
      tags: [friends]
      summary: Stop seeing another learner, and stop them seeing you
      description: >-
        The third App Store Guideline 1.2 control on user-generated content,
        alongside the write-time profanity screen and the report path. Stored
        one way (who blocked whom, since only they can undo it) and enforced
        BOTH ways on every read: the pair disappears from each other's feed and
        leaderboard. Also deletes any friendship or pending request between the
        two, so the block is not half-applied. Idempotent, and the blocked
        learner is never told.
      parameters:
        - name: id
          in: path
          required: true
          description: The learner being blocked.
          schema:
            type: string
      responses:
        "200":
          description: Blocked (or already blocked; the outcome is the same)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseReportResult"
        "400":
          description: Invalid user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unblockUser
      tags: [friends]
      summary: Undo a block
      description: >-
        Only the blocker can undo their own block. Unblocking does NOT restore
        the friendship the block removed: the pair has to ask each other again.
        Removing a block that was never there is a success, since the caller's
        desired state is what holds afterwards.
      parameters:
        - name: id
          in: path
          required: true
          description: The learner being unblocked.
          schema:
            type: string
      responses:
        "200":
          description: Not blocked any more
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseReportResult"
        "400":
          description: Invalid user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /blocks:
    get:
      operationId: listBlockedUsers
      tags: [friends]
      summary: The learners this caller has blocked
      description: >-
        The list a learner manages their own blocks from. Guideline 1.2 wants
        the control to be reachable, and a block with no way back is a trap
        rather than a control. Carries the PUBLIC name only, never the private
        display name, because everybody on this list is by definition not a
        friend any more.
      responses:
        "200":
          description: Blocked learners, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"

  /openai/tts/voices:
    get:
      operationId: listTtsVoices
      tags: [openai]
      summary: List available TTS voices and the caller's current preference
      description: >-
        Returns the curated VOICE_CATALOG of ElevenLabs premade voices plus the
        authenticated user's current ttsVoice preference (null = Auto).
      responses:
        "200":
          description: Voice catalog and current preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceListResult"

  /openai/tts:
    post:
      operationId: synthesizeSpeech
      tags: [openai]
      summary: Convert text to spoken audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechInput"
      responses:
        "200":
          description: Synthesized audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechResult"

  /nest/redirect:
    get:
      operationId: getNestRedirect
      tags: [nest]
      summary: Where the Nest currently lives (owner only)
      description: >-
        Internal operations tooling. 404 for everybody but the owner, and NEVER
        403: a 403 confirms the page exists and tells a stranger what to keep
        probing. Temporary by design, and retired when the page itself finishes
        moving into the product.
      responses:
        "200":
          description: The Nest's current address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NestRedirect"
        "404":
          description: Not the owner, or no such thing

  /nest/summary:
    get:
      operationId: getNestSummary
      tags: [nest]
      summary: The counts the cockpit runs on (owner only)
      description: >-
        The same query spend-ping.sh posts into PostHog hourly, served directly
        instead of relayed. Both the with-owner and without-owner figures are
        computed SERVER SIDE so the allowlist never reaches the browser. Cached
        for 60 seconds. No health field: same origin means the page fetches
        /api/healthz itself, which is a live check rather than a reading of
        somebody else's last cron run.
      responses:
        "200":
          description: Current counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NestSummary"
        "404":
          description: Not the owner, or no such thing

  /openai/narrate:
    post:
      operationId: narrateStoryLine
      tags: [openai]
      summary: Read one line of the storybook aloud
      description: >-
        Storybook narration. Separate from /openai/tts on purpose: that route
        speaks a PHRASE in the learner's own language, applies their Plus voice
        preference and runs pronunciation verification on the take. None of that
        applies here. The story is English and language-neutral by design, so one
        narrator serves all 22 languages and every clip is cached forever, which
        is what keeps a 480-line library costing once rather than 22 times.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarrationInput"
      responses:
        "200":
          description: Synthesized narration audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NarrationResult"

  /openai/pronunciation:
    post:
      operationId: evaluatePronunciation
      tags: [openai]
      summary: Evaluate a spoken attempt against a target phrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PronunciationInput"
      responses:
        "200":
          description: Pronunciation evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationResult"

  /pilot-capture/eligibility:
    get:
      operationId: getPilotCaptureEligibility
      tags: [openai]
      summary: Whether the caller may use capture mode (TEMPORARY, pilot capture)
      description: >-
        TEMPORARY scaffolding for the pilot calibration corpus: reports
        whether the signed-in user is in the PILOT_CAPTURE_USER_IDS
        allowlist. The web practice page only activates ?mode=capture when
        this returns true. Remove with capture mode.
      responses:
        "200":
          description: Eligibility flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotCaptureEligibility"

  /pilot-capture/discard-last:
    post:
      operationId: discardLastPilotCapture
      tags: [openai]
      summary: Mark the caller's most recent capture-mode clip discarded (TEMPORARY)
      description: >-
        TEMPORARY scaffolding for the pilot calibration corpus: rewrites the
        sidecar of the caller's most recent capture-mode clip with
        discarded=true so the harvest skips it (capture mode's "redo this
        attempt"). Remove with capture mode.
      responses:
        "200":
          description: Discard outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotCaptureDiscardResult"

  /openai/chacha-lines:
    get:
      operationId: getChachaLines
      tags: [openai]
      summary: Chacha-ji's three fixed spoken lines
      description: >-
        Returns the greeting, gift and farewell lines Chacha-ji speaks at his
        roadside stall, each with its text, English gloss and pre-synthesized
        audio in his own voice. The text is fixed romanized Hindi for every
        learner regardless of journey language -- he is the character speaking,
        not content to learn -- so this endpoint takes no parameters. Read-only
        and deliberately separate from POST /journey/chacha-encounters: nothing
        about the Chai grant, the balance or the celebration may be delayed or
        failed by audio. Clips are pre-warmed at server startup; a cache miss
        synthesizes on demand. A line whose synthesis fails is omitted rather
        than failing the response.
      responses:
        "200":
          description: His lines, in encounter order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChachaLinesResult"

  /openai/chacha-call/start:
    post:
      operationId: startChachaCall
      tags: [openai]
      summary: Open a call with Chacha-ji and hear his hello
      description: >-
        Opens a call session pinned to the learner's journey language and
        returns his fixed hello clip. A call is an event, not a lesson: no
        route here carries a score, and none may. Not gated and does not
        spend the weekly chat allowance (owner ruling, 2026-08-28): he rings
        the learner, and billing someone for an incoming call is the wrong
        shape. What bounds the cost is the agenda, fixed before the call
        starts.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChachaCallStartInput"
      responses:
        "200":
          description: The open call and his hello
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChachaCallStart"

  /openai/chacha-call/{callId}/turn:
    post:
      operationId: takeChachaCallTurn
      tags: [openai]
      summary: The learner speaks, he answers
      description: >-
        The learner's clip in, his reply out. With the header
        `X-Audio-Stream: url` the route answers 202 at once with a URL the
        player can pull his voice from progressively (served by
        GET /openai/chat/audio/{streamId}); his words then come from
        GET /openai/chacha-call/{callId}/turn/{index}, which blocks until the
        turn is recorded. Without the header it answers 200 with the whole
        turn and the clip base64'd, which is the shape curl and the tests
        want. The clip is re-encoded to wav or mp3 before either model hears
        it: the route used to trust the client's format label and every turn
        came back empty.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
        - name: X-Audio-Stream
          in: header
          required: false
          schema:
            type: string
            enum: [url]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChachaCallTurnInput"
      responses:
        "200":
          description: The whole turn, audio inline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChachaCallTurnResult"
        "202":
          description: Audio is streaming; the captions follow from the turn read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChachaCallTurnStarted"
        "404":
          description: Unknown call
        "409":
          description: Call is already over

  /openai/chacha-call/{callId}/turn/{index}:
    get:
      operationId: getChachaCallTurn
      tags: [openai]
      summary: What one turn said and paid
      description: >-
        Long-polls for one recorded turn (about twelve seconds at most) and
        returns his captions, what he heard the learner say, and the reward.
        THIS IS THE ONLY RESPONSE THE PHONE READS for a streamed turn, so
        everything a learner must see travels here; a reward that rode only
        on the 200 turn answer reached curl and never a learner. 204 while
        the turn is still being recorded.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The recorded turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChachaCallTurn"
        "204":
          description: Not recorded yet
        "404":
          description: Unknown call

  /openai/chacha-call/{callId}/end:
    post:
      operationId: endChachaCall
      tags: [openai]
      summary: Hang up
      description: His fixed farewell and how the call ended.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The farewell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChachaCallEnd"
        "404":
          description: Unknown call

  /openai/generate-phrase:
    post:
      operationId: generatePhrase
      tags: [openai]
      summary: Generate a fresh practice phrase with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhraseRequest"
      responses:
        "200":
          description: A generated phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPhrase"

  /openai/chat:
    post:
      operationId: chatTurn
      tags: [openai]
      summary: One turn of a live conversation with Bolo the parrot
      description: >-
        Given a learner's recorded speech and a target language, transcribes
        the audio, has Bolo the parrot reply in character and in-language
        (naturally answering "how do you say X" / translation-style meta
        questions), synthesizes the reply to speech, and returns all three
        plus the caller's remaining weekly chat-time allowance. Validates the
        requested language against the caller's plan and, for Free, the
        2-minutes-per-week chat cap before doing any AI work. One Language and
        Plus subscribers are never time-capped (still subject to the
        plan-based language allowlist). Accepts a short recent-turn history so
        replies stay contextual without server-side chat storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatTurnInput"
      responses:
        "200":
          description: The learner's transcript, Bolo's reply, and reply audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTurnResult"
        "402":
          description: >-
            Upgrade required (this language is locked for the caller's plan,
            or the Free weekly chat-time cap has been reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Unknown language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The caller's family-plan status
      description: >-
        Returns the caller's relationship to a family plan: "owner" (with the
        join code and full seat list), "member" (whose plan they're on), or
        "none". `active` reflects whether the owner's subscription currently
        grants the family Plus access.
      responses:
        "200":
          description: The family status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStatus"

  /family/invites:
    post:
      operationId: createFamilyInvite
      tags: [family]
      summary: Invite someone to the family plan by email (owner only)
      description: >-
        Reserves a pending seat and emails a personal join link. Duplicate
        emails are rejected without consuming a seat; a full plan (4 people
        including pending invites) is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyInviteInput"
      responses:
        "201":
          description: The pending invite
          content:
            application/json:
              schema:
                type: object
                required: [id, status, email]
                properties:
                  id: { type: integer }
                  status: { type: string }
                  email: { type: string }
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate invite or the plan is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The invite email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/invites/{seatId}:
    delete:
      operationId: revokeFamilyInvite
      tags: [family]
      summary: Revoke a pending invite, freeing its seat (owner only)
      parameters:
        - name: seatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No pending invite with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/members/{memberUserId}:
    delete:
      operationId: removeFamilyMember
      tags: [family]
      summary: Remove a member from the family plan (owner only)
      description: >-
        Frees the member's seat immediately. The member drops to Free on their
        next request; none of their learning data is deleted.
      parameters:
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: That person isn't on the caller's plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/leave:
    post:
      operationId: leaveFamily
      tags: [family]
      summary: Give up the caller's own family seat
      responses:
        "200":
          description: Left the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: The caller isn't on a family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/code/regenerate:
    post:
      operationId: regenerateFamilyCode
      tags: [family]
      summary: Replace the shareable join code (owner only)
      description: The old code stops working immediately.
      responses:
        "200":
          description: The new join code
          content:
            application/json:
              schema:
                type: object
                required: [joinCode]
                properties:
                  joinCode: { type: string }
        "404":
          description: The caller has no family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/join:
    post:
      operationId: joinFamily
      tags: [family]
      summary: Claim a family seat via join code or emailed invite link
      description: >-
        Joins a family plan. If the caller pays for their own Plus through
        Stripe, that subscription is canceled with proration credit before the
        seat is granted (`previousSubscriptionCanceled` is true in that case).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [ok, ownerName, previousSubscriptionCanceled, active]
                properties:
                  ok: { type: boolean }
                  ownerName: { type: string }
                  previousSubscriptionCanceled: { type: boolean }
                  active: { type: boolean }
        "400":
          description: Neither a code nor an invite token was provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid code or invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Plan full, already on a plan, or the invite was used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The caller's existing subscription couldn't be closed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scenarios:
    get:
      operationId: listScenarios
      tags: [openai]
      summary: Which zones have a capstone scenario in this language
      description: >-
        Lists the zone capstone scenes available for a language, so the journey
        map can decide which zones to offer a capstone on without hardcoding a
        zone-to-scenario table in every client. Only scenes that actually
        resolve are listed: a zone whose category has no content in this
        language has no capstone and must not be offered one.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: Language code the capstones would be played in.
      responses:
        "200":
          description: Available capstone scenes, ordered by zone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioSummary"
        "400":
          description: Missing language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [openai]
      summary: Fetch client-safe metadata for a zone capstone scenario
      description: >-
        Returns the public subset of a scenario (title, framing copy, target
        phrases). Steering instructions are never sent to the client. Auth
        required; no entitlement gate -- the gate is on POST /openai/chat.

        Target phrases are drawn from the learner's own seeded content for the
        scene's category, so `lang` is required: a scene is language-neutral
        but its chips never are.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Scenario id (e.g. "greetings-manners")
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: >-
            Language code the capstone is being played in. Determines the target
            phrases and the language the model is steered to speak.
      responses:
        "200":
          description: Scenario metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioPublic"
        "400":
          description: Missing language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unknown scenario id, unknown language, or no content for this scene
            in this language (an unfinishable capstone is never served)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /journey/zone-stamps:
    get:
      operationId: listZoneStamps
      tags: [learning]
      summary: List zone capstone conversation stamps for the caller
      description: >-
        Returns a lightweight list of zones the caller has already completed
        the capstone conversation for. Used by the journey map to show "Replay
        the chat" links on completed zones.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: Language code to filter stamps by.
      responses:
        "200":
          description: List of completed zone stamps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneStamp"

  /referral:
    get:
      operationId: getReferral
      tags: [referral]
      summary: The caller's referral code and referral stats
      description: >-
        Returns the caller's shareable referral code (minted lazily on the
        first fetch; short uppercase string from an unambiguous alphabet with
        no 0/O/1/I), counts of pending and activated redemptions attributed
        to the caller, and the total Chai earned from referrals. The Chai
        total is derived from the token ledger, never a stored counter.
      responses:
        "200":
          description: Referral summary for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"

  /referral/redeem:
    post:
      operationId: redeemReferral
      tags: [referral]
      summary: Redeem another learner's referral code
      description: >-
        Records attribution ONLY; nothing is granted at redeem time. Grants
        for both sides land later, when the referee's first completed session
        activates the redemption server-side. A learner can redeem at most
        one code ever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralRedeemInput"
      responses:
        "201":
          description: Attribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralRedeemResult"
        "400":
          description: >-
            Invalid payload, or self-referral ("You cannot use your own
            code.").
        "404":
          description: >-
            Unknown code ("That code did not match. Check it and try
            again.").
        "409":
          description: >-
            Caller already redeemed a code ("You have already used a referral
            code.").

  /journey/signal-waves:
    post:
      operationId: recordSignalWave
      tags: [learning]
      summary: Persist a signal wave-through for the caller
      description: >-
        Records that the caller waved through a trackside signal without
        playing its quick game, so the gate-up state survives devices and
        reinstalls. Idempotent — replaying the same signal is a silent no-op.
        The ref is composed server-side as languageCode:categoryId:gap-N,
        matching the first-clear ledger refId convention; a later clear
        supersedes the wave for display, so waves are never deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalWaveInput"
      responses:
        "200":
          description: Wave recorded (or already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalWaveResult"

  /journey/chacha-encounters:
    post:
      operationId: recordChachaEncounter
      tags: [learning]
      summary: Arrive at a Chacha-ji encounter station
      description: >-
        The learner has reached one of Chacha-ji's roadside stall stations
        (global station index 3, 7, 11, and every fourth station after that).
        Pours the Chai for a first arrival, returns the short phrase he says
        and, on every third encounter, an offer from the stall. Idempotent:
        the gift is paid once per learner per station, so a revisit replays
        the same encounter with granted false. 404 when the station is not
        one of his or does not exist in this language's journey.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChachaEncounterInput"
      responses:
        "200":
          description: The encounter at this station
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChachaEncounterResult"
        "404":
          description: No encounter at this station

  /tokens:
    get:
      operationId: getTokens
      tags: [tokens]
      summary: Current Chai balance and convenience-item state
      responses:
        "200":
          description: The caller's token state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenState"
  /tokens/history:
    get:
      operationId: getTokenHistory
      tags: [tokens]
      summary: The caller's ten most recent Chai movements
      description: >-
        A receipt strip for the wallet sheet, not a statement: the last ten
        ledger rows, newest first, with no pagination. Each row carries a
        learner-facing label resolved server-side, never the raw ledger reason,
        so the wording cannot drift between platforms. refId and balanceAfter
        are deliberately withheld.
      responses:
        "200":
          description: The caller's recent Chai movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenHistory"
  /tokens/spend:
    post:
      operationId: spendTokens
      tags: [tokens]
      summary: Spend Chai on a convenience item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokensSpendInput"
      responses:
        "200":
          description: Spend applied (or duplicate refId no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSpendResult"
        "409":
          description: insufficient_tokens, pause_max_equipped, or multiplier_active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tokens/first-class:
    post:
      operationId: buyFirstClass
      tags: [tokens]
      summary: Spend Chai on 24 hours of First Class
      description: >-
        Buys 24 hours of First Class — a cosmetic status that renders the
        learner's own train in gold — plus one complimentary 20-minute Express
        boost thrown in on boarding. The caller supplies ONLY an idempotency
        key: the price, the 24 hours and the bundled boost are all server-side.
        Unlike every other Chai spend this purchase is repeatable, so a repeat
        call with the SAME key is a free replay (200, charged=false) while a
        new key is a genuine second purchase that adds another 24 hours to an
        active expiry. The bundled boost takes the max of its current value and
        20 minutes from now, so it never shortens a longer running window and
        never accumulates. Money and clock conflicts (insufficient_tokens,
        first_class_horizon) answer 409, matching the other Chai spends; never
        402, which is the plan-upgrade envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstClassInput"
      responses:
        "200":
          description: Bought, or a replay of the same key — charged=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstClassResult"
        "409":
          description: insufficient_tokens or first_class_horizon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tokens/unlock-stop:
    post:
      operationId: unlockStop
      tags: [tokens]
      summary: Spend Chai to open one stop in a plan-locked language
      description: >-
        Buys a single station in a language the caller's plan does not include.
        The caller names only a lesson group id: the language, the price and the
        ledger idempotency key are all derived server-side, and the purchase is
        once-ever (a repeat call returns 200 with charged=false and deducts
        nothing). Only stops inside the language's FIRST zone — the zone that
        hosts the free-taste stop — are purchasable; anything beyond it answers
        402 UpgradeRequired because that is the All-Access boundary. Money and
        state conflicts (insufficient_tokens, stop_already_free,
        stop_not_unlockable) answer 409, matching the other Chai spends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockStopInput"
      responses:
        "200":
          description: Stop unlocked (or already owned — charged=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopUnlockResult"
        "402":
          description: Beyond the first zone — All-Access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "409":
          description: insufficient_tokens, stop_already_free, or stop_not_unlockable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tokens/streak-repair:
    get:
      operationId: getStreakRepair
      tags: [tokens]
      summary: Whether a broken streak can be mended, and for how much
      description: >-
        Streak repair is the ratified exception to the delight-only Chai spine:
        it buys back a streak lost to life happening, never an advantage. A day
        is repairable only when it is a real hole with practice on the day
        before it, and only within two local days — so at most one break is
        ever on offer and repairs cannot be walked backwards through history.
      responses:
        "200":
          description: The offer, or eligible=false when there is nothing to mend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakRepairOffer"
  /tokens/repair-streak:
    post:
      operationId: repairStreak
      tags: [tokens]
      summary: Spend Chai to mend the day that broke the streak
      description: >-
        Takes no body. The server re-derives which day is repairable, composes
        the ledger key from it (streak:<YYYY-MM-DD>), and charges
        STREAK_REPAIR_COST once — a replay answers 200 with charged=false and
        deducts nothing. Refusals are 409 and never 402: a broken streak is not
        a plan boundary and must never become an upsell.
      responses:
        "200":
          description: Streak mended (or already mended — charged=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakRepairResult"
        "409":
          description: >-
            insufficient_tokens, no_break_to_repair, break_too_long, or
            repair_window_expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tokens/gift:
    get:
      operationId: getDailyGift
      tags: [tokens]
      summary: Today's gift box, and whether it is still worth tapping
      description: >-
        NOT A NEW REWARD. The app has paid 1 Chai a day for showing up since
        long before this, granted silently on the day's first attempt, and
        nobody ever saw it happen. THE TAP IS THE GRANT now (owner ruling,
        2026-09-04): the same reason code, the same local-day refId and the same
        ledger idempotency, moved to POST /tokens/gift/claim so a learner opens
        a box for it and reads what tomorrow's is worth.


        The whole state is derived from the streak ladder and the ledger, so a
        box drawn from here and a box claimed by the POST cannot disagree about
        the day, the amount or whether it is still open.


        THE PRECONDITION IS AN EARNED DAY, not an attempt: a streak day is a day
        the learner completed a lesson or played a mini-game, in any language.
        `earnedToday` false and `claimable` false together mean "practise
        first", which is a different box from "come back tomorrow".
      responses:
        "200":
          description: Today's box
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyGiftState"
  /tokens/gift/claim:
    post:
      operationId: claimDailyGift
      tags: [tokens]
      summary: Open today's box. This call IS the grant.
      description: >-
        Takes no body, and reads none: the amount is derived from the learner's
        own streak ladder, because a client that could name its own number would
        be a faucet. Grants `earn_streak_day` with the local day as the refId,
        so the ledger's unique index on (userId, reason, refId) makes a double
        tap, a retried request and a second device land on ONE payment.


        A replay answers 200 with `granted` false and the same open box rather
        than an error. Refusal is 409 and never 402: practising is not a plan
        boundary and a learner must never be upsold over one.


        THE FORFEIT IS THE OTHER HALF OF THE RULING. There is no backlog and no
        claiming yesterday, because claiming is always keyed on today. A learner
        who practised and never tapped gets nothing for that day, which is only
        fair because the box is offered where practice ends as well as on Home.
      responses:
        "200":
          description: Opened (or already opened, with granted=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyGiftClaimResult"
        "409":
          description: no_gift_today, when nothing has been practised today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chai-packs:
    get:
      operationId: getChaiPacks
      tags: [tokens]
      summary: The Chai packs, their Apple product ids and what each grants
      description: >-
        The mobile shop's catalog. Deliberately NOT part of GET /pricing: that
        endpoint quotes live Stripe prices and fails when Stripe is
        unreachable, and the iOS shop must not depend on the web payment
        processor. It also carries no price at all — on iOS the price shown is
        the StoreKit product's own, so no server number can drift from what
        Apple charges. The Chai amount is the same catalog the credit path
        grants from, so the shop cannot advertise a pack size the purchase does
        not deliver.
      responses:
        "200":
          description: The pack catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChaiPackCatalog"
  /chai-packs/credited:
    post:
      operationId: checkChaiPackCredits
      tags: [tokens]
      summary: Which of these App Store transactions has the ledger credited
      description: >-
        A read, expressed as a POST because the input is a list. The app can
        see which consumables Apple sold it but not whether the server credited
        them; this answers that and nothing else. It never writes, never states
        an amount, and can never mint Chai — recovery works by asking the store
        to re-deliver an uncredited transaction, and double-crediting is
        prevented by the ledger's refId index rather than by client
        bookkeeping. Only the caller's own ledger is consulted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChaiPackCreditsInput"
      responses:
        "200":
          description: The subset of the given transaction ids already credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChaiPackCreditsResult"

  /outfits:
    get:
      operationId: getOutfits
      tags: [outfits]
      summary: Outfit catalog with prices, ownership and the equipped choice
      responses:
        "200":
          description: The catalog as it stands for this learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitCatalog"
  /outfits/buy:
    post:
      operationId: buyOutfit
      tags: [outfits]
      summary: Spend Chai on an outfit for Bolo
      description: >-
        Buys an outfit once-ever. Ownership is the ledger row (refId
        outfit:<id>), so a repeat call returns 200 with charged=false, deducts
        nothing and leaves the equipped choice untouched. A purchase that does
        charge also equips the outfit, because buying it is the act of putting
        it on. Insufficient balance answers 409, matching the other Chai
        spends; an unknown outfit id answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyOutfitInput"
      responses:
        "200":
          description: Bought (or already owned — charged=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitPurchaseResult"
        "404":
          description: No such outfit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: insufficient_tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /outfits/equip:
    post:
      operationId: equipOutfit
      tags: [outfits]
      summary: Wear an owned outfit, or go back to undressed Bolo
      description: >-
        Free and instant. Sends an owned outfit id to wear it, or null to
        unequip. Equipping an outfit the learner does not own answers 409
        outfit_not_owned — ownership is never inferred from the equip call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipOutfitInput"
      responses:
        "200":
          description: The equipped choice after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitEquipResult"
        "404":
          description: No such outfit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: outfit_not_owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /push/register:
    post:
      operationId: registerPushToken
      tags: [account]
      summary: Register this device for server-sent notifications
      description: >-
        Records the caller's Expo push token so the server can reach this
        device. Distinct from the LOCAL daily reminder, which the app schedules
        for itself and which needs no server at all.


        Called on EVERY cold start, not only the first. Expo may rotate a token
        at any time and emits no event when it does, so re-asserting on launch
        is the only reliable way to hold a current address. It also refreshes
        last_seen_at, which is how a dead install is eventually told apart from
        a quiet one.


        A token is unique across the whole table, not per user: a token
        identifies an INSTALL, and an install changes hands (a shared family
        iPad, a phone signed out and back in). Registering therefore MOVES a
        token to the caller rather than adding a second row, and revives it if
        it had been disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Expo push token, "ExponentPushToken[...]".
                platform:
                  type: string
                  enum: [ios, android]
              required: [token, platform]
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered:
                    type: boolean
                required: [registered]
        "400":
          description: Not an Expo push token, or missing platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unregisterPushToken
      tags: [account]
      summary: Stop pushing to this device
      description: >-
        Scoped to the caller's own rows, so knowing a token is not enough to
        silence someone else's device. A token that is not registered returns
        the same 204 as one that was removed: whether a given device is
        registered is not something this endpoint should confirm to a stranger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "204":
          description: No longer registered
        "400":
          description: token is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    CreateFamilyInviteInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        basePath:
          type: string
          description: The web app's base path, used to build the join link.

    JoinFamilyInput:
      type: object
      properties:
        code: { type: string }
        inviteToken: { type: string }

    FamilySeat:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, active]
        email:
          type: string
          nullable: true
        memberUserId:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        joinedAt:
          type: string
          nullable: true

    FamilyStatus:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, member, none]
        active:
          type: boolean
        joinCode:
          type: string
        capacity:
          type: integer
        seats:
          type: array
          items:
            $ref: "#/components/schemas/FamilySeat"
        ownerName:
          type: string
        joinedAt:
          type: string
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AccountProfile:
      type: object
      description: The learner's identity fields, mirrored from Clerk.
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
          description: >-
            The learner's public name, null until they set one. NULL IS ALSO
            THE PROMPT SIGNAL: every account begins null, including accounts
            years old, so a client that prompts on null prompts every existing
            learner exactly once.
        shareStats:
          type: boolean
          description: False when the learner has opted out of every global surface.
      required:
        - id
        - email
        - displayName
        - avatarUrl
        - username
        - shareStats

    AccountNotificationPreferences:
      type: object
      properties:
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          nullable: true
          description: Preferred local send time as "HH:MM" (24h), or null.
      required:
        - dailyReminderEnabled
        - dailyReminderTime

    AccountLearningPreferences:
      type: object
      properties:
        activeLanguage:
          type: string
          nullable: true
          description: The language code the learner is actively studying, or null.
        dailyGoal:
          type: integer
          description: Target attempts per day (1–100).
        theme:
          type: string
          description: Client colour theme ("system" | "light" | "dark").
        timezone:
          type: string
          nullable: true
          description: >-
            IANA time zone (e.g. "America/Los_Angeles") used to bucket practice
            into local calendar days for streaks, or null (falls back to UTC).
        hasCompletedTour:
          type: boolean
          description: >-
            Whether the learner has completed (or explicitly skipped) the
            onboarding tour. Defaults to false for new and existing users.
        hasChosenLanguage:
          type: boolean
          description: >-
            Whether the learner has EXPLICITLY chosen a learning language (the
            post-sign-up selection step, the home picker, or account settings).
            Distinct from activeLanguage being non-null — the web client seeds
            that with a local default on first reconcile. Optional for mobile
            back-compat; treat absence as false.
        ttsVoice:
          type: string
          nullable: true
          description: >-
            The learner's global TTS voice preference (Plus only). When non-null
            this is an ElevenLabs premade voice ID from the VOICE_CATALOG. Null
            means Auto — use the per-language default voice.
      required:
        - activeLanguage
        - dailyGoal
        - theme
        - timezone
        - hasCompletedTour
        - ttsVoice

    AccountPreferences:
      type: object
      properties:
        notifications:
          $ref: "#/components/schemas/AccountNotificationPreferences"
        learning:
          $ref: "#/components/schemas/AccountLearningPreferences"
      required:
        - notifications
        - learning

    AccountSubscriptionSummary:
      type: object
      description: A compact subscription block returned inline by GET /account.
      properties:
        tier:
          type: string
        status:
          type: string
        chosenLanguage:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        pauseUntil:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        retentionOfferAcceptedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - tier
        - status
        - chosenLanguage
        - trialEndsAt
        - currentPeriodEnd
        - pauseUntil
        - cancelAtPeriodEnd
        - retentionOfferAcceptedAt

    PaymentMethodSummary:
      type: object
      description: >-
        A best-effort summary of how the subscription is billed. Every field is
        nullable because the provider may not expose it.
      properties:
        store:
          type: string
          nullable: true
          description: The store/processor the subscription is billed through.
        managementUrl:
          type: string
          nullable: true
          description: A link where the customer can manage/cancel with the store.
      required:
        - store
        - managementUrl

    BillingHistoryEntry:
      type: object
      description: One subscription period from the provider's billing history.
      properties:
        productId:
          type: string
        store:
          type: string
          nullable: true
        purchasedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        periodType:
          type: string
          nullable: true
        status:
          type: string
          description: '"active" | "expired" | "canceled" — derived from the dates/flags.'
      required:
        - productId
        - store
        - purchasedAt
        - expiresAt
        - periodType
        - status

    SubscriptionDetails:
      type: object
      description: >-
        The full subscription-management snapshot: the server-authoritative
        tier/status/dates and chosen language, plus the softer provider-sourced
        payment method and billing history (which degrade gracefully).
      properties:
        tier:
          type: string
        status:
          type: string
        chosenLanguage:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        pauseUntil:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        retentionOfferAcceptedAt:
          type: string
          format: date-time
          nullable: true
        provider:
          type: string
          nullable: true
        paymentMethod:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentMethodSummary"
        billingHistory:
          type: array
          items:
            $ref: "#/components/schemas/BillingHistoryEntry"
      required:
        - tier
        - status
        - chosenLanguage
        - trialEndsAt
        - currentPeriodEnd
        - pauseUntil
        - cancelAtPeriodEnd
        - retentionOfferAcceptedAt
        - provider
        - paymentMethod
        - billingHistory

    PauseSubscriptionInput:
      type: object
      description: How long to pause the subscription for.
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 3
          description: Number of months to pause (1–3). Defaults to 1 if omitted.

    Account:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/AccountProfile"
        preferences:
          $ref: "#/components/schemas/AccountPreferences"
        subscription:
          $ref: "#/components/schemas/AccountSubscriptionSummary"
      required:
        - profile
        - preferences
        - subscription

    AccountProfileResult:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/AccountProfile"
      required:
        - profile

    AccountPreferencesResult:
      type: object
      properties:
        preferences:
          $ref: "#/components/schemas/AccountPreferences"
      required:
        - preferences

    ChatMemory:
      type: object
      description: >-
        One note Bolo has kept about a learner, distilled from a chat turn. The
        sentence is ENGLISH whatever language the lesson was in, because it is
        written to be read by the model rather than by the learner.
      properties:
        id:
          type: integer
        memory:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - memory
        - createdAt

    ChatMemoriesResult:
      type: object
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/ChatMemory"
      required:
        - memories

    ForgetMemoriesResult:
      type: object
      properties:
        forgotten:
          type: integer
          description: How many memories were deleted.
      required:
        - forgotten

    UpdateProfileInput:
      type: object
      description: Any subset of the editable profile fields.
      properties:
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
          description: >-
            The learner's PUBLIC name, seen by strangers on the global feed and
            board. Distinct from `displayName`, which is private and is what
            Bolo calls them. Screened server-side for shape, reserved words and
            profanity, and unique case-insensitively; a refusal comes back as
            400 with a sentence to show the learner, and a name already taken
            as 409.

            NULL, OR AN EMPTY STRING, CLEARS IT, and that was not possible
            before 2026-08-27. The account screen has always told learners
            "leave it empty" and the field simply refused: the client returned
            early on an empty value and the server answered 400 because an
            empty name fails the minimum-length screen. So a public name was
            permanent from the moment it was first set, on an app children use,
            under a sentence promising the opposite.

            CLEARING IS NOT LEAVING. `shareStats: false` is what takes a learner
            off the global surfaces; clearing the name only gives up the CHOSEN
            one, and they carry on appearing under the stable pseudonym every
            un-named learner already has. The two controls are different
            promises and the screen now says so.
        shareStats:
          type: boolean
          description: >-
            False keeps the learner off every global surface while KEEPING their
            username, for someone who named themselves and later wants out
            without erasing the name.

    UpdatePreferencesInput:
      type: object
      description: Any subset of the notification and learning preferences.
      properties:
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          nullable: true
        activeLanguage:
          type: string
          nullable: true
        dailyGoal:
          type: integer
        theme:
          type: string
          enum: [system, light, dark]
        timezone:
          type: string
          nullable: true
        hasCompletedTour:
          type: boolean
        hasChosenLanguage:
          type: boolean
          description: >-
            Marks the learner as having explicitly chosen a language. Only
            `true` is accepted — a choice can't be unmade. Sent by explicit
            picks (selection step, home picker, account settings); the
            client's first-reconcile seed write must never include it.
        ttsVoice:
          type: string
          nullable: true
          description: >-
            Global TTS voice preference (Plus only). Must be a valid voice ID
            from the voice catalog, or null to reset to Auto.

    DeleteAccountResult:
      type: object
      properties:
        deleted:
          type: boolean
      required:
        - deleted

    SetChosenLanguageInput:
      type: object
      properties:
        language:
          type: string
          description: The language code to unlock (must not be Hindi).
      required:
        - language

    Language:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        nativeName:
          type: string
        script:
          type: string
        fontFamily:
          type: string
        rtl:
          type: boolean
        sortOrder:
          type: integer
        speechCapability:
          type: string
          enum: [supported, degraded, unsupported]
          description: >
            How well speech recognition actually hears this language, verified
            by a per-language probe. `supported` = full scored practice.
            `degraded` = scoring runs but unverifiable failures soften to
            nocatch; clients show a one-time "feedback is approximate" notice.
            `unsupported` = recognition verifiably fails on correct speech;
            clients switch to listen-record-compare practice with no scored
            band. Optional for mobile back-compat; treat absence as `supported`.
        communityReviewed:
          type: boolean
          description: >-
            True when this language's lesson content is primarily
            batch-generated (the C1 rollout set) with community review ongoing
            — clients may show a one-line "you can flag anything that looks
            wrong" note. Derived server-side from the committed rollout data;
            never hardcode the set client-side. Optional for mobile
            back-compat; treat absence as false.
      required:
        - code
        - name
        - nativeName
        - script
        - fontFamily
        - rtl
        - sortOrder

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        accent:
          type: string
        sortOrder:
          type: integer
        titleNative:
          type: ["string", "null"]
        phraseCount:
          type: integer
          description: >-
            How many phrase rows this caller can see in the topic. This is the
            number the topic's phrase ceiling is measured against.
        masteredCount:
          type: integer
        phraseCeiling:
          type: integer
          description: >-
            The most phrases this topic may grow to on the caller's plan
            (visible rows, phrase stage only). Server-authoritative: clients
            must not hardcode it. When phraseCount has reached it, "Add more
            phrases" is not offered.
        lockedPhraseCount:
          type: integer
          description: >-
            How many additional phrases upgrading to Bolo! Plus would unlock for
            this topic. Always 0 for a caller who already has the extended
            library.
        openPhraseCount:
          type: integer
          description: >-
            How many of phraseCount the caller can open right now, given how far
            the JOURNEY has carried them. The phrases route serves only phrases
            in unlocked lesson groups and a journey stop is a lesson group, so a
            topic can hold phrases and serve none of them. 0 means a shut door.
            A count rather than a boolean because a topic is not simply open or
            shut: a learner part-way through a topic can open part of it.
            Optional/additive -- absent clients behave as if every topic is
            fully open, which is the behaviour they had before this field.
        sentenceCount:
          type: integer
          description: >-
            How many full sentences the topic's Plus-only sentence stage holds
            (the final step after the phrase list). 0 when the stage has not
            been generated yet for this language.
        sentencesLocked:
          type: boolean
          description: >-
            Whether the sentence stage is locked for this caller (true for
            everyone without Bolo! Plus). Server-authoritative; clients show
            an upgrade nudge instead of requesting the sentences.
        polishEnabled:
          type: boolean
          description: >-
            Server feature flag: when true, the client should show the Polish
            re-run card on stop completion and Polish re-entry on journey
            station cards. Gated by POLISH_ENABLED env var (default false).
            Optional/additive -- absent clients behave as if false.
      required:
        - id
        - slug
        - title
        - description
        - iconName
        - accent
        - sortOrder
        - titleNative
        - phraseCount
        - masteredCount
        - lockedPhraseCount
        - sentenceCount
        - sentencesLocked

    Phrase:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        hint:
          type: ["string", "null"]
        difficulty:
          type: integer
        sortOrder:
          type: integer
        bestScore:
          type: ["integer", "null"]
        mastered:
          type: boolean
        attemptCount:
          type: integer
        bestBand:
          type: ["string", "null"]
          description: >-
            The best band the learner has achieved on this phrase (derived from
            bestScore). One of "perfect", "great", "good", "almost", "retry".
            Null when the phrase has never been attempted. Optional/additive.
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
      required:
        - id
        - categoryId
        - languageCode
        - nativeScript
        - romanized
        - english
        - hint
        - difficulty
        - sortOrder
        - bestScore
        - mastered
        - attemptCount

    LessonGroupSummary:
      type: object
      properties:
        id:
          type: integer
        position:
          type: integer
        title:
          type: ["string", "null"]
        phraseCount:
          type: integer
        attemptedCount:
          type: integer
        masteredCount:
          type: integer
        status:
          type: string
          enum: [locked, unlocked, in_progress, completed, tested_out]
          description: >-
            Sequential unlock state, derived at read time. A group is completed
            when at least 80% of its phrases reach bestScore >= 80; unlocked
            when it is first or its predecessor is completed/tested_out;
            tested_out when the learner passed the test-out assessment.
            Optional/additive - older clients may ignore it.
        stage:
          type: string
          enum: [phrase, sentence]
          description: >-
            Which learning stage this group's members belong to: the starter
            "phrase" list every topic opens with, or the Plus-only "sentence"
            stage. Derived from the group's member phrases (groups are
            homogeneous by construction); an empty group reads as "phrase".
            Optional/additive - part of the journey-map contract mobile reuses.
        teaserStation:
          type: boolean
          description: >-
            True on the single station that hosts the M1 teaser phrases when
            the caller views a plan-locked language in teaser mode (the
            journey map's visibly marked "free taste" stop). Absent on every
            other group and in every other access state.
        allTopBand:
          type: boolean
          description: >-
            True when every phrase in this group has been attempted and the
            learner's best band is "perfect" or "great" (score >= 80) on all
            of them. Used to show the gold stamp overlay on the journey map
            when POLISH_ENABLED is on. Optional/additive.
        chaiUnlocked:
          type: boolean
          description: >-
            True when the learner has BOUGHT this stop with Chai in a
            plan-locked language. The stop opens exactly like the free-taste
            stop, and because ownership is a ledger row it survives a
            reinstall. Present only in showroom payloads. Optional/additive.
        chaiUnlockable:
          type: boolean
          description: >-
            True when this stop is offered for Chai: inside the language's
            first zone, not the free stop, not already bought, and holding at
            least one phrase the caller's plan can practise. Absent everywhere
            else — a station without it can only be opened by All-Access, and
            the server refuses a purchase attempt on one. Optional/additive.
        planLocked:
          type: boolean
          description: >-
            True when the caller's plan can see ZERO of this group's phrases
            (every member is premium and the caller lacks extended-library
            access), so the station is reported locked with a Plus upsell
            instead of an unlocked stop that would serve an empty practice
            session. For these callers phraseCount/attemptedCount/
            masteredCount count only plan-visible phrases. Absent for
            extended-library callers and in showroom (teaser/exhausted)
            payloads. Optional/additive.

    LessonGroupTestoutSample:
      type: object
      properties:
        phrases:
          type: array
          items:
            $ref: "#/components/schemas/Phrase"
        sampleSize:
          type: integer
        requiredCorrect:
          type: integer

    LessonGroupTestoutInput:
      type: object
      properties:
        attempts:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              phraseId:
                type: integer
              evaluationToken:
                type: string
                minLength: 1
            required: [phraseId, evaluationToken]
      required: [attempts]

    ZoneTestoutInput:
      type: object
      properties:
        languageCode:
          type: string
          minLength: 1
        attempts:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            properties:
              phraseId:
                type: integer
              evaluationToken:
                type: string
                minLength: 1
            required: [phraseId, evaluationToken]
      required: [languageCode, attempts]

    LessonGroupTestoutResult:
      type: object
      properties:
        passed:
          type: boolean
        correctCount:
          type: integer
        requiredCorrect:
          type: integer
        sampleSize:
          type: integer
        status:
          type: string
          enum: [tested_out]

    LessonGroupList:
      type: object
      properties:
        lessonGroups:
          type: array
          items:
            $ref: "#/components/schemas/LessonGroupSummary"
        unassignedCount:
          type: integer
        access:
          type: string
          enum: [teaser, exhausted]
          description: >-
            Present only for a plan-locked language on this one read-only
            route, which deliberately returns the full zone/station structure
            instead of a 402 so the journey map can render as the paywall's
            showroom (counts and statuses only, zero phrase content,
            everything locked except the marked teaser station). "teaser"
            while free taster phrases remain, "exhausted" once used up. A
            plan-locked language with no teaser set still 402s. Absent for an
            allowed language.
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
        stopUnlock:
          $ref: "#/components/schemas/StopUnlockOffer"
        signals:
          $ref: "#/components/schemas/ZoneSignalStates"

    ZoneSignalStates:
      type: object
      description: >-
        Per-signal server truth for this zone's trackside signals, riding the
        existing journey fetch. `waves` and `clears` are bare gap-N
        contextRefs scoped to this category (stored server-side as
        languageCode:categoryId:gap-N). Clears are derived from the
        ledger-backed first-clear grants; a clear supersedes a wave for
        display. `rewardChai` is the single-source first-clear amount the
        server grants (config permits per-line values later) — clients must
        render it, never a hardcoded number.
      properties:
        rewardChai:
          type: integer
        encounterChai:
          type: integer
          description: >-
            What Chacha-ji pours at his stall on a first arrival, served on
            every zone payload since 99bb369e so the invitation chip under
            the stall can read it. Never a client constant: mobile's first
            cut read rewardChai instead and said 1 where he pours 3.
        waves:
          type: array
          items:
            type: string
        clears:
          type: array
          items:
            type: string
      required:
        - rewardChai
        - encounterChai
        - waves
        - clears

    SignalWaveInput:
      type: object
      description: >-
        Identifies the waved signal. The server composes the stored ref as
        languageCode:categoryId:gap-N from these fields.
      properties:
        languageCode:
          type: string
          pattern: "^[a-z]{2,3}$"
        categoryId:
          type: integer
          minimum: 1
        gap:
          type: integer
          minimum: 1
          maximum: 999
          description: Global gap number N — the signal sits after stop N.
      required:
        - languageCode
        - categoryId
        - gap

    SignalWaveResult:
      type: object
      properties:
        ref:
          type: string
          description: The stored ref, languageCode:categoryId:gap-N.
      required:
        - ref

    ChachaEncounterInput:
      type: object
      description: Where the learner has arrived, on the global station index.
      properties:
        languageCode:
          type: string
          pattern: "^[a-z]{2,3}$"
        station:
          type: integer
          minimum: 1
          maximum: 999
          description: >-
            Global station index across the six zones, not the per-zone
            "Stop N of M" number. Must be one of Chacha-ji's stations.
      required:
        - languageCode
        - station

    ChachaEncounterPhrase:
      type: object
      description: The short line Chacha-ji says, read-only (never scored).
      properties:
        id:
          type: integer
        nativeScript:
          type: string
        romanized:
          type: string
          nullable: true
        english:
          type: string
      required:
        - id
        - nativeScript
        - english

    ChachaEncounterOffer:
      type: object
      description: >-
        An item from the stall, already filtered to something the learner does
        not own and can afford right now.
      properties:
        outfitId:
          type: string
        name:
          type: string
        tagline:
          type: string
        cost:
          type: integer
        kind:
          type: string
          enum: [garment, accessory]
      required:
        - outfitId
        - name
        - tagline
        - cost
        - kind

    ChachaEncounterResult:
      type: object
      properties:
        station:
          type: integer
        ordinal:
          type: integer
          description: Which encounter of the journey this is, 1-based.
        granted:
          type: boolean
          description: >-
            True only when this call paid the Chai. The celebration plays on
            this and nothing else, so a revisit stays quiet.
        chaiGranted:
          type: integer
        balance:
          type: integer
          description: Chai balance after the gift.
        callsNow:
          type: boolean
          description: >-
            His phone rings at this stop. The server decides, not the client:
            true at one encounter station per zone (zone 1 fixed at station
            3, later zones chosen by a hash of learner, language and zone so
            a revisit meets it at the same stop). The call is an interruption
            that replaces the walk into practice; it never delays it.
        phrase:
          allOf:
            - $ref: "#/components/schemas/ChachaEncounterPhrase"
          nullable: true
        offer:
          allOf:
            - $ref: "#/components/schemas/ChachaEncounterOffer"
          nullable: true
      required:
        - station
        - ordinal
        - granted
        - chaiGranted
        - balance
        - callsNow

    ChachaCallMode:
      type: string
      enum: [journey, game]
      description: >-
        TWO CALLS, NOT ONE. `journey` is the unsolicited interruption on the
        map: five questions and he says goodbye, bounded because nobody asked
        for it. `game` is the one on the games hub, chosen as often as the
        learner likes and capped at twenty turns.

    ChachaCallStartInput:
      type: object
      description: >-
        Which call this is. Anything but `game` opens the journey call, the
        shorter one, which is the safe default.
      properties:
        mode:
          $ref: "#/components/schemas/ChachaCallMode"

    ChachaCallBeat:
      type: object
      description: One thing he says, with the caption lines under it.
      properties:
        id:
          type: string
        index:
          type: integer
        text:
          type: string
          description: His words, in the language the call is fixed to.
        romanized:
          type: string
          nullable: true
          description: >-
            The romanization beneath them. Null when the script cannot be
            transliterated honestly, or when it would only repeat the line.
        english:
          type: string
          nullable: true
        canned:
          type: boolean
          description: A fixed clip from tts_cache rather than a live model turn.
        isFinal:
          type: boolean
      required:
        - id
        - index
        - text
        - romanized
        - english
        - canned
        - isFinal

    ChachaCallBackdrop:
      type: object
      description: >-
        The clip that loops behind him for this call and no other. Fixed at
        creation, so a client that reconnects gets the same one back rather
        than changing cars mid-sentence.
      properties:
        id:
          type: string
          enum: [driving, backseat]
        video:
          type: string
        poster:
          type: string
        seconds:
          type: number
      required:
        - id
        - video
        - poster
        - seconds

    ChachaCallNext:
      type: object
      description: The beat that follows.
      properties:
        id:
          type: string
        index:
          type: integer
        canned:
          type: boolean
      required:
        - id
        - index
        - canned

    ChachaCallStart:
      type: object
      properties:
        callId:
          type: string
        languageName:
          type: string
          description: >-
            The language the call is FIXED to, from the session rather than
            the client's live context: a learner switching language mid-call
            keeps talking to the same Chacha-ji.
        languageCode:
          type: string
        beat:
          $ref: "#/components/schemas/ChachaCallBeat"
        mode:
          $ref: "#/components/schemas/ChachaCallMode"
        learnerTurns:
          type: integer
          description: >-
            How many times the learner will be asked to speak. Known before
            the call starts, which is the point of a semi-scripted agenda.
        backdrop:
          $ref: "#/components/schemas/ChachaCallBackdrop"
        selfView:
          type: boolean
          description: >-
            Whether the phone may show the learner their own camera. A server
            flag so it can be turned off without a build; false and absent
            both mean off, and a client must never default it on: 1.0.5 (520)
            mounted the camera unconditionally ("i don't want the camera in
            the call").
        audioBase64:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
      required:
        - callId
        - languageName
        - languageCode
        - beat
        - mode
        - learnerTurns
        - backdrop
        - selfView
        - audioBase64
        - format

    ChachaCallTurnInput:
      type: object
      properties:
        audioBase64:
          type: string
          description: The learner's clip, in whatever container the device recorded.
        format:
          type: string
          enum: [wav, mp3]
          description: >-
            What the client believes it recorded. Anything but mp3 reads as
            wav; the server detects the real container regardless.
      required:
        - audioBase64

    ChachaCallTurnStarted:
      type: object
      description: >-
        The 202 answer to a streamed turn. Pull his voice from `audioUrl`
        now; read his words from the turn endpoint once it is recorded.
      properties:
        callId:
          type: string
        audioUrl:
          type: string
      required:
        - callId
        - audioUrl

    ChachaCallTurnResult:
      type: object
      description: The whole turn in one answer, audio inline.
      properties:
        callId:
          type: string
        chaiEarned:
          type: integer
          description: >-
            Chai credited for the turn just answered, journey calls only.
            Non-zero only when THIS request inserted the ledger row, so a
            retried turn cannot show a second "+1" for chai nobody received.
        xpEarned:
          type: integer
          description: >-
            XP credited for that turn, GAME calls only. One currency each:
            chai is what he gives you for picking up when HE rang, XP is what
            every other game on the hub pays for playing it.
        backdrop:
          $ref: "#/components/schemas/ChachaCallBackdrop"
        selfView:
          type: boolean
        beat:
          $ref: "#/components/schemas/ChachaCallBeat"
        heard:
          type: string
          description: >-
            What the server heard the learner say, in the language's own
            script. A mirror, never a mark: nothing compares it to anything.
        heardRomanized:
          type: string
          nullable: true
          description: Null when it would only repeat `heard`.
        heardEnglish:
          type: string
          description: A plain English reading of what was heard; empty when nothing was.
        next:
          allOf:
            - $ref: "#/components/schemas/ChachaCallNext"
          nullable: true
        over:
          type: boolean
        audioBase64:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
      required:
        - callId
        - chaiEarned
        - xpEarned
        - backdrop
        - selfView
        - beat
        - heard
        - heardRomanized
        - heardEnglish
        - next
        - over
        - audioBase64
        - format

    ChachaCallTurn:
      type: object
      description: One recorded turn, as the long-poll returns it.
      properties:
        index:
          type: integer
        text:
          type: string
        romanized:
          type: string
          nullable: true
        canned:
          type: boolean
        heard:
          type: string
        heardRomanized:
          type: string
          nullable: true
        heardEnglish:
          type: string
        heardSomething:
          type: boolean
          description: >-
            Whether he heard the learner say anything at all. Sent explicitly
            rather than inferred from `heard`, which is a transcript and can
            be empty for a dozen reasons; it decides whether the turn earned.
        chaiEarned:
          type: integer
        xpEarned:
          type: integer
        next:
          allOf:
            - $ref: "#/components/schemas/ChachaCallNext"
          nullable: true
        over:
          type: boolean
      required:
        - index
        - text
        - romanized
        - canned
        - heard
        - heardRomanized
        - heardEnglish
        - heardSomething
        - chaiEarned
        - xpEarned
        - next
        - over

    ChachaCallEnd:
      type: object
      properties:
        callId:
          type: string
        outcome:
          type: string
          enum: [answered, abandoned]
        turns:
          type: integer
        text:
          type: string
        romanized:
          type: string
          nullable: true
        english:
          type: string
          nullable: true
          description: The gloss stays English in every language; it IS the translation.
        audioBase64:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
      required:
        - callId
        - outcome
        - turns
        - text
        - romanized
        - english
        - audioBase64
        - format

    ReferralSummary:
      type: object
      properties:
        code:
          type: string
          description: The caller's shareable referral code (uppercase, no 0/O/1/I).
        pendingCount:
          type: integer
          description: Redemptions attributed to the caller that have not activated yet.
        activatedCount:
          type: integer
          description: >-
            Redemptions that activated (the referee completed a first session;
            both sides were granted).
        chaiEarned:
          type: integer
          description: >-
            Total referral Chai earned by the caller, derived from the token
            ledger (reason earn_referral_referrer), never a stored counter.
      required:
        - code
        - pendingCount
        - activatedCount
        - chaiEarned

    ReferralRedeemInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: The referral code to redeem. Case-insensitive; normalized server-side.
      required:
        - code

    ReferralRedeemResult:
      type: object
      properties:
        redeemed:
          type: boolean
          description: >-
            True when attribution was recorded. Grants happen at activation
            (the referee's first completed session), not here.
      required:
        - redeemed

    GameSessionInput:
      type: object
      properties:
        languageCode:
          type: string
          minLength: 1
          description: Language code for the phrases practiced (e.g. "gu", "hi").
        game:
          type: string
          enum: [speed-round, phrase-builder, word-match, listen-and-pick]
          description: Identifier for the mini game played.
        categoryId:
          type: integer
          description: The category the phrases were drawn from. Used for server-side phrase validation.
        phraseResults:
          type: array
          description: >-
            One entry per question attempted during the game session. The server
            determines correctness from the submitted answer; clients never
            self-report a correct/incorrect flag.
          maxItems: 120
          items:
            $ref: "#/components/schemas/GamePhraseResult"
        context:
          type: string
          enum: [hub, signal, closeout]
          description: >-
            Optional origin context. "signal" and "closeout" trigger a once-ever
            Chai grant on the first clear. "hub" is accepted but grants nothing.
            Absent behaves identically to today.
        contextRef:
          type: string
          pattern: "^gap-[0-9]+$"
          description: >-
            Required when context is "signal"; forbidden otherwise. Identifies
            the gap that was cleared, forming part of the idempotency key.
      required:
        - languageCode
        - game
        - categoryId
        - phraseResults

    GamePhraseResult:
      type: object
      description: >-
        The learner's submitted answer for one game question. The server
        computes correctness from the answer, depending on game mode.
        For speed-round: selectedPhraseId must equal phraseId to be correct.
        For phrase-builder: submittedText must match the phrase's nativeScript.
      properties:
        phraseId:
          type: integer
          description: The database ID of the question phrase.
        selectedPhraseId:
          type: integer
          nullable: true
          description: >-
            Speed Round — the phraseId of the option the learner tapped.
            Correct when selectedPhraseId === phraseId.
        submittedText:
          type: string
          nullable: true
          description: >-
            Phrase Builder — the assembled word tokens joined by a single space.
            Correct when it matches the phrase's nativeScript exactly.
      required:
        - phraseId

    GameSessionResult:
      type: object
      properties:
        xpEarned:
          type: integer
          description: XP earned in this game session.
        totalXp:
          type: integer
          description: Learner's cumulative XP for this language after the session.
        passed:
          type: boolean
          description: >-
            Server-authoritative session verdict (majority of answered
            questions correct, as judged server-side). This is the flag that
            gates signal and closeout Chai grants; clients must not derive
            their own pass state.
        chaiGranted:
          type: integer
          description: >-
            Chai awarded this call, present only when a signal or closeout grant
            actually landed (first-ever clear). Absent on replays and when
            context is hub or omitted.
      required:
        - xpEarned
        - totalXp
        - passed

    AttemptInput:
      type: object
      properties:
        evaluationToken:
          type: string
          minLength: 1
          description: >-
            Opaque, server-signed token returned by /openai/pronunciation. It
            carries the authoritative language, score, feedback, transcript and
            target phrase, so clients cannot forge or inflate their own progress.
      required:
        - evaluationToken

    Attempt:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        categoryId:
          type: ["integer", "null"]
          description: The category this phrase belongs to; null for attempts with no linked phrase.
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        band:
          type: ["string", "null"]
          enum: ["perfect", "great", "good", "almost", "retry", "nocatch", null]
          description: Five-band pronunciation ladder value for this attempt (legacy stored rows are normalized server-side); null for rows recorded before banding shipped.
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phraseId
        - categoryId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt

    Badge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: ["string", "null"]
          format: date-time
        progressCurrent:
          type: integer
          description: Current value of the metric this badge tracks, capped at the target.
        progressTarget:
          type: integer
          description: The metric value that unlocks this badge.
      required:
        - key
        - title
        - description
        - iconName
        - earned
        - earnedAt
        - progressCurrent
        - progressTarget

    EarnedBadge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earnedAt:
          type: string
          format: date-time
      required:
        - key
        - title
        - description
        - iconName
        - earnedAt

    AttemptResult:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
        newlyEarnedBadges:
          type: array
          items:
            $ref: "#/components/schemas/EarnedBadge"
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
        chaiEarned:
          type: integer
          description: >-
            Chai granted synchronously within this attempt request (today:
            the streak-day earn). Omitted when zero. The Session Complete
            receipt sums these server-authoritative amounts.
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt
        - newlyEarnedBadges

    ProgressSummary:
      type: object
      properties:
        totalAttempts:
          type: integer
        phrasesPracticed:
          type: integer
        phrasesMastered:
          type: integer
        totalPhrases:
          type: integer
        averageScore:
          type: integer
        bestScore:
          type: integer
        currentStreakDays:
          type: integer
        speakingStreakDays:
          type: integer
          description: >-
            Spec D2 speaking streak: consecutive calendar days (learner's IANA
            timezone) each containing at least one attempt in a passing band
            (perfect, great, good, or almost). Optional for installed-client
            back-compat; derived at query time, never stored.
        attemptsToday:
          type: integer
        xp:
          type: integer
        todayXp:
          type: integer
        dailyGoal:
          type: integer
        dueCount:
          type: integer
          description: >-
            Phrases whose spaced-repetition due date has arrived or passed, for
            this language. Same predicate as GET /review/phrases, so the count
            matches the session a learner lands in. Unlike that route this is
            NOT Plus-gated: a free learner is exactly who a "3 phrases are due"
            reminder has to reach. Optional for installed-client back-compat.
      required:
        - totalAttempts
        - phrasesPracticed
        - phrasesMastered
        - totalPhrases
        - averageScore
        - bestScore
        - currentStreakDays
        - attemptsToday
        - xp
        - todayXp
        - dailyGoal

    VoiceCatalogEntry:
      type: object
      description: A single curated ElevenLabs premade voice learners can select.
      properties:
        id:
          type: string
          description: ElevenLabs voice ID.
        name:
          type: string
          description: Human-readable voice name.
        gender:
          type: string
          enum: [male, female]
        description:
          type: string
          description: One-line character description shown in the picker.
      required:
        - id
        - name
        - gender
        - description

    VoiceListResult:
      type: object
      properties:
        voices:
          type: array
          items:
            $ref: "#/components/schemas/VoiceCatalogEntry"
        current:
          type: string
          nullable: true
          description: The caller's saved ttsVoice preference, or null for Auto.
      required:
        - voices
        - current

    NarrationResult:
      type: object
      required: [audioBase64, format, source]
      properties:
        audioBase64:
          type: string
        format:
          type: string
        source:
          type: string
          enum: [narrator, fallback]
          description: >
            Which voice actually spoke. "narrator" is the chosen Indian English
            ElevenLabs voice. "fallback" means ElevenLabs would not answer and
            the line was spoken by the app's default provider instead, which
            sounds American. Reported rather than hidden: narration is the first
            live ElevenLabs caller in production, so a run of "fallback" is the
            only signal that ELEVENLABS_API_KEY is missing or stale, and a
            silent downgrade would leave that permanently invisible.
    NestRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Absolute URL of the Nest.

    NestSummary:
      type: object
      required:
        [generatedAt, usersTotal, usersExclOwner, active30d, active30dExclOwner,
         paidActive,
         paidActiveExclOwner, trialing, ttsTotal, tts30d, attemptsTotal,
         attempts30d, attempts30dExclOwner, chat30d, lessons30d, ttsBytes,
         dbBytes]
      properties:
        generatedAt: { type: string, format: date-time }
        usersTotal: { type: integer }
        usersExclOwner:
          type: integer
          description: >
            Rows in users minus the owner allowlist. Computed here rather than
            in the browser so the ids themselves never leave the server.
        active30d: { type: integer }
        active30dExclOwner:
          type: integer
          description: >
            Active learners who are NOT the owner. Ship this beside active30d
            or the tile lies: the owner is 77 percent of all attempts in the
            last month, and "active users" is exactly the number a reader takes
            to mean "how many learners are actually using this". Same shape of
            mistake as a visitor count labelled "people".
        paidActive: { type: integer }
        paidActiveExclOwner:
          type: integer
          description: >
            Paid accounts that are not the owner's or an App Store review
            account. Show this beside paidActive or the page implies customers
            that do not exist.
        trialing: { type: integer }
        ttsTotal: { type: integer }
        tts30d: { type: integer }
        attemptsTotal: { type: integer }
        attempts30d: { type: integer }
        attempts30dExclOwner: { type: integer }
        chat30d: { type: integer }
        lessons30d: { type: integer }
        ttsBytes:
          type: integer
          description: >
            Cached audio. It has been 98 percent of the database and the
            production cap is 10 GiB, so this is a ceiling as well as a bill.
        dbBytes: { type: integer }

    NarrationInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 600
          description: >
            One line of English story prose: a scene's situation, or the
            outcome of a choice. NOT the learner's phrase, which goes to
            /openai/tts in their own language. The cap is generous for a
            sentence and small enough that a malformed caller cannot bill an
            essay to the narrator voice.
    SpeechInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        voice:
          type: string
        languageName:
          type: string
        languageCode:
          type: string
          description: >
            ISO-639-1 code of the language being synthesized (e.g. "gu", "hi",
            "ta"). When provided the server selects a voice that sounds more
            authentic for that language family instead of always defaulting to
            the English voice.
        previewVoiceId:
          type: string
          description: >
            When present and a valid VOICE_CATALOG ID, bypasses the user's
            saved preference and the language-voice mapping and synthesizes
            using this specific ElevenLabs voice. Intended for voice-picker
            preview only.
      required:
        - text

    SpeechResult:
      type: object
      properties:
        audioBase64:
          type: string
        format:
          type: string
      required:
        - audioBase64
        - format

    ChachaLine:
      type: object
      properties:
        key:
          type: string
          enum: [greeting, gift, farewell]
          description: >-
            Which moment of the encounter this line belongs to: greeting on
            open, gift only when the arrival actually granted Chai, farewell on
            every close path.
        text:
          type: string
          description: >-
            What he says, fixed romanized Hindi, identical for every learner.
        english:
          type: string
          description: The on-screen English gloss shown while the line plays.
        audioBase64:
          type: string
        format:
          type: string
      required:
        - key
        - text
        - english
        - audioBase64
        - format

    ChachaLinesResult:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ChachaLine"
          description: >-
            His lines in encounter order. A line whose synthesis failed is
            omitted, so callers must look lines up by key rather than index.
      required:
        - lines

    PronunciationInput:
      type: object
      properties:
        phraseId:
          type: ["integer", "null"]
          description: >-
            Optional id of the catalog phrase being practiced. When supplied the
            server uses the phrase's stored text as the authoritative target.
        targetNative:
          type: string
          minLength: 1
        targetRomanized:
          type: string
        targetEnglish:
          type: string
        languageName:
          type: string
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
        latencyMs:
          type: integer
          nullable: true
          description: >-
            Client-measured milliseconds between the phrase finishing and the
            learner tapping Record. When present and < 250 ms the server
            rejects the attempt as a tap-spam guard.
        captureLabel:
          type: string
          enum: [native, american_accent, subtle_error, wrong_attempt]
          description: >-
            TEMPORARY (pilot capture mode): the capture protocol label for
            this attempt. Recorded in the R2 tee sidecar for allowlisted
            capture users; ignored for everyone else. Remove with capture
            mode once the calibration corpus is complete.
        captureAttemptOfFour:
          type: integer
          minimum: 1
          maximum: 4
          description: >-
            TEMPORARY (pilot capture mode): which of the four protocol
            attempts this is (1-4). Recorded in the sidecar alongside
            captureLabel.
      required:
        - targetNative
        - targetRomanized
        - targetEnglish
        - audioBase64

    PilotCaptureEligibility:
      type: object
      properties:
        eligible:
          type: boolean
          description: True when the caller is in the pilot capture allowlist.
      required: [eligible]

    PilotCaptureDiscardResult:
      type: object
      properties:
        discarded:
          type: boolean
          description: >-
            True when the caller's most recent capture-mode clip was marked
            discarded in its sidecar; false when there was nothing to discard.
      required: [discarded]

    PronunciationResult:
      type: object
      properties:
        transcript:
          type: string
        transcriptRomanized:
          type: string
          description: >-
            Display-only romanization of `transcript` (deterministic
            transliteration, card-style ASCII, e.g. "kem cho"). A transcript
            that is already Latin passes through unchanged. Empty ("") when
            the script has no clean romanization (Perso-Arabic, Ol Chiki,
            Meetei Mayek) or on nocatch/empty-transcript outcomes. Clients
            hide the romanized line when this is empty. Optional for
            older-client compatibility; never stored or used in scoring.
        score:
          type: integer
          description: >-
            Deprecated — will be removed in a future release once all client
            builds have updated. Use `band` instead. Omitted when the server
            stops sending it; clients must treat this field as optional.
        band:
          type: string
          enum: [nocatch, perfect, great, good, almost, retry]
          description: >-
            Five-band pronunciation ladder value, top to bottom: `perfect` and
            `great` earn full XP, `good` and `almost` earn half XP, `retry` is
            below the passing threshold (no XP). `nocatch` = no usable audio
            detected (no XP); it is a separate system outcome, not a rung on
            the ladder.
        xpAwarded:
          type: integer
          description: XP earned for this attempt. Display only — the signed token is authoritative.
        xpBreakdown:
          type: string
          nullable: true
          description: Human-readable explanation of the XP awarded, e.g. "Full XP".
        passed:
          type: boolean
        feedback:
          type: string
        tip:
          type: string
        evaluationToken:
          type: string
          description: >-
            Server-signed token capturing this evaluation. Pass it to /attempts
            to record the attempt with the authoritative score and feedback.
      required:
        - transcript
        - passed
        - feedback
        - tip
        - evaluationToken
        - band
        - xpAwarded

    PhraseRequest:
      type: object
      properties:
        languageName:
          type: string
        categoryTitle:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
      required: []

    GeneratedPhrase:
      type: object
      properties:
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
      required:
        - nativeScript
        - romanized
        - english

    ChatTurnMessage:
      type: object
      description: A single prior turn in the rolling conversation-context window.
      properties:
        role:
          type: string
          description: learner | parrot
        text:
          type: string
      required:
        - role
        - text

    ChatTurnInput:
      type: object
      properties:
        languageCode:
          type: string
          description: The language the learner is chatting in (e.g. "hi", "gu").
        audioBase64:
          type: string
          minLength: 1
          description: >-
            The learner's recorded speech for this turn. Required when
            textInput is not provided.
        textInput:
          type: string
          minLength: 1
          description: >-
            Pre-supplied text for text-input turns. When set the STT step is
            skipped, the value is used directly as the transcript, and no
            chat-time seconds are charged. Required when audioBase64 is not
            provided.
        history:
          type: array
          description: >-
            A short recent-turn window (client-supplied; not persisted
            server-side) so replies stay contextual.
          items:
            $ref: "#/components/schemas/ChatTurnMessage"
        clientDurationSeconds:
          type: number
          nullable: true
          description: >-
            Client-measured duration (in seconds) of the recorded audio clip.
            When present the server uses this value to debit the caller's weekly
            chat-time allowance instead of inferring it from audio length.
            Optional; omitted by older clients.
        mimeType:
          type: string
          description: >-
            MIME type of the audio payload (e.g. "audio/m4a"). Optional; omitted
            by older clients that always send m4a.
        scenarioId:
          type: string
          description: >-
            Optional zone capstone scenario identifier (e.g. "greetings-manners").
            When supplied the server injects the scenario framing and steering
            instructions into the prompt, gates zone 2+ on Plus, tracks phrase
            usage, and writes a zone_conversation_stamp on majority completion.
      required:
        - languageCode

    ChatTurnResult:
      type: object
      properties:
        transcript:
          type: string
          description: What the server heard the learner say.
        transcriptEnglish:
          type: string
          description: >-
            Concise English translation of what the learner said. Empty string
            when the learner spoke in English or their speech was unclear.
        replyText:
          type: string
          description: Bolo's in-character reply, in the target language.
        replyEnglish:
          type: string
          description: English translation of Bolo's reply, shown as a bilingual caption.
        replyAudioBase64:
          type: string
          description: Ready-to-play synthesized speech of the reply.
        format:
          type: string
        languageCode:
          type: string
        secondsRemaining:
          type: ["integer", "null"]
          description: >-
            Seconds of weekly chat time left for the caller; null means
            unlimited (One Language and Plus).
        phrasesUsed:
          type: array
          items:
            type: string
          description: >-
            Romanized target phrases from the scenario's target list that the
            server detected in the learner's transcript this turn (case-insensitive
            substring match). Only present when a scenarioId was supplied.
        sceneDone:
          type: boolean
          description: >-
            True when the majority of the scenario's target phrases have been
            used across the session, signalling that the capstone is complete.
            Only present when a scenarioId was supplied.
        xpAwarded:
          type: integer
          description: >-
            XP awarded on this turn (non-zero only on the first sceneDone=true
            turn; 0 on replays). Only present when a scenarioId was supplied.
        tokensEarned:
          type: integer
          description: >-
            Chai earned this turn. Non-zero only on the FIRST turn that
            completes a zone capstone, and 0 on every replay: the grant is
            idempotent on (user, reason, zone) in the token ledger. Only
            present when a scenarioId was supplied.
      required:
        - transcript
        - transcriptEnglish
        - replyText
        - replyEnglish
        - replyAudioBase64
        - format
        - languageCode
        - secondsRemaining

    ScenarioSummary:
      type: object
      description: >-
        A capstone scene as the journey map needs to know it: which zone it
        belongs to and what to call it. No framing copy and no target phrases;
        those come from GET /scenarios/{id}.
      properties:
        id:
          type: string
        zoneIndex:
          type: integer
          description: 0-based zone index.
        title:
          type: string
      required:
        - id
        - zoneIndex
        - title

    ScenarioPublic:
      type: object
      description: >-
        Client-safe subset of a zone capstone scenario. Steering instructions
        are never sent to the client.
      properties:
        id:
          type: string
        zoneIndex:
          type: integer
          description: 0-based zone index.
        title:
          type: string
          description: Short scene title shown in the chat banner.
        framingCopy:
          type: string
          description: One-sentence scene setter shown below the title.
        targetPhrases:
          type: array
          items:
            type: object
            properties:
              romanized:
                type: string
              native:
                type: string
            required: [romanized, native]
          description: Phrases to use as chip targets in the chat UI.
      required:
        - id
        - zoneIndex
        - title
        - framingCopy
        - targetPhrases

    ZoneStamp:
      type: object
      description: Record that a learner completed a zone capstone conversation.
      properties:
        zoneIndex:
          type: integer
          description: 0-based zone index.
        languageCode:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - zoneIndex
        - languageCode
        - createdAt

    AddPhrasesInput:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How many new phrases to generate and append.
      required: []

    UpgradeRequired:
      type: object
      description: >-
        Returned with HTTP 402 when a Free action needs Bolo! Plus (a locked
        language, the daily new-lesson cap, or a Plus-only feature). A single
        shape across every gate so clients render the paywall uniformly.
      properties:
        error:
          type: string
          description: Always "upgrade_required".
        upgradeRequired:
          type: boolean
          description: Always true.
        reason:
          type: string
          description: >-
            language_locked | feature_locked | chat_time_limit |
            teaser_exhausted (the caller used up their free teaser phrases in
            this locked language) | phrase_ceiling (the topic holds as many
            phrases as this plan allows; only All-Access lifts it).
            daily_lesson_limit is retired and no longer sent.
        message:
          type: string
        feature:
          type: string
          nullable: true
          description: The related feature flag, when applicable (e.g. "allLanguages").
        requiredPlan:
          type: string
          description: >-
            The cheapest plan that unlocks the action ("one_language" or
            "plus").
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
      required:
        - error
        - upgradeRequired
        - reason
        - message
        - feature
        - requiredPlan

    AppendRefused:
      type: object
      description: >-
        A refused "Add more phrases" tap that no upgrade would fix. Clients must
        branch on `reason`, never on the message text.
      properties:
        error:
          type: string
          description: Learner-facing explanation, safe to show as-is.
        reason:
          type: string
          description: >-
            append_in_progress (an append for this topic is already running) |
            topic_full (top tier, topic at its ceiling, no upgrade exists) |
            append_rate_limited (hourly per-learner burst bound reached).
        retryAfterSeconds:
          type: integer
          description: >-
            Seconds until the learner may append again. Only sent with
            append_rate_limited.
      required:
        - error
        - reason

    TeaserProgress:
      type: object
      description: >-
        M1 language teaser progress for a locked language: how many of the
        free teaser phrases (the first phrases of Greetings group 1) this
        user has attempted, lifetime. Present on locked-language 402 bodies,
        on teaser-state phrase rows, and on attempt results recorded through
        the teaser.
      properties:
        consumed:
          type: integer
          description: Distinct teaser phrases attempted so far.
        limit:
          type: integer
          description: Total teaser phrases available (currently 3).
      required:
        - consumed
        - limit

    PlanFeatures:
      type: object
      properties:
        allLanguages:
          type: boolean
        unlimitedLessons:
          type: boolean
        review:
          type: boolean
        advancedAnalytics:
          type: boolean
        extendedLibrary:
          type: boolean
          description: >-
            Whether the caller can access the deep, pre-seeded premium phrase
            library beyond each topic's free starter set. Plus only.
        unlimitedChatTime:
          type: boolean
          description: >-
            Whether the caller has no weekly ceiling on Bolo Parrot
            conversational chat time. Free is capped at 2 minutes/week; One
            Language and Plus are unlimited.
        phraseBuilder:
          type: boolean
          description: Whether the caller can access the Phrase Builder game. Plus only.
        speedRound:
          type: boolean
          description: Whether the caller can access the Speed Round game. Plus only.
      required:
        - allLanguages
        - unlimitedLessons
        - review
        - advancedAnalytics
        - extendedLibrary
        - unlimitedChatTime
        - phraseBuilder
        - speedRound

    DailyLessonAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Daily new-lesson ceiling; null means unlimited (Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining today; null means unlimited (Plus).
      required:
        - limit
        - used
        - remaining

    WeeklyChatAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: >-
            Weekly Bolo Parrot chat-time ceiling in seconds; null means
            unlimited (One Language and Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining this week; null means unlimited.
      required:
        - limit
        - used
        - remaining

    EntitlementLimits:
      type: object
      properties:
        dailyNewLessons:
          $ref: "#/components/schemas/DailyLessonAllowance"
        weeklyChatSeconds:
          $ref: "#/components/schemas/WeeklyChatAllowance"
      required:
        - dailyNewLessons
        - weeklyChatSeconds

    Entitlements:
      type: object
      properties:
        plan:
          type: string
          description: The effective plan ("free", "one_language", or "plus").
        status:
          type: string
          description: none | trialing | active | expired | canceled
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        chosenLanguage:
          type: string
          nullable: true
          description: >-
            The single language a One Language ($6.99) subscriber unlocked on
            top of free Hindi. Null for Free and all-access Plus.
        allowedLanguages:
          type: array
          items:
            type: string
          description: The concrete language codes the caller may access.
        freeLanguage:
          type: string
          description: >-
            The single language every tier gets for free. Plan-independent: it
            names the language, not the viewer's access, so clients can label
            it without keeping their own copy of the policy.
        features:
          $ref: "#/components/schemas/PlanFeatures"
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
      required:
        - plan
        - status
        - trialEndsAt
        - currentPeriodEnd
        - chosenLanguage
        - allowedLanguages
        - freeLanguage
        - features
        - limits

    StoryPhrase:
      type: object
      description: >-
        One concept resolved into one language. `concept` is the English key the
        scene graph names and is never shown to the learner; `english` is what
        the corpus row actually says, which is not always the same string (see
        the concept aliases in @workspace/story).
      properties:
        concept:
          type: string
        phraseId:
          type: integer
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
      required:
        - concept
        - phraseId
        - nativeScript
        - romanized
        - english

    StoryBookResponse:
      type: object
      properties:
        bookId:
          type: string
        journey:
          type: integer
        zone:
          type: integer
        title:
          type: string
        startId:
          type: string
          description: The scene the book opens on.
        phrases:
          type: array
          items:
            $ref: "#/components/schemas/StoryPhrase"
        limited:
          type: boolean
          description: >-
            True when this caller was served only the free taste. The client
            shows the end-of-taste beat on the first scene that resolves to
            null; without this flag that scene is indistinguishable from one the
            language's corpus is simply too thin to carry.
        teaserScenes:
          type: integer
          nullable: true
          description: How many scenes the taste covers, or null when unlimited.
      required:
        - bookId
        - journey
        - zone
        - title
        - startId
        - phrases
        - limited
        - teaserScenes

    CategoryAnalytics:
      type: object
      properties:
        categoryId:
          type: integer
        title:
          type: string
        phraseCount:
          type: integer
        practicedCount:
          type: integer
        masteredCount:
          type: integer
        averageScore:
          type: integer
      required:
        - categoryId
        - title
        - phraseCount
        - practicedCount
        - masteredCount
        - averageScore

    DailyActivity:
      type: object
      properties:
        date:
          type: string
          description: UTC day (YYYY-MM-DD).
        attempts:
          type: integer
        averageScore:
          type: integer
      required:
        - date
        - attempts
        - averageScore

    ProgressAnalytics:
      type: object
      properties:
        languageCode:
          type: string
        totalXp:
          type: integer
        reviewDueCount:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAnalytics"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyActivity"
      required:
        - languageCode
        - totalXp
        - reviewDueCount
        - categories
        - daily

    SendFriendInviteInput:
      type: object
      properties:
        email:
          type: string
          description: The email address to invite. Must not belong to an existing learner.
      required:
        - email

    FriendInviteResult:
      type: object
      description: Confirmation that a referral invite was sent.
      properties:
        sent:
          type: boolean
          description: Always true when the invite email was dispatched.
        sendCount:
          type: integer
          description: How many times this (caller, email) pair has been invited in total.
      required:
        - sent
        - sendCount

    UserSummary:
      type: object
      description: A learner's public identity for friends features.
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
        equippedOutfit:
          type: string
          nullable: true
          description: >-
            The outfit this learner's Bolo is wearing (see OutfitCatalog ids), or null
            for the canonical undressed bird. Carried on the row so friend and
            leaderboard lists render each learner's mascot without a per-row fetch.
            Optional: older clients that predate outfits on rows simply ignore it.
        equippedAccessory:
          type: string
          nullable: true
          description: >-
            The head accessory this learner's Bolo is wearing, or null. A garment and
            an accessory are separate slots, so a row that shipped only the garment
            would show a pagdi-wearing friend bare-headed.
      required:
        - id
        - displayName

    SendFriendRequestByCodeInput:
      type: object
      properties:
        code:
          type: string
          description: >-
            The friend code of the learner to send a request to (their referral
            code). Normalized by trim + uppercase, then matched exactly.
      required:
        - code

    FriendRequest:
      type: object
      description: A pending friend request plus the other learner's identity.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "pending" for a request.
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - createdAt
        - user

    AcceptedFriendship:
      type: object
      description: The result of accepting a request — a now-mutual friendship.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "accepted".
        friend:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - friend

    Friend:
      type: object
      description: An accepted friend in the caller's friends list.
      properties:
        friendshipId:
          type: integer
        since:
          type: string
          format: date-time
          nullable: true
          description: When the friendship was accepted.
        id:
          type: string
        displayName:
          type: string
          nullable: true
        equippedOutfit:
          type: string
          nullable: true
          description: >-
            The outfit this learner's Bolo is wearing (see OutfitCatalog ids), or null
            for the canonical undressed bird. Carried on the row so friend and
            leaderboard lists render each learner's mascot without a per-row fetch.
            Optional: older clients that predate outfits on rows simply ignore it.
        equippedAccessory:
          type: string
          nullable: true
          description: >-
            The head accessory this learner's Bolo is wearing, or null. A garment and
            an accessory are separate slots, so a row that shipped only the garment
            would show a pagdi-wearing friend bare-headed.
      required:
        - friendshipId
        - id
        - displayName

    ScriptTraceCharacterProgress:
      type: object
      description: A learner's tracing progress for a single character in a Script Trace chapter.
      properties:
        characterId:
          type: string
          description: The character's stable identifier within the chapter (e.g. "gu_a").
        passed:
          type: boolean
          description: Whether the learner has ever achieved a passing score (≥70%) for this character.
        bestScore:
          type: integer
          nullable: true
          description: Highest accuracy score (0–100) achieved across all traces. Null until the first trace.
        attemptCount:
          type: integer
          description: Total number of traces submitted for this character.
        updatedAt:
          type: string
          format: date-time
          description: When this progress row was last updated.
      required:
        - characterId
        - passed
        - bestScore
        - attemptCount
        - updatedAt

    ScriptTraceProgressInput:
      type: object
      description: The result of a single character trace attempt.
      properties:
        languageCode:
          type: string
          minLength: 2
          maxLength: 8
          description: >-
            The language the learner is studying, e.g. "gu" or "mr". REQUIRED
            and not derivable from the chapter: the Devanagari chapters serve
            Hindi, Marathi, Nepali, Sanskrit, Maithili, Konkani, Dogri and Bodo
            alike, so "hindi-vowels" belongs to eight languages at once. The
            server rejects a language that does not study the given chapter.
        chapter:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            A Script Trace chapter id, e.g. "gujarati-vowels" or
            "bengali-consonants". Validated server-side against the real chapter
            data. This was an enum of four ids, which meant twenty of the
            twenty-two languages were refused and could not record any tracing
            progress at all.
        characterId:
          type: string
          minLength: 1
          maxLength: 30
        passed:
          type: boolean
        score:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - languageCode
        - chapter
        - characterId
        - passed
        - score

    ContactFormInput:
      type: object
      description: A support message submitted via the Contact Us form.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          description: The submitter's email address (validated as a valid email format).
        category:
          type: string
          enum: [general, billing, technical, feedback, other]
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - name
        - email
        - category
        - message

    ContactFormResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    PhraseReportInput:
      type: object
      properties:
        reason:
          type: string
          enum: [translation_wrong, transliteration_wrong, audio_wrong, other]
        note:
          type: string
          maxLength: 280
          description: Optional free-text note, never required.
      required:
        - reason

    UsernameReportInput:
      type: object
      properties:
        reason:
          type: string
          enum: [offensive, impersonation, personal_information, other]
        note:
          type: string
          maxLength: 280
          description: Optional free-text note, never required.
      required:
        - reason

    PhraseReportResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    McqTranslationQuestion:
      type: object
      description: See native script, pick correct English gloss from 4 choices.
      properties:
        type:
          type: string
          enum: [mcq_translation]
        phraseId:
          type: integer
        nativeScript:
          type: string
        romanized:
          type: string
        correctEnglish:
          type: string
        distractors:
          type: array
          items:
            type: string
          description: 3 wrong English glosses
      required:
        - type
        - phraseId
        - nativeScript
        - romanized
        - correctEnglish
        - distractors

    ListenIdentifyQuestion:
      type: object
      description: Hear audio for a phrase, pick the correct native-script card.
      properties:
        type:
          type: string
          enum: [listen_identify]
        phraseId:
          type: integer
        correctNativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        distractors:
          type: array
          items:
            type: string
          description: 3 wrong native-script strings
        distractorRomanizations:
          type: array
          items:
            type: string
          description: Romanized pronunciations matching each distractor (same order).
      required:
        - type
        - phraseId
        - correctNativeScript
        - romanized
        - english
        - distractors

    OrderWordsQuestion:
      type: object
      description: Arrange shuffled word/token tiles into the correct phrase.
      properties:
        type:
          type: string
          enum: [order_words]
        phraseId:
          type: integer
        nativeScript:
          type: string
          description: The correct answer (space-separated words)
        romanized:
          type: string
        english:
          type: string
        tiles:
          type: array
          items:
            type: string
          description: Shuffled word tiles to arrange
        tileRomanizations:
          type: array
          items:
            type: string
          description: >
            Romanized subtitle for each tile, parallel to `tiles`. Empty-string
            entries mean the tile's script has no clean romanization and
            clients render no subtitle. Absent on quizzes stored before the
            field shipped.
      required:
        - type
        - phraseId
        - nativeScript
        - romanized
        - english
        - tiles

    QuizQuestion:
      oneOf:
        - $ref: "#/components/schemas/McqTranslationQuestion"
        - $ref: "#/components/schemas/ListenIdentifyQuestion"
        - $ref: "#/components/schemas/OrderWordsQuestion"
      discriminator:
        propertyName: type

    DailyQuizResponse:
      type: object
      description: Today's quiz state for a learner.
      properties:
        quizDate:
          type: string
          description: ISO date string for today (UTC), e.g. "2026-07-18"
        completed:
          type: boolean
          description: Whether the learner has already submitted today's quiz
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
          description: The 5 quiz questions
        score:
          type: integer
          nullable: true
          description: Learner's score (0-5), only present when completed=true
        total:
          type: integer
          nullable: true
          description: Total questions (always 5), only present when completed=true
        xpAwarded:
          type: integer
          nullable: true
          description: XP awarded, only present when completed=true
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the learner completed the quiz
        quizStreak:
          type: integer
          nullable: true
          description: >-
            Number of consecutive days (ending today or yesterday) the learner
            has completed the daily quiz. null when the streak is unknown or zero.
      required:
        - quizDate
        - completed
        - questions

    CompleteDailyQuizInput:
      type: object
      properties:
        lang:
          type: string
          description: Language code (e.g. "gu")
        answers:
          type: array
          items:
            type: string
            nullable: true
          description: >-
            Array of 5 selected answers (one per question). For mcq_translation
            supply the chosen English string; for listen_identify supply the
            chosen nativeScript string; for order_words supply the tiles joined
            by spaces. null means the question was skipped or unanswered.
          minItems: 5
          maxItems: 5
      required:
        - lang
        - answers

    DailyQuizResult:
      type: object
      properties:
        score:
          type: integer
          description: Number of correct answers (0-5)
        total:
          type: integer
          description: Total questions (always 5)
        xpAwarded:
          type: integer
          description: XP awarded for this attempt
        perfect:
          type: boolean
          description: Whether the learner scored 5/5
        quizStreak:
          type: integer
          description: >-
            Number of consecutive days (including today) the learner has
            completed the daily quiz for this language.
      required:
        - score
        - total
        - xpAwarded
        - perfect
        - quizStreak

    CompleteLetterStopInput:
      type: object
      properties:
        lang:
          type: string
          description: Language code (e.g. "hi")
        journey:
          type: integer
          description: 1-based journey number
        zone:
          type: integer
          description: 1-based fare zone within the journey
        correct:
          type: integer
          description: >-
            Letters the learner read correctly at the first attempt. Clamped
            server-side to the stop's own length and never above `total`.
        total:
          type: integer
          description: >-
            Letters asked. Clamped server-side to the stop's own length, which
            is LETTER_STOP_LENGTH in @workspace/script-trace.
      required:
        - lang
        - journey
        - zone
        - correct
        - total

    LetterStopResult:
      type: object
      properties:
        passed:
          type: boolean
          description: >-
            Whether the learner cleared the bar, which is LETTER_STOP_PASS of
            LETTER_STOP_LENGTH and mirrors the tracing stop's own.
        correct:
          type: integer
          description: The clamped correct count actually recorded
        total:
          type: integer
          description: The clamped total actually recorded
        xpAwarded:
          type: integer
          description: XP awarded for this stop, at the station rate
      required:
        - passed
        - correct
        - total
        - xpAwarded

    TokenState:
      type: object
      required: [balance, stationPausesEquipped]
      properties:
        balance: { type: integer }
        stationPausesEquipped: { type: integer }
        allowanceAllAccessMonthly:
          type: integer
          description: >-
            How much Chai an All-Access subscriber is granted each calendar
            month. SERVED RATHER THAN HARDCODED because tokenEconomy.ts is the
            single source of truth for every economy number and says so: this
            one already moved once (50 to 15, owner ruling 2026-08-11) and was
            changed server-side precisely so no client release was needed. The
            paywall renders it, so a future change reaches both paywalls with
            no build. Present for every caller, subscriber or not, since the
            paywall is shown to people who are not subscribed yet.
        expressMultiplierActiveUntil:
          type: string
          format: date-time
          nullable: true
        firstClassActiveUntil:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the caller's First Class status runs out, or null when it is
            not active. Mirrors expressMultiplierActiveUntil: an absolute
            deadline written at spend time, so clients derive active/inactive
            and any countdown from the wall clock rather than holding a timer.
        equippedOutfit:
          type: string
          nullable: true
          description: >-
            The garment id Bolo is wearing, or null for canonical undressed
            Bolo. Every mascot surface resolves its art from this value, so
            clients read it here rather than holding their own copy.
        equippedAccessory:
          type: string
          nullable: true
          description: >-
            The accessory id Bolo is wearing, or null for none. A separate slot
            from equippedOutfit because she wears both at once: clients stack
            the accessory's overlay art on top of whichever base the garment
            selects.
    TokenHistoryEntry:
      type: object
      required: [id, delta, label, createdAt]
      properties:
        id: { type: integer }
        delta:
          type: integer
          description: >-
            Signed movement in Chai: positive for an earn or a purchase,
            negative for a spend or a consumed Station Pause.
        label:
          type: string
          description: >-
            The learner-facing name for this movement, resolved server-side
            from the ledger reason. Clients render this string as given; the
            raw reason is never sent, and an unrecognised one reads "Chai".
        createdAt:
          type: string
          format: date-time
    TokenHistory:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TokenHistoryEntry"
    OutfitCatalogItem:
      type: object
      required: [id, name, tagline, cost, owned, kind, preview]
      properties:
        id: { type: string }
        name: { type: string }
        tagline: { type: string }
        cost:
          type: integer
          description: >-
            Server-authoritative price in Chai, per item rather than one flat
            price. Clients must render this number, never a hardcoded one.
        owned:
          type: boolean
          description: Bought once, owned forever — derived from the ledger.
        kind:
          type: string
          enum: [garment, accessory]
          description: >-
            A garment redresses the whole bird; an accessory adds one thing to
            her. The shop groups its rack by this, so a new kind of stock does
            not need a client change.
        preview:
          type: string
          enum: [full, head]
          description: >-
            How to crop this item's thumbnail. A hat is unreadable in a
            full-body crop, so accessories ask for the head.
    OutfitCatalog:
      type: object
      required: [balance, equipped, outfits]
      properties:
        balance: { type: integer }
        equipped:
          type: string
          nullable: true
          description: The garment slot — see TokenState.equippedOutfit.
        equippedAccessory:
          type: string
          nullable: true
          description: The accessory slot, worn at the same time as the garment.
        outfits:
          type: array
          items:
            $ref: "#/components/schemas/OutfitCatalogItem"
    BuyOutfitInput:
      type: object
      required: [outfitId]
      properties:
        outfitId:
          type: string
          description: >-
            Catalog id. The price and the ledger refId (outfit:<id>) are both
            composed server-side, so no client-supplied idempotency key is
            accepted here.
    OutfitPurchaseResult:
      type: object
      required: [balance, outfitId, owned, charged, cost, equipped]
      properties:
        balance: { type: integer }
        outfitId: { type: string }
        owned: { type: boolean }
        charged:
          type: boolean
          description: >-
            False when the learner already owned this outfit — the call is a
            no-op that deducts nothing and leaves the equipped choice alone.
        cost: { type: integer }
        equipped:
          type: string
          nullable: true
        equippedAccessory:
          type: string
          nullable: true
    EquipOutfitInput:
      type: object
      required: [outfitId]
      properties:
        outfitId:
          type: string
          nullable: true
          description: >-
            An owned item id, or null to take something off. The slot an item
            occupies is read from the catalog server-side, so equipping a hat
            never disturbs the garment she is wearing.
        slot:
          type: string
          enum: [garment, accessory]
          description: >-
            Only consulted when outfitId is null, where there is no item to
            read the slot from: it says WHICH slot to clear. Omitting it with a
            null outfitId takes everything off.
    OutfitEquipResult:
      type: object
      required: [equipped]
      properties:
        equipped:
          type: string
          nullable: true
        equippedAccessory:
          type: string
          nullable: true
    TokensSpendInput:
      type: object
      required: [item]
      properties:
        item:
          type: string
          enum: [station_pause, express_multiplier]
        refId:
          type: string
          description: optional client idempotency key
    FirstClassInput:
      type: object
      required: [refId]
      properties:
        refId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: >-
            The client idempotency key, a UUID generated when the purchase
            button is armed and reused verbatim on retry. The same key charges
            at most once; a new key is a new purchase. Grammar-pinned to a UUID
            deliberately: this is the only ledger refId a client chooses, and
            other reasons' refIds are bare date keys that a covered-day scan
            reads, so an unconstrained string here would let a caller mint a
            row that scan mistakes for a paid streak cover.
    FirstClassResult:
      type: object
      required: [balance, charged, cost]
      properties:
        balance: { type: integer }
        charged:
          type: boolean
          description: >-
            False when this call replayed an idempotency key already spent —
            nothing was deducted and no time was added.
        cost: { type: integer }
        firstClassActiveUntil:
          type: string
          format: date-time
          nullable: true
        expressMultiplierActiveUntil:
          type: string
          format: date-time
          nullable: true
          description: >-
            The bundled boost's new deadline: max(existing, now + 20 minutes).
    ChaiPack:
      type: object
      required: [id, appleProductId, chai]
      properties:
        id:
          type: string
          enum: [small, medium, large]
        appleProductId:
          type: string
          description: >-
            The App Store consumable product id. The single mapping between an
            Apple SKU and a pack: the app is told it here and never carries its
            own copy.
        chai:
          type: integer
          description: How much Chai the ledger credits for this pack.
    ChaiPackCatalog:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items:
            $ref: "#/components/schemas/ChaiPack"
    ChaiPackCreditsInput:
      type: object
      required: [transactionIds]
      properties:
        transactionIds:
          type: array
          items: { type: string }
          description: >-
            Apple transaction ids, as the store reported them. Ids beyond the
            first 100 are ignored.
    ChaiPackCreditsResult:
      type: object
      required: [credited]
      properties:
        credited:
          type: array
          items: { type: string }
          description: >-
            The subset of the given transaction ids that already have a ledger
            row. Anything absent from this list has not been credited.
    UnlockStopInput:
      type: object
      required: [lessonGroupId]
      properties:
        lessonGroupId:
          type: integer
          description: >-
            The station to open. The server resolves its language from the row
            itself and mints the ledger refId as stop:<language>:<groupId>, so
            no client-supplied idempotency key is accepted here.
    StopUnlockResult:
      type: object
      required: [balance, lessonGroupId, languageCode, unlocked, charged, cost]
      properties:
        balance: { type: integer }
        lessonGroupId: { type: integer }
        languageCode: { type: string }
        unlocked: { type: boolean }
        charged:
          type: boolean
          description: >-
            False when the learner already owned this stop — the call is a
            no-op that deducts nothing. Clients must not re-render a "spent"
            animation for it.
        cost: { type: integer }
    StreakRepairOffer:
      type: object
      required: [eligible, missedDay, restoresStreakDays, cost, balance]
      description: >-
        Whether the learner has a streak break worth mending, and what mending
        it would cost. `eligible` false means there is nothing to offer — no
        break, an absence too long to be a slip, or a break older than the
        repair window — and clients must show nothing at all in that case.
      properties:
        eligible: { type: boolean }
        missedDay:
          type: string
          nullable: true
          description: The YYYY-MM-DD local day that broke the streak.
        restoresStreakDays:
          type: integer
          description: >-
            The streak the learner would have again once the day is covered,
            measured on the same ladder the progress summary climbs.
        cost: { type: integer }
        balance: { type: integer }
    StreakRepairResult:
      type: object
      required: [balance, repairedDay, restoredStreakDays, charged, cost]
      properties:
        balance: { type: integer }
        repairedDay: { type: string }
        restoredStreakDays: { type: integer }
        charged:
          type: boolean
          description: >-
            False when this day was already repaired — the call is a no-op that
            deducts nothing.
        cost: { type: integer }
    DailyGiftState:
      type: object
      required:
        [
          day,
          chai,
          tier,
          tomorrowChai,
          claimed,
          claimable,
          streakDays,
          earnedToday,
          localDay,
          balance,
        ]
      properties:
        day:
          type: integer
          description: >-
            The streak day this box belongs to, clamped to the ladder's cap.
        chai:
          type: integer
          description: What the box holds. Linear from 1, capped at a week.
        tier:
          type: string
          enum: [small, medium, large, grand]
          description: >-
            Which of the four boxes to draw. A function of the DAY and not of
            the amount: the amount is economy tuning that has moved before, the
            box is a picture of how long the learner has kept it up. `grand` is
            the one with the gold ribbon.
        tomorrowChai:
          type: integer
          description: >-
            What tomorrow's box holds. Naming it is the mechanic. At the cap it
            equals `chai`, never `chai + 1`, because promising an eighth is a
            promise the ladder breaks the next morning.
        claimed:
          type: boolean
          description: True once today's box has been tapped. The tap is the grant.
        claimable:
          type: boolean
          description: >-
            True while the box is worth tapping: practised today and not yet
            opened.
        streakDays:
          type: integer
          description: The learner's current streak, which is what the ladder rides.
        earnedToday:
          type: boolean
          description: >-
            Whether today counts as a streak day yet. False with claimable false
            means "practise first", which is a different box from "come back
            tomorrow".
        localDay:
          type: string
          description: >-
            The learner's local day key, YYYY-MM-DD. Sent so a client can hold
            its own midnight without guessing at a timezone the server knows.
        balance:
          type: integer
          description: The Chai wallet after whatever has already happened today.

    DailyGiftClaimResult:
      allOf:
        - $ref: "#/components/schemas/DailyGiftState"
        - type: object
          required: [granted]
          properties:
            granted:
              type: boolean
              description: >-
                Whether THIS call wrote the ledger row. False means the day was
                already claimed, which is not an error: a double tap, a retried
                request and a second device all land here and all should see the
                same open box.

    StopUnlockOffer:
      type: object
      description: >-
        The served price of a Chai stop unlock. Present on a showroom journey
        payload only for the first zone, the only zone whose stops are
        purchasable. Clients must render this number, never a hardcoded one.
      properties:
        cost:
          type: integer
    TokenSpendResult:
      type: object
      required: [balance, granted, stationPausesEquipped]
      properties:
        balance: { type: integer }
        granted: { type: string }
        stationPausesEquipped: { type: integer }
        expressMultiplierActiveUntil:
          type: string
          format: date-time
          nullable: true

    BlockedUser:
      type: object
      description: >-
        One learner on the caller's blocked list. Carries the PUBLIC name only,
        never the private display name: everybody on this list is by definition
        not a friend any more, so the rule that governs the global feed and
        board governs this payload too.
      properties:
        userId:
          type: string
        displayName:
          type: string
          description: >-
            The name to render, which is the username if they chose one and the
            same stable pseudonym the feed showed otherwise, so the row the
            learner blocked is the row they recognise here.
        username:
          type: string
          nullable: true
          description: The learner's public name, or null if they never set one.
        createdAt:
          type: string
          format: date-time
          description: When the block was made.
      required:
        - userId
        - displayName
        - createdAt

    FeedActor:
      type: object
      description: >-
        The learner a feed entry is about. Name and mascot only: a feed never
        carries an email address, because a friend code is deliberately the
        only way to find another learner.
      properties:
        userId:
          type: string
        displayName:
          type: string
          nullable: true
          description: >-
            The name to render. On `scope=friends` it is the learner's private
            display name; on `scope=all` it carries the USERNAME instead, and
            the private display name is never sent.
        username:
          type: string
          nullable: true
          description: The learner's public name, or null if they never set one.
        equippedOutfit:
          type: string
          nullable: true
          description: >-
            The outfit this friend's Bolo is wearing (see OutfitCatalog ids), or
            null for the canonical undressed bird.
        equippedAccessory:
          type: string
          nullable: true
          description: >-
            The head accessory this friend's Bolo is wearing, or null. A separate
            slot from the garment.
        firstClassActive:
          type: boolean
          description: >-
            Whether this friend's First Class window is open right now. A
            boolean, never the expiry timestamp.
      required:
        - userId
        - displayName
        - equippedOutfit
        - equippedAccessory
        - firstClassActive

    FeedEntry:
      type: object
      description: >-
        One moment from the activity feed. Some come from the activity_events
        log; the rest are PROJECTED from what learners actually do often
        (practice_day, stop_completed, game_played), because the log alone
        holds only milestones and a feed of milestones is nearly empty.
      properties:
        id:
          type: string
          description: >-
            Stable across reads and prefixed by source ("e", "p", "s", "g"),
            because a projection has no single sequence to borrow from and two
            sources would otherwise collide on 1. Use it as a key, not as a
            row id in any table.
        type:
          type: string
          description: >-
            What happened: `equip_outfit`, `equip_accessory`, `badge_earned` or
            `zone_closeout`. Left open rather than enumerated so an older client
            meeting a newer event type can skip it instead of failing to parse
            the page; clients render nothing for a type they do not know.
        refId:
          type: string
          description: >-
            The subject of the event: the item id for an equip, the badge key
            for a badge, `languageCode:categoryId` for a zone closeout.
        payload:
          type: object
          additionalProperties: true
          nullable: true
          description: Everything a renderer needs beyond the type and the ref.
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/FeedActor"
      required:
        - id
        - type
        - refId
        - payload
        - createdAt
        - actor

    LeaderboardEntry:
      type: object
      description: One learner's standing on the leaderboard.
      properties:
        userId:
          type: string
        displayName:
          type: string
          nullable: true
          description: >-
            The name to render for this row. On `scope=friends` it is the
            learner's private display name, which is right because friends know
            each other. On `scope=all` it carries the USERNAME instead, and the
            private display name is never sent.
        username:
          type: string
          nullable: true
          description: >-
            The learner's public name, or null if they have never set one. A
            row on the global board always has one, by construction.
        xp:
          type: integer
          description: >-
            XP summed across every language from the XP ledger, over the
            requested window. All-time includes the pre-ledger backfill; the
            weekly window excludes it.
        currentStreakDays:
          type: integer
          description: >-
            This learner's current streak in days, read the same way every other
            streak surface reads it (their own time zone, covers included). Also
            the first tie-break when two learners are level on XP.
        reachedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this learner last earned XP in the window, which is when they
            reached the total shown. The final tie-break: level on XP and level
            on streak, whoever got there first ranks higher. Null for a learner
            with no XP in the window.
        rank:
          type: integer
          description: 1-based rank, highest XP first.
        isSelf:
          type: boolean
          description: True for the caller's own entry.
        equippedOutfit:
          type: string
          nullable: true
          description: >-
            The outfit this learner's Bolo is wearing (see OutfitCatalog ids), or null
            for the canonical undressed bird. Carried on the row so friend and
            leaderboard lists render each learner's mascot without a per-row fetch.
            Optional: older clients that predate outfits on rows simply ignore it.
        equippedAccessory:
          type: string
          nullable: true
          description: >-
            The head accessory this learner's Bolo is wearing, or null. A garment and
            an accessory are separate slots, so a row that shipped only the garment
            would show a pagdi-wearing friend bare-headed.
        firstClassActive:
          type: boolean
          description: >-
            Whether this learner's First Class window is open right now,
            resolved server-side from the expiry the spend wrote. A boolean and
            never the timestamp: a friend's exact expiry is not the reader's
            business, and a countdown on someone else's row is noise.
      required:
        - userId
        - displayName
        - xp
        - currentStreakDays
        - reachedAt
        - rank
        - isSelf
        - firstClassActive

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Languages, categories, phrases, attempts and progress
  - name: openai
    description: OpenAI AI audio and content operations
  - name: friends
    description: Friends, friend requests, and the friends leaderboard
  - name: account
    description: Profile, notification and learning preferences, and account deletion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /languages:
    get:
      operationId: listLanguages
      tags: [learning]
      summary: List all supported learning languages
      responses:
        "200":
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /categories:
    get:
      operationId: listCategories
      tags: [learning]
      summary: List all lesson categories with progress for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /categories/{id}/lesson-groups/{lang}:
    get:
      operationId: listCategoryLessonGroups
      tags: [learning]
      summary: List a category's lesson groups (journey-map stations) for a language, with per-user progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered lesson groups plus the count of phrases not yet assigned to any group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupList"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lesson-groups/{id}/test-out:
    get:
      operationId: getLessonGroupTestout
      tags: [learning]
      summary: Sample phrases for a test-out assessment of one lesson group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A fresh random sample plus the pass requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutSample"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: submitLessonGroupTestout
      tags: [learning]
      summary: Submit a test-out assessment (server-signed evaluation tokens only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonGroupTestoutInput"
      responses:
        "200":
          description: Graded result; a pass persists tested_out for the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutResult"
        "400":
          description: Invalid submission (bad tokens, wrong phrases, or wrong count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /zones/{categoryId}/test-out/{lang}:
    get:
      operationId: getZoneTestout
      tags: [learning]
      summary: Sample one phrase per station for a zone test-out assessment
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A fresh random sample plus the pass requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutSample"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "403":
          description: Zone locked by the cross-zone progression gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /zones/{categoryId}/test-out:
    post:
      operationId: submitZoneTestout
      tags: [learning]
      summary: Submit a zone test-out (server-signed evaluation tokens only)
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneTestoutInput"
      responses:
        "200":
          description: Graded result; a pass latches tested_out for every group in the zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonGroupTestoutResult"
        "400":
          description: Invalid submission (bad tokens, non-distinct stations, or wrong count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "403":
          description: Zone locked by the cross-zone progression gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lesson-groups/{id}/phrases:
    get:
      operationId: listLessonGroupPhrases
      tags: [learning]
      summary: List the ordered phrases of one lesson group (same phrase shape as the category listing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ordered phrases of the lesson group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/sentences/{lang}:
    get:
      operationId: listCategorySentences
      tags: [learning]
      summary: List the topic's Plus-only sentence stage for a language
      description: >-
        The topic's final step after the phrase list — full, natural sentences
        that build on the topic's vocabulary. Bolo! Plus only: callers without
        the sentences feature receive a 402 upgrade payload and no sentence
        text. Generated + cached on first request for dynamically generated
        lessons.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sentences (same shape as phrases)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only feature or language)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/phrases/{lang}:
    get:
      operationId: listCategoryPhrases
      tags: [learning]
      summary: List phrases in a category for a language (generated + cached on first request)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addCategoryPhrases
      tags: [learning]
      summary: Generate and append fresh AI phrases to a category's lesson
      description: >-
        Generates additional beginner phrases in the language's native script,
        avoiding phrases already in the lesson, and appends them to the existing
        lesson so they persist and count toward progress.


        Bounded three ways. Appends to one topic are serialized on a
        topic-keyed lock, so concurrent taps can never insert duplicates: a
        caller who loses the race gets 409 append_in_progress. The topic may not
        grow past the plan's phraseCeiling (see Category), counted in visible
        rows; a request near the boundary is clamped to the remaining headroom
        rather than refused, and only zero headroom refuses: 402
        phrase_ceiling when an upgrade would lift it, 409 topic_full on
        All-Access and Family, where nothing would. Each learner may append ten
        times per rolling hour across all topics; beyond that, 429
        append_rate_limited with retryAfterSeconds. Every refusal happens before
        any AI call, so a blocked tap costs nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPhrasesInput"
      responses:
        "200":
          description: >-
            The newly added phrases. An empty array means the request succeeded
            but the model only returned phrases the topic already had.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: >-
            Upgrade required, for a Plus-only language, or reason
            phrase_ceiling: the topic holds as many phrases as this plan allows
            and All-Access would lift it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Refused with nothing to upgrade to. reason append_in_progress: an
            append for this topic is already running, retry shortly. reason
            topic_full: the caller is on the top tier and the topic is at its
            ceiling, so no upgrade prompt should be shown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendRefused"
        "429":
          description: >-
            reason append_rate_limited: the learner has used their ten manual
            appends for this rolling hour. retryAfterSeconds says when they may
            continue; also sent as the Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendRefused"

  /review/phrases:
    get:
      operationId: listReviewPhrases
      tags: [learning]
      summary: The learner's not-yet-mastered phrases for a language, spaced-repetition ordered (due first)
      description: >-
        Returns the phrases the learner has practiced but not yet mastered
        (best attempt score below the mastery threshold) for the given
        language, ordered by a spaced-repetition schedule so phrases that are
        due (or overdue) to be reviewed surface first, with the weakest best
        score breaking ties. Each phrase climbs a Leitner-style spacing ladder
        on passing attempts (widening the gap before it resurfaces) and resets
        on a miss. Returns an empty array when there is nothing to review.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weak phrases to review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (review sessions are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /phrases/{id}:
    get:
      operationId: getPhrase
      tags: [learning]
      summary: Get a single phrase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attempts:
    post:
      operationId: createAttempt
      tags: [learning]
      summary: Record a pronunciation practice attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "201":
          description: Created attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"

  /game-sessions:
    post:
      operationId: recordGameSession
      tags: [learning]
      summary: Record the results of a mini-game session and award XP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionInput"
      responses:
        "201":
          description: Game session recorded and XP awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSessionResult"

  /attempts/recent:
    get:
      operationId: listRecentAttempts
      tags: [learning]
      summary: Recent practice attempts feed for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attempt"

  /badges:
    get:
      operationId: listBadges
      tags: [learning]
      summary: Badge catalog annotated with earned/locked status for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of badges with earned status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [learning]
      summary: Overall learning progress summary for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/analytics:
    get:
      operationId: getProgressAnalytics
      tags: [learning]
      summary: Advanced progress analytics for a language (Bolo! Plus only)
      description: >-
        A deeper progress breakdown than the basic summary: per-category
        mastery, a recent daily-activity trend, and how many phrases are due for
        review. Advanced analytics are a Bolo! Plus feature.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Advanced analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressAnalytics"
        "402":
          description: Upgrade required (advanced analytics are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /entitlements:
    get:
      operationId: getEntitlements
      tags: [entitlements]
      summary: The caller's plan, unlocked features, and daily limits
      description: >-
        Returns the authenticated user's effective plan (Free vs Bolo! Plus),
        subscription status, the languages they may access, the feature flags
        they have unlocked. The daily new-lesson meter is retired: dailyNewLessons
        reports null limits for every plan and is kept only for installed builds.
        Clients call this to know what is unlocked and how to render the paywall.
      responses:
        "200":
          description: The caller's entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"

  /entitlements/chosen-language:
    post:
      operationId: setChosenLanguage
      tags: [entitlements]
      summary: Record the One Language tier's chosen language
      description: >-
        Records the single language a One Language ($6.99) subscriber unlocks on
        top of free Hindi, captured at purchase. Once set while on the middle
        tier the choice is locked: changing it returns 409, and only upgrading
        to all-access frees it. Choosing Hindi or an unknown language is
        rejected. Returns the fresh entitlements snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetChosenLanguageInput"
      responses:
        "200":
          description: The caller's updated entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "400":
          description: Missing or invalid language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Language not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The chosen language is locked for this subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: The caller's profile, preferences, and subscription summary
      description: >-
        Returns the authenticated learner's profile (name, email, avatar), their
        notification and learning preferences, and a compact subscription
        summary — everything the account settings screen renders from.
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the caller's account and all their data
      description: >-
        Permanently deletes the learner's Clerk identity and every local record
        (attempts, progress, friendships, subscription state). Idempotent and
        irreversible; the client signs the user out afterwards.
      responses:
        "200":
          description: The account was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResult"

  /account/profile:
    patch:
      operationId: updateAccountProfile
      tags: [account]
      summary: Update the caller's display name and/or avatar
      description: >-
        Updates the display name (mirrored to Clerk, the identity source of
        truth) and/or the avatar reference. Only the fields present in the body
        are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResult"
        "400":
          description: Nothing to update or an invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The identity service could not apply the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/preferences:
    patch:
      operationId: updateAccountPreferences
      tags: [account]
      summary: Update notification and/or learning preferences
      description: >-
        Updates any subset of the notification (daily reminder toggle + time)
        and learning (active language, daily goal, theme) preferences. Only the
        provided fields change; each is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesInput"
      responses:
        "200":
          description: The updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPreferencesResult"
        "400":
          description: An invalid preference value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The chosen language does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription:
    get:
      operationId: getAccountSubscription
      tags: [account]
      summary: The caller's full subscription-management snapshot
      description: >-
        Returns the tier/status, relevant dates, chosen language, a best-effort
        payment-method summary, and billing/invoice history. Softer fields
        (payment method, history) are pulled from the provider where available
        and degrade to null/empty when it isn't configured or doesn't expose
        them.
      responses:
        "200":
          description: The subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/cancel:
    post:
      operationId: cancelAccountSubscription
      tags: [account]
      summary: Cancel the caller's subscription at the period boundary
      description: >-
        Marks the subscription canceled. Paid access continues until the current
        period ends (the plan stays live until currentPeriodEnd lapses).
        Canceling also clears any active pause.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No active subscription to cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/pause:
    post:
      operationId: pauseAccountSubscription
      tags: [account]
      summary: Pause the caller's subscription for a bounded window
      description: >-
        Pauses the subscription for 1–3 months. While paused the provider
        suspends paid access but does not expire the subscription; it resumes
        automatically when the window closes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseSubscriptionInput"
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No active subscription to pause or an invalid month count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The subscription is already paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/resume:
    post:
      operationId: resumeAccountSubscription
      tags: [account]
      summary: Resume a canceling subscription (undo a pending cancel)
      description: >-
        Clears a pending cancellation, returning the subscription status from
        canceled to active. No discount is applied, the retention offer is not
        consumed, and the current period end is unchanged. Idempotent for an
        already-active paid subscription and repeatable any number of times.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No paid subscription to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The subscription is paused, not canceling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/unpause:
    post:
      operationId: unpauseAccountSubscription
      tags: [account]
      summary: Resume a paused subscription early
      description: >-
        Lets a learner who changes their mind come back before the pause
        window closes. Clears the pause and resumes the underlying paid tier
        immediately — the same outcome as waiting for pauseUntil to elapse
        naturally, just early. Only applies to a currently-paused
        subscription; a canceling, active, or expired subscription has
        nothing to unpause.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: The subscription is not paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/retention:
    post:
      operationId: acceptRetentionOffer
      tags: [account]
      summary: Accept the one-time discounted 3-month retention offer
      description: >-
        Redeems the discounted 3-month retention offer. Resumes/keeps the paid
        tier (clearing any pending cancel or pause), extends the current period
        by three months, and records that the offer was accepted so it can only
        be redeemed once.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No subscription eligible for the retention offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The retention offer was already redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/search:
    get:
      operationId: searchFriendByEmail
      tags: [friends]
      summary: Find a learner by their exact email
      description: >-
        Looks up a single learner by their exact email address so the caller can
        send them a friend request. The caller is never returned. Available to
        all authenticated learners.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The matching learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No learner found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests:
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request to a learner by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestInput"
      responses:
        "201":
          description: The created pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          description: Missing email or an attempt to friend yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No learner found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request or friendship already exists between the two learners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/incoming:
    get:
      operationId: listIncomingFriendRequests
      tags: [friends]
      summary: Pending friend requests awaiting the caller's response
      responses:
        "200":
          description: Incoming pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/outgoing:
    get:
      operationId: listOutgoingFriendRequests
      tags: [friends]
      summary: The caller's pending friend requests still awaiting the other learner
      responses:
        "200":
          description: Outgoing pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The now-accepted friendship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedFriendship"
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Request declined and removed
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: The caller's accepted friends
      responses:
        "200":
          description: Accepted friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"

  /friends/{userId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove an accepted friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Friendship removed
        "404":
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/invite:
    post:
      operationId: sendFriendInvite
      tags: [friends]
      summary: Invite a non-member to download Bolo! by email
      description: >-
        Sends a "download Bolo!" referral email to an address that does not
        belong to any existing learner. Rate-limited to one send per
        (caller, recipient) pair per 24 hours to prevent abuse. If the invited
        person later signs up with that email, a pending friend request is
        automatically created from the inviter so the new learner sees it
        immediately on sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendInviteInput"
      responses:
        "200":
          description: Invite sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendInviteResult"
        "400":
          description: Missing or invalid email, or that email belongs to an existing learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit reached — already sent an invite to this address recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/leaderboard:
    get:
      operationId: getFriendsLeaderboard
      tags: [friends]
      summary: The caller and their friends ranked by total XP
      description: >-
        Returns the caller plus their accepted friends ranked by total XP
        (summed across every language), highest first. Each entry carries a
        display name, XP, and 1-based rank, and the caller's own entry is flagged
        with `isSelf` so clients can highlight their position. Available to all
        authenticated learners.
      responses:
        "200":
          description: The friends leaderboard, ranked highest XP first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /games/script-trace/progress:
    get:
      operationId: getScriptTraceProgress
      tags: [learning]
      summary: Get Script Trace chapter progress
      description: >-
        Returns the caller's per-character tracing progress for the requested
        Script Trace chapter. Plus-only — non-Plus callers receive a 402.
      parameters:
        - name: chapter
          in: query
          required: true
          schema:
            type: string
            enum:
              - gujarati-vowels
              - gujarati-consonants
              - hindi-vowels
              - hindi-consonants
      responses:
        "200":
          description: List of per-character progress entries for the chapter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptTraceCharacterProgress"
        "400":
          description: Invalid or missing chapter parameter
        "402":
          description: Upgrade required (Script Trace is a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
    post:
      operationId: recordScriptTraceProgress
      tags: [learning]
      summary: Record a Script Trace attempt
      description: >-
        Saves the result of a single character trace. Upserts so the best score
        is preserved and the `passed` flag is sticky (never reverted once true).
        Plus-only — non-Plus callers receive a 402.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptTraceProgressInput"
      responses:
        "201":
          description: The updated character progress after the attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptTraceCharacterProgress"
        "400":
          description: Validation error
        "402":
          description: Upgrade required (Script Trace is a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /games/daily-quiz/today:
    get:
      operationId: getDailyQuiz
      tags: [learning]
      summary: Get today's daily quiz for a language (Plus only)
      description: >-
        Returns today's 5-question daily quiz for the learner's active language.
        If the quiz hasn't been generated yet it is created on-demand.
        If the learner has already completed today's quiz, `completed` is true
        and their score is included. The same questions are served to every
        learner (shared daily experience). Requires Bolo! Plus.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: Language code (e.g. "gu")
      responses:
        "200":
          description: Today's quiz (and completion state if already played)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuizResponse"
        "400":
          description: Missing lang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required (Bolo! Plus only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "502":
          description: Quiz generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /games/daily-quiz/complete:
    post:
      operationId: completeDailyQuiz
      tags: [learning]
      summary: Submit the learner's answers for today's daily quiz (Plus only)
      description: >-
        Records the learner's score for today's quiz. Enforces one submission
        per user per language per UTC day. Returns the score and XP awarded
        (10 XP per correct answer, +20 bonus for a perfect 5/5). Requires
        Bolo! Plus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDailyQuizInput"
      responses:
        "200":
          description: Quiz completed — score and XP awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuizResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Upgrade required (Bolo! Plus only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "409":
          description: Already completed today's quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contact:
    post:
      operationId: submitContactForm
      tags: [account]
      summary: Submit a support message via the Contact Us form
      description: >-
        Saves the message to the contact_submissions table and sends a
        notification email to the support inbox via Resend. The DB row is always
        saved; if the email send fails email_sent stays false and the caller still
        receives { success: true }. Rate-limited to 3 submissions per 10 minutes
        per user/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFormInput"
      responses:
        "200":
          description: Message saved (and notification email sent if configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFormResult"
        "400":
          description: Validation error (missing field or invalid email/category)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: DB insert failed — message was not saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /phrases/{id}/report:
    post:
      operationId: reportPhrase
      tags: [learning]
      summary: Flag a phrase as incorrect (Spec B2)
      description: >-
        Stores a phrase report (reason + optional note) in phrase_reports.
        language_code and stage are derived server-side from the phrase row —
        never client-supplied. Fire-and-forget from the client's perspective:
        beyond the rolling-hour cap (20 stored reports per user) the server
        returns { success: true } and stores nothing. Duplicate reports for
        the same phrase are allowed; dedup is a review-time concern.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhraseReportInput"
      responses:
        "200":
          description: Report stored (or silently dropped over the cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseReportResult"
        "400":
          description: Invalid phrase id, reason, or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Phrase not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openai/tts/voices:
    get:
      operationId: listTtsVoices
      tags: [openai]
      summary: List available TTS voices and the caller's current preference
      description: >-
        Returns the curated VOICE_CATALOG of ElevenLabs premade voices plus the
        authenticated user's current ttsVoice preference (null = Auto).
      responses:
        "200":
          description: Voice catalog and current preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceListResult"

  /openai/tts:
    post:
      operationId: synthesizeSpeech
      tags: [openai]
      summary: Convert text to spoken audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechInput"
      responses:
        "200":
          description: Synthesized audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechResult"

  /openai/pronunciation:
    post:
      operationId: evaluatePronunciation
      tags: [openai]
      summary: Evaluate a spoken attempt against a target phrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PronunciationInput"
      responses:
        "200":
          description: Pronunciation evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationResult"

  /pilot-capture/eligibility:
    get:
      operationId: getPilotCaptureEligibility
      tags: [openai]
      summary: Whether the caller may use capture mode (TEMPORARY, pilot capture)
      description: >-
        TEMPORARY scaffolding for the pilot calibration corpus: reports
        whether the signed-in user is in the PILOT_CAPTURE_USER_IDS
        allowlist. The web practice page only activates ?mode=capture when
        this returns true. Remove with capture mode.
      responses:
        "200":
          description: Eligibility flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotCaptureEligibility"

  /pilot-capture/discard-last:
    post:
      operationId: discardLastPilotCapture
      tags: [openai]
      summary: Mark the caller's most recent capture-mode clip discarded (TEMPORARY)
      description: >-
        TEMPORARY scaffolding for the pilot calibration corpus: rewrites the
        sidecar of the caller's most recent capture-mode clip with
        discarded=true so the harvest skips it (capture mode's "redo this
        attempt"). Remove with capture mode.
      responses:
        "200":
          description: Discard outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotCaptureDiscardResult"

  /openai/generate-phrase:
    post:
      operationId: generatePhrase
      tags: [openai]
      summary: Generate a fresh practice phrase with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhraseRequest"
      responses:
        "200":
          description: A generated phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPhrase"

  /openai/chat:
    post:
      operationId: chatTurn
      tags: [openai]
      summary: One turn of a live conversation with Bolo the parrot
      description: >-
        Given a learner's recorded speech and a target language, transcribes
        the audio, has Bolo the parrot reply in character and in-language
        (naturally answering "how do you say X" / translation-style meta
        questions), synthesizes the reply to speech, and returns all three
        plus the caller's remaining weekly chat-time allowance. Validates the
        requested language against the caller's plan and, for Free, the
        2-minutes-per-week chat cap before doing any AI work. One Language and
        Plus subscribers are never time-capped (still subject to the
        plan-based language allowlist). Accepts a short recent-turn history so
        replies stay contextual without server-side chat storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatTurnInput"
      responses:
        "200":
          description: The learner's transcript, Bolo's reply, and reply audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTurnResult"
        "402":
          description: >-
            Upgrade required (this language is locked for the caller's plan,
            or the Free weekly chat-time cap has been reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Unknown language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The caller's family-plan status
      description: >-
        Returns the caller's relationship to a family plan: "owner" (with the
        join code and full seat list), "member" (whose plan they're on), or
        "none". `active` reflects whether the owner's subscription currently
        grants the family Plus access.
      responses:
        "200":
          description: The family status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStatus"

  /family/invites:
    post:
      operationId: createFamilyInvite
      tags: [family]
      summary: Invite someone to the family plan by email (owner only)
      description: >-
        Reserves a pending seat and emails a personal join link. Duplicate
        emails are rejected without consuming a seat; a full plan (4 people
        including pending invites) is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyInviteInput"
      responses:
        "201":
          description: The pending invite
          content:
            application/json:
              schema:
                type: object
                required: [id, status, email]
                properties:
                  id: { type: integer }
                  status: { type: string }
                  email: { type: string }
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate invite or the plan is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The invite email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/invites/{seatId}:
    delete:
      operationId: revokeFamilyInvite
      tags: [family]
      summary: Revoke a pending invite, freeing its seat (owner only)
      parameters:
        - name: seatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No pending invite with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/members/{memberUserId}:
    delete:
      operationId: removeFamilyMember
      tags: [family]
      summary: Remove a member from the family plan (owner only)
      description: >-
        Frees the member's seat immediately. The member drops to Free on their
        next request; none of their learning data is deleted.
      parameters:
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: That person isn't on the caller's plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/leave:
    post:
      operationId: leaveFamily
      tags: [family]
      summary: Give up the caller's own family seat
      responses:
        "200":
          description: Left the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: The caller isn't on a family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/code/regenerate:
    post:
      operationId: regenerateFamilyCode
      tags: [family]
      summary: Replace the shareable join code (owner only)
      description: The old code stops working immediately.
      responses:
        "200":
          description: The new join code
          content:
            application/json:
              schema:
                type: object
                required: [joinCode]
                properties:
                  joinCode: { type: string }
        "404":
          description: The caller has no family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/join:
    post:
      operationId: joinFamily
      tags: [family]
      summary: Claim a family seat via join code or emailed invite link
      description: >-
        Joins a family plan. If the caller pays for their own Plus through
        Stripe, that subscription is canceled with proration credit before the
        seat is granted (`previousSubscriptionCanceled` is true in that case).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [ok, ownerName, previousSubscriptionCanceled, active]
                properties:
                  ok: { type: boolean }
                  ownerName: { type: string }
                  previousSubscriptionCanceled: { type: boolean }
                  active: { type: boolean }
        "400":
          description: Neither a code nor an invite token was provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid code or invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Plan full, already on a plan, or the invite was used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The caller's existing subscription couldn't be closed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [openai]
      summary: Fetch client-safe metadata for a zone capstone scenario
      description: >-
        Returns the public subset of a scenario (title, framing copy, target
        phrases). Steering instructions are never sent to the client. Auth
        required; no entitlement gate -- the gate is on POST /openai/chat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Scenario id (e.g. "greetings-manners")
      responses:
        "200":
          description: Scenario metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioPublic"
        "404":
          description: Unknown scenario id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /journey/zone-stamps:
    get:
      operationId: listZoneStamps
      tags: [learning]
      summary: List zone capstone conversation stamps for the caller
      description: >-
        Returns a lightweight list of zones the caller has already completed
        the capstone conversation for. Used by the journey map to show "Replay
        the chat" links on completed zones.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: Language code to filter stamps by.
      responses:
        "200":
          description: List of completed zone stamps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneStamp"

  /referral:
    get:
      operationId: getReferral
      tags: [referral]
      summary: The caller's referral code and referral stats
      description: >-
        Returns the caller's shareable referral code (minted lazily on the
        first fetch; short uppercase string from an unambiguous alphabet with
        no 0/O/1/I), counts of pending and activated redemptions attributed
        to the caller, and the total Chai earned from referrals. The Chai
        total is derived from the token ledger, never a stored counter.
      responses:
        "200":
          description: Referral summary for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"

  /referral/redeem:
    post:
      operationId: redeemReferral
      tags: [referral]
      summary: Redeem another learner's referral code
      description: >-
        Records attribution ONLY; nothing is granted at redeem time. Grants
        for both sides land later, when the referee's first completed session
        activates the redemption server-side. A learner can redeem at most
        one code ever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralRedeemInput"
      responses:
        "201":
          description: Attribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralRedeemResult"
        "400":
          description: >-
            Invalid payload, or self-referral ("You cannot use your own
            code.").
        "404":
          description: >-
            Unknown code ("That code did not match. Check it and try
            again.").
        "409":
          description: >-
            Caller already redeemed a code ("You have already used a referral
            code.").

  /journey/signal-waves:
    post:
      operationId: recordSignalWave
      tags: [learning]
      summary: Persist a signal wave-through for the caller
      description: >-
        Records that the caller waved through a trackside signal without
        playing its quick game, so the gate-up state survives devices and
        reinstalls. Idempotent — replaying the same signal is a silent no-op.
        The ref is composed server-side as languageCode:categoryId:gap-N,
        matching the first-clear ledger refId convention; a later clear
        supersedes the wave for display, so waves are never deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalWaveInput"
      responses:
        "200":
          description: Wave recorded (or already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalWaveResult"

  /tokens:
    get:
      operationId: getTokens
      tags: [tokens]
      summary: Current Chai balance and convenience-item state
      responses:
        "200":
          description: The caller's token state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenState"
  /tokens/spend:
    post:
      operationId: spendTokens
      tags: [tokens]
      summary: Spend Chai on a convenience item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokensSpendInput"
      responses:
        "200":
          description: Spend applied (or duplicate refId no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSpendResult"
        "409":
          description: insufficient_tokens, pause_max_equipped, or multiplier_active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tokens/unlock-stop:
    post:
      operationId: unlockStop
      tags: [tokens]
      summary: Spend Chai to open one stop in a plan-locked language
      description: >-
        Buys a single station in a language the caller's plan does not include.
        The caller names only a lesson group id: the language, the price and the
        ledger idempotency key are all derived server-side, and the purchase is
        once-ever (a repeat call returns 200 with charged=false and deducts
        nothing). Only stops inside the language's FIRST zone — the zone that
        hosts the free-taste stop — are purchasable; anything beyond it answers
        402 UpgradeRequired because that is the All-Access boundary. Money and
        state conflicts (insufficient_tokens, stop_already_free,
        stop_not_unlockable) answer 409, matching the other Chai spends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockStopInput"
      responses:
        "200":
          description: Stop unlocked (or already owned — charged=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopUnlockResult"
        "402":
          description: Beyond the first zone — All-Access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "409":
          description: insufficient_tokens, stop_already_free, or stop_not_unlockable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tokens/streak-repair:
    get:
      operationId: getStreakRepair
      tags: [tokens]
      summary: Whether a broken streak can be mended, and for how much
      description: >-
        Streak repair is the ratified exception to the delight-only Chai spine:
        it buys back a streak lost to life happening, never an advantage. A day
        is repairable only when it is a real hole with practice on the day
        before it, and only within two local days — so at most one break is
        ever on offer and repairs cannot be walked backwards through history.
      responses:
        "200":
          description: The offer, or eligible=false when there is nothing to mend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakRepairOffer"
  /tokens/repair-streak:
    post:
      operationId: repairStreak
      tags: [tokens]
      summary: Spend Chai to mend the day that broke the streak
      description: >-
        Takes no body. The server re-derives which day is repairable, composes
        the ledger key from it (streak:<YYYY-MM-DD>), and charges
        STREAK_REPAIR_COST once — a replay answers 200 with charged=false and
        deducts nothing. Refusals are 409 and never 402: a broken streak is not
        a plan boundary and must never become an upsell.
      responses:
        "200":
          description: Streak mended (or already mended — charged=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakRepairResult"
        "409":
          description: >-
            insufficient_tokens, no_break_to_repair, break_too_long, or
            repair_window_expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /outfits:
    get:
      operationId: getOutfits
      tags: [outfits]
      summary: Outfit catalog with prices, ownership and the equipped choice
      responses:
        "200":
          description: The catalog as it stands for this learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitCatalog"
  /outfits/buy:
    post:
      operationId: buyOutfit
      tags: [outfits]
      summary: Spend Chai on an outfit for Bolo
      description: >-
        Buys an outfit once-ever. Ownership is the ledger row (refId
        outfit:<id>), so a repeat call returns 200 with charged=false, deducts
        nothing and leaves the equipped choice untouched. A purchase that does
        charge also equips the outfit, because buying it is the act of putting
        it on. Insufficient balance answers 409, matching the other Chai
        spends; an unknown outfit id answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyOutfitInput"
      responses:
        "200":
          description: Bought (or already owned — charged=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitPurchaseResult"
        "404":
          description: No such outfit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: insufficient_tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /outfits/equip:
    post:
      operationId: equipOutfit
      tags: [outfits]
      summary: Wear an owned outfit, or go back to undressed Bolo
      description: >-
        Free and instant. Sends an owned outfit id to wear it, or null to
        unequip. Equipping an outfit the learner does not own answers 409
        outfit_not_owned — ownership is never inferred from the equip call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipOutfitInput"
      responses:
        "200":
          description: The equipped choice after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitEquipResult"
        "404":
          description: No such outfit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: outfit_not_owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    CreateFamilyInviteInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        basePath:
          type: string
          description: The web app's base path, used to build the join link.

    JoinFamilyInput:
      type: object
      properties:
        code: { type: string }
        inviteToken: { type: string }

    FamilySeat:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, active]
        email:
          type: string
          nullable: true
        memberUserId:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        joinedAt:
          type: string
          nullable: true

    FamilyStatus:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, member, none]
        active:
          type: boolean
        joinCode:
          type: string
        capacity:
          type: integer
        seats:
          type: array
          items:
            $ref: "#/components/schemas/FamilySeat"
        ownerName:
          type: string
        joinedAt:
          type: string
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AccountProfile:
      type: object
      description: The learner's identity fields, mirrored from Clerk.
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - displayName
        - avatarUrl

    AccountNotificationPreferences:
      type: object
      properties:
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          nullable: true
          description: Preferred local send time as "HH:MM" (24h), or null.
      required:
        - dailyReminderEnabled
        - dailyReminderTime

    AccountLearningPreferences:
      type: object
      properties:
        activeLanguage:
          type: string
          nullable: true
          description: The language code the learner is actively studying, or null.
        dailyGoal:
          type: integer
          description: Target attempts per day (1–100).
        theme:
          type: string
          description: Client colour theme ("system" | "light" | "dark").
        timezone:
          type: string
          nullable: true
          description: >-
            IANA time zone (e.g. "America/Los_Angeles") used to bucket practice
            into local calendar days for streaks, or null (falls back to UTC).
        hasCompletedTour:
          type: boolean
          description: >-
            Whether the learner has completed (or explicitly skipped) the
            onboarding tour. Defaults to false for new and existing users.
        hasChosenLanguage:
          type: boolean
          description: >-
            Whether the learner has EXPLICITLY chosen a learning language (the
            post-sign-up selection step, the home picker, or account settings).
            Distinct from activeLanguage being non-null — the web client seeds
            that with a local default on first reconcile. Optional for mobile
            back-compat; treat absence as false.
        ttsVoice:
          type: string
          nullable: true
          description: >-
            The learner's global TTS voice preference (Plus only). When non-null
            this is an ElevenLabs premade voice ID from the VOICE_CATALOG. Null
            means Auto — use the per-language default voice.
      required:
        - activeLanguage
        - dailyGoal
        - theme
        - timezone
        - hasCompletedTour
        - ttsVoice

    AccountPreferences:
      type: object
      properties:
        notifications:
          $ref: "#/components/schemas/AccountNotificationPreferences"
        learning:
          $ref: "#/components/schemas/AccountLearningPreferences"
      required:
        - notifications
        - learning

    AccountSubscriptionSummary:
      type: object
      description: A compact subscription block returned inline by GET /account.
      properties:
        tier:
          type: string
        status:
          type: string
        chosenLanguage:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        pauseUntil:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        retentionOfferAcceptedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - tier
        - status
        - chosenLanguage
        - trialEndsAt
        - currentPeriodEnd
        - pauseUntil
        - cancelAtPeriodEnd
        - retentionOfferAcceptedAt

    PaymentMethodSummary:
      type: object
      description: >-
        A best-effort summary of how the subscription is billed. Every field is
        nullable because the provider may not expose it.
      properties:
        store:
          type: string
          nullable: true
          description: The store/processor the subscription is billed through.
        managementUrl:
          type: string
          nullable: true
          description: A link where the customer can manage/cancel with the store.
      required:
        - store
        - managementUrl

    BillingHistoryEntry:
      type: object
      description: One subscription period from the provider's billing history.
      properties:
        productId:
          type: string
        store:
          type: string
          nullable: true
        purchasedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        periodType:
          type: string
          nullable: true
        status:
          type: string
          description: '"active" | "expired" | "canceled" — derived from the dates/flags.'
      required:
        - productId
        - store
        - purchasedAt
        - expiresAt
        - periodType
        - status

    SubscriptionDetails:
      type: object
      description: >-
        The full subscription-management snapshot: the server-authoritative
        tier/status/dates and chosen language, plus the softer provider-sourced
        payment method and billing history (which degrade gracefully).
      properties:
        tier:
          type: string
        status:
          type: string
        chosenLanguage:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        pauseUntil:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        retentionOfferAcceptedAt:
          type: string
          format: date-time
          nullable: true
        provider:
          type: string
          nullable: true
        paymentMethod:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentMethodSummary"
        billingHistory:
          type: array
          items:
            $ref: "#/components/schemas/BillingHistoryEntry"
      required:
        - tier
        - status
        - chosenLanguage
        - trialEndsAt
        - currentPeriodEnd
        - pauseUntil
        - cancelAtPeriodEnd
        - retentionOfferAcceptedAt
        - provider
        - paymentMethod
        - billingHistory

    PauseSubscriptionInput:
      type: object
      description: How long to pause the subscription for.
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 3
          description: Number of months to pause (1–3). Defaults to 1 if omitted.

    Account:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/AccountProfile"
        preferences:
          $ref: "#/components/schemas/AccountPreferences"
        subscription:
          $ref: "#/components/schemas/AccountSubscriptionSummary"
      required:
        - profile
        - preferences
        - subscription

    AccountProfileResult:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/AccountProfile"
      required:
        - profile

    AccountPreferencesResult:
      type: object
      properties:
        preferences:
          $ref: "#/components/schemas/AccountPreferences"
      required:
        - preferences

    UpdateProfileInput:
      type: object
      description: Any subset of the editable profile fields.
      properties:
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true

    UpdatePreferencesInput:
      type: object
      description: Any subset of the notification and learning preferences.
      properties:
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          nullable: true
        activeLanguage:
          type: string
          nullable: true
        dailyGoal:
          type: integer
        theme:
          type: string
          enum: [system, light, dark]
        timezone:
          type: string
          nullable: true
        hasCompletedTour:
          type: boolean
        hasChosenLanguage:
          type: boolean
          description: >-
            Marks the learner as having explicitly chosen a language. Only
            `true` is accepted — a choice can't be unmade. Sent by explicit
            picks (selection step, home picker, account settings); the
            client's first-reconcile seed write must never include it.
        ttsVoice:
          type: string
          nullable: true
          description: >-
            Global TTS voice preference (Plus only). Must be a valid voice ID
            from the voice catalog, or null to reset to Auto.

    DeleteAccountResult:
      type: object
      properties:
        deleted:
          type: boolean
      required:
        - deleted

    SetChosenLanguageInput:
      type: object
      properties:
        language:
          type: string
          description: The language code to unlock (must not be Hindi).
      required:
        - language

    Language:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        nativeName:
          type: string
        script:
          type: string
        fontFamily:
          type: string
        rtl:
          type: boolean
        sortOrder:
          type: integer
        speechCapability:
          type: string
          enum: [supported, degraded, unsupported]
          description: >
            How well speech recognition actually hears this language, verified
            by a per-language probe. `supported` = full scored practice.
            `degraded` = scoring runs but unverifiable failures soften to
            nocatch; clients show a one-time "feedback is approximate" notice.
            `unsupported` = recognition verifiably fails on correct speech;
            clients switch to listen-record-compare practice with no scored
            band. Optional for mobile back-compat; treat absence as `supported`.
        communityReviewed:
          type: boolean
          description: >-
            True when this language's lesson content is primarily
            batch-generated (the C1 rollout set) with community review ongoing
            — clients may show a one-line "you can flag anything that looks
            wrong" note. Derived server-side from the committed rollout data;
            never hardcode the set client-side. Optional for mobile
            back-compat; treat absence as false.
      required:
        - code
        - name
        - nativeName
        - script
        - fontFamily
        - rtl
        - sortOrder

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        accent:
          type: string
        sortOrder:
          type: integer
        titleNative:
          type: ["string", "null"]
        phraseCount:
          type: integer
          description: >-
            How many phrase rows this caller can see in the topic. This is the
            number the topic's phrase ceiling is measured against.
        masteredCount:
          type: integer
        phraseCeiling:
          type: integer
          description: >-
            The most phrases this topic may grow to on the caller's plan
            (visible rows, phrase stage only). Server-authoritative: clients
            must not hardcode it. When phraseCount has reached it, "Add more
            phrases" is not offered.
        lockedPhraseCount:
          type: integer
          description: >-
            How many additional phrases upgrading to Bolo! Plus would unlock for
            this topic. Always 0 for a caller who already has the extended
            library.
        sentenceCount:
          type: integer
          description: >-
            How many full sentences the topic's Plus-only sentence stage holds
            (the final step after the phrase list). 0 when the stage has not
            been generated yet for this language.
        sentencesLocked:
          type: boolean
          description: >-
            Whether the sentence stage is locked for this caller (true for
            everyone without Bolo! Plus). Server-authoritative; clients show
            an upgrade nudge instead of requesting the sentences.
        polishEnabled:
          type: boolean
          description: >-
            Server feature flag: when true, the client should show the Polish
            re-run card on stop completion and Polish re-entry on journey
            station cards. Gated by POLISH_ENABLED env var (default false).
            Optional/additive -- absent clients behave as if false.
      required:
        - id
        - slug
        - title
        - description
        - iconName
        - accent
        - sortOrder
        - titleNative
        - phraseCount
        - masteredCount
        - lockedPhraseCount
        - sentenceCount
        - sentencesLocked

    Phrase:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        hint:
          type: ["string", "null"]
        difficulty:
          type: integer
        sortOrder:
          type: integer
        bestScore:
          type: ["integer", "null"]
        mastered:
          type: boolean
        attemptCount:
          type: integer
        bestBand:
          type: ["string", "null"]
          description: >-
            The best band the learner has achieved on this phrase (derived from
            bestScore). One of "perfect", "great", "good", "almost", "retry".
            Null when the phrase has never been attempted. Optional/additive.
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
      required:
        - id
        - categoryId
        - languageCode
        - nativeScript
        - romanized
        - english
        - hint
        - difficulty
        - sortOrder
        - bestScore
        - mastered
        - attemptCount

    LessonGroupSummary:
      type: object
      properties:
        id:
          type: integer
        position:
          type: integer
        title:
          type: ["string", "null"]
        phraseCount:
          type: integer
        attemptedCount:
          type: integer
        masteredCount:
          type: integer
        status:
          type: string
          enum: [locked, unlocked, in_progress, completed, tested_out]
          description: >-
            Sequential unlock state, derived at read time. A group is completed
            when at least 80% of its phrases reach bestScore >= 80; unlocked
            when it is first or its predecessor is completed/tested_out;
            tested_out when the learner passed the test-out assessment.
            Optional/additive - older clients may ignore it.
        stage:
          type: string
          enum: [phrase, sentence]
          description: >-
            Which learning stage this group's members belong to: the starter
            "phrase" list every topic opens with, or the Plus-only "sentence"
            stage. Derived from the group's member phrases (groups are
            homogeneous by construction); an empty group reads as "phrase".
            Optional/additive - part of the journey-map contract mobile reuses.
        teaserStation:
          type: boolean
          description: >-
            True on the single station that hosts the M1 teaser phrases when
            the caller views a plan-locked language in teaser mode (the
            journey map's visibly marked "free taste" stop). Absent on every
            other group and in every other access state.
        allTopBand:
          type: boolean
          description: >-
            True when every phrase in this group has been attempted and the
            learner's best band is "perfect" or "great" (score >= 80) on all
            of them. Used to show the gold stamp overlay on the journey map
            when POLISH_ENABLED is on. Optional/additive.
        chaiUnlocked:
          type: boolean
          description: >-
            True when the learner has BOUGHT this stop with Chai in a
            plan-locked language. The stop opens exactly like the free-taste
            stop, and because ownership is a ledger row it survives a
            reinstall. Present only in showroom payloads. Optional/additive.
        chaiUnlockable:
          type: boolean
          description: >-
            True when this stop is offered for Chai: inside the language's
            first zone, not the free stop, not already bought, and holding at
            least one phrase the caller's plan can practise. Absent everywhere
            else — a station without it can only be opened by All-Access, and
            the server refuses a purchase attempt on one. Optional/additive.
        planLocked:
          type: boolean
          description: >-
            True when the caller's plan can see ZERO of this group's phrases
            (every member is premium and the caller lacks extended-library
            access), so the station is reported locked with a Plus upsell
            instead of an unlocked stop that would serve an empty practice
            session. For these callers phraseCount/attemptedCount/
            masteredCount count only plan-visible phrases. Absent for
            extended-library callers and in showroom (teaser/exhausted)
            payloads. Optional/additive.

    LessonGroupTestoutSample:
      type: object
      properties:
        phrases:
          type: array
          items:
            $ref: "#/components/schemas/Phrase"
        sampleSize:
          type: integer
        requiredCorrect:
          type: integer

    LessonGroupTestoutInput:
      type: object
      properties:
        attempts:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              phraseId:
                type: integer
              evaluationToken:
                type: string
                minLength: 1
            required: [phraseId, evaluationToken]
      required: [attempts]

    ZoneTestoutInput:
      type: object
      properties:
        languageCode:
          type: string
          minLength: 1
        attempts:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            properties:
              phraseId:
                type: integer
              evaluationToken:
                type: string
                minLength: 1
            required: [phraseId, evaluationToken]
      required: [languageCode, attempts]

    LessonGroupTestoutResult:
      type: object
      properties:
        passed:
          type: boolean
        correctCount:
          type: integer
        requiredCorrect:
          type: integer
        sampleSize:
          type: integer
        status:
          type: string
          enum: [tested_out]

    LessonGroupList:
      type: object
      properties:
        lessonGroups:
          type: array
          items:
            $ref: "#/components/schemas/LessonGroupSummary"
        unassignedCount:
          type: integer
        access:
          type: string
          enum: [teaser, exhausted]
          description: >-
            Present only for a plan-locked language on this one read-only
            route, which deliberately returns the full zone/station structure
            instead of a 402 so the journey map can render as the paywall's
            showroom (counts and statuses only, zero phrase content,
            everything locked except the marked teaser station). "teaser"
            while free taster phrases remain, "exhausted" once used up. A
            plan-locked language with no teaser set still 402s. Absent for an
            allowed language.
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
        stopUnlock:
          $ref: "#/components/schemas/StopUnlockOffer"
        signals:
          $ref: "#/components/schemas/ZoneSignalStates"

    ZoneSignalStates:
      type: object
      description: >-
        Per-signal server truth for this zone's trackside signals, riding the
        existing journey fetch. `waves` and `clears` are bare gap-N
        contextRefs scoped to this category (stored server-side as
        languageCode:categoryId:gap-N). Clears are derived from the
        ledger-backed first-clear grants; a clear supersedes a wave for
        display. `rewardChai` is the single-source first-clear amount the
        server grants (config permits per-line values later) — clients must
        render it, never a hardcoded number.
      properties:
        rewardChai:
          type: integer
        waves:
          type: array
          items:
            type: string
        clears:
          type: array
          items:
            type: string
      required:
        - rewardChai
        - waves
        - clears

    SignalWaveInput:
      type: object
      description: >-
        Identifies the waved signal. The server composes the stored ref as
        languageCode:categoryId:gap-N from these fields.
      properties:
        languageCode:
          type: string
          pattern: "^[a-z]{2,3}$"
        categoryId:
          type: integer
          minimum: 1
        gap:
          type: integer
          minimum: 1
          maximum: 999
          description: Global gap number N — the signal sits after stop N.
      required:
        - languageCode
        - categoryId
        - gap

    SignalWaveResult:
      type: object
      properties:
        ref:
          type: string
          description: The stored ref, languageCode:categoryId:gap-N.
      required:
        - ref

    ReferralSummary:
      type: object
      properties:
        code:
          type: string
          description: The caller's shareable referral code (uppercase, no 0/O/1/I).
        pendingCount:
          type: integer
          description: Redemptions attributed to the caller that have not activated yet.
        activatedCount:
          type: integer
          description: >-
            Redemptions that activated (the referee completed a first session;
            both sides were granted).
        chaiEarned:
          type: integer
          description: >-
            Total referral Chai earned by the caller, derived from the token
            ledger (reason earn_referral_referrer), never a stored counter.
      required:
        - code
        - pendingCount
        - activatedCount
        - chaiEarned

    ReferralRedeemInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: The referral code to redeem. Case-insensitive; normalized server-side.
      required:
        - code

    ReferralRedeemResult:
      type: object
      properties:
        redeemed:
          type: boolean
          description: >-
            True when attribution was recorded. Grants happen at activation
            (the referee's first completed session), not here.
      required:
        - redeemed

    GameSessionInput:
      type: object
      properties:
        languageCode:
          type: string
          minLength: 1
          description: Language code for the phrases practiced (e.g. "gu", "hi").
        game:
          type: string
          enum: [speed-round, phrase-builder, word-match, listen-and-pick]
          description: Identifier for the mini game played.
        categoryId:
          type: integer
          description: The category the phrases were drawn from. Used for server-side phrase validation.
        phraseResults:
          type: array
          description: >-
            One entry per question attempted during the game session. The server
            determines correctness from the submitted answer; clients never
            self-report a correct/incorrect flag.
          maxItems: 120
          items:
            $ref: "#/components/schemas/GamePhraseResult"
        context:
          type: string
          enum: [hub, signal, closeout]
          description: >-
            Optional origin context. "signal" and "closeout" trigger a once-ever
            Chai grant on the first clear. "hub" is accepted but grants nothing.
            Absent behaves identically to today.
        contextRef:
          type: string
          pattern: "^gap-[0-9]+$"
          description: >-
            Required when context is "signal"; forbidden otherwise. Identifies
            the gap that was cleared, forming part of the idempotency key.
      required:
        - languageCode
        - game
        - categoryId
        - phraseResults

    GamePhraseResult:
      type: object
      description: >-
        The learner's submitted answer for one game question. The server
        computes correctness from the answer, depending on game mode.
        For speed-round: selectedPhraseId must equal phraseId to be correct.
        For phrase-builder: submittedText must match the phrase's nativeScript.
      properties:
        phraseId:
          type: integer
          description: The database ID of the question phrase.
        selectedPhraseId:
          type: integer
          nullable: true
          description: >-
            Speed Round — the phraseId of the option the learner tapped.
            Correct when selectedPhraseId === phraseId.
        submittedText:
          type: string
          nullable: true
          description: >-
            Phrase Builder — the assembled word tokens joined by a single space.
            Correct when it matches the phrase's nativeScript exactly.
      required:
        - phraseId

    GameSessionResult:
      type: object
      properties:
        xpEarned:
          type: integer
          description: XP earned in this game session.
        totalXp:
          type: integer
          description: Learner's cumulative XP for this language after the session.
        passed:
          type: boolean
          description: >-
            Server-authoritative session verdict (majority of answered
            questions correct, as judged server-side). This is the flag that
            gates signal and closeout Chai grants; clients must not derive
            their own pass state.
        chaiGranted:
          type: integer
          description: >-
            Chai awarded this call, present only when a signal or closeout grant
            actually landed (first-ever clear). Absent on replays and when
            context is hub or omitted.
      required:
        - xpEarned
        - totalXp
        - passed

    AttemptInput:
      type: object
      properties:
        evaluationToken:
          type: string
          minLength: 1
          description: >-
            Opaque, server-signed token returned by /openai/pronunciation. It
            carries the authoritative language, score, feedback, transcript and
            target phrase, so clients cannot forge or inflate their own progress.
      required:
        - evaluationToken

    Attempt:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        categoryId:
          type: ["integer", "null"]
          description: The category this phrase belongs to; null for attempts with no linked phrase.
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        band:
          type: ["string", "null"]
          enum: ["perfect", "great", "good", "almost", "retry", "nocatch", null]
          description: Five-band pronunciation ladder value for this attempt (legacy stored rows are normalized server-side); null for rows recorded before banding shipped.
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phraseId
        - categoryId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt

    Badge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: ["string", "null"]
          format: date-time
        progressCurrent:
          type: integer
          description: Current value of the metric this badge tracks, capped at the target.
        progressTarget:
          type: integer
          description: The metric value that unlocks this badge.
      required:
        - key
        - title
        - description
        - iconName
        - earned
        - earnedAt
        - progressCurrent
        - progressTarget

    EarnedBadge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earnedAt:
          type: string
          format: date-time
      required:
        - key
        - title
        - description
        - iconName
        - earnedAt

    AttemptResult:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
        newlyEarnedBadges:
          type: array
          items:
            $ref: "#/components/schemas/EarnedBadge"
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
        chaiEarned:
          type: integer
          description: >-
            Chai granted synchronously within this attempt request (today:
            the streak-day earn). Omitted when zero. The Session Complete
            receipt sums these server-authoritative amounts.
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt
        - newlyEarnedBadges

    ProgressSummary:
      type: object
      properties:
        totalAttempts:
          type: integer
        phrasesPracticed:
          type: integer
        phrasesMastered:
          type: integer
        totalPhrases:
          type: integer
        averageScore:
          type: integer
        bestScore:
          type: integer
        currentStreakDays:
          type: integer
        speakingStreakDays:
          type: integer
          description: >-
            Spec D2 speaking streak: consecutive calendar days (learner's IANA
            timezone) each containing at least one attempt in a passing band
            (perfect, great, good, or almost). Optional for installed-client
            back-compat; derived at query time, never stored.
        attemptsToday:
          type: integer
        xp:
          type: integer
        todayXp:
          type: integer
        dailyGoal:
          type: integer
      required:
        - totalAttempts
        - phrasesPracticed
        - phrasesMastered
        - totalPhrases
        - averageScore
        - bestScore
        - currentStreakDays
        - attemptsToday
        - xp
        - todayXp
        - dailyGoal

    VoiceCatalogEntry:
      type: object
      description: A single curated ElevenLabs premade voice learners can select.
      properties:
        id:
          type: string
          description: ElevenLabs voice ID.
        name:
          type: string
          description: Human-readable voice name.
        gender:
          type: string
          enum: [male, female]
        description:
          type: string
          description: One-line character description shown in the picker.
      required:
        - id
        - name
        - gender
        - description

    VoiceListResult:
      type: object
      properties:
        voices:
          type: array
          items:
            $ref: "#/components/schemas/VoiceCatalogEntry"
        current:
          type: string
          nullable: true
          description: The caller's saved ttsVoice preference, or null for Auto.
      required:
        - voices
        - current

    SpeechInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        voice:
          type: string
        languageName:
          type: string
        languageCode:
          type: string
          description: >
            ISO-639-1 code of the language being synthesized (e.g. "gu", "hi",
            "ta"). When provided the server selects a voice that sounds more
            authentic for that language family instead of always defaulting to
            the English voice.
        previewVoiceId:
          type: string
          description: >
            When present and a valid VOICE_CATALOG ID, bypasses the user's
            saved preference and the language-voice mapping and synthesizes
            using this specific ElevenLabs voice. Intended for voice-picker
            preview only.
      required:
        - text

    SpeechResult:
      type: object
      properties:
        audioBase64:
          type: string
        format:
          type: string
      required:
        - audioBase64
        - format

    PronunciationInput:
      type: object
      properties:
        phraseId:
          type: ["integer", "null"]
          description: >-
            Optional id of the catalog phrase being practiced. When supplied the
            server uses the phrase's stored text as the authoritative target.
        targetNative:
          type: string
          minLength: 1
        targetRomanized:
          type: string
        targetEnglish:
          type: string
        languageName:
          type: string
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
        latencyMs:
          type: integer
          nullable: true
          description: >-
            Client-measured milliseconds between the phrase finishing and the
            learner tapping Record. When present and < 250 ms the server
            rejects the attempt as a tap-spam guard.
        captureLabel:
          type: string
          enum: [native, american_accent, subtle_error, wrong_attempt]
          description: >-
            TEMPORARY (pilot capture mode): the capture protocol label for
            this attempt. Recorded in the R2 tee sidecar for allowlisted
            capture users; ignored for everyone else. Remove with capture
            mode once the calibration corpus is complete.
        captureAttemptOfFour:
          type: integer
          minimum: 1
          maximum: 4
          description: >-
            TEMPORARY (pilot capture mode): which of the four protocol
            attempts this is (1-4). Recorded in the sidecar alongside
            captureLabel.
      required:
        - targetNative
        - targetRomanized
        - targetEnglish
        - audioBase64

    PilotCaptureEligibility:
      type: object
      properties:
        eligible:
          type: boolean
          description: True when the caller is in the pilot capture allowlist.
      required: [eligible]

    PilotCaptureDiscardResult:
      type: object
      properties:
        discarded:
          type: boolean
          description: >-
            True when the caller's most recent capture-mode clip was marked
            discarded in its sidecar; false when there was nothing to discard.
      required: [discarded]

    PronunciationResult:
      type: object
      properties:
        transcript:
          type: string
        transcriptRomanized:
          type: string
          description: >-
            Display-only romanization of `transcript` (deterministic
            transliteration, card-style ASCII, e.g. "kem cho"). A transcript
            that is already Latin passes through unchanged. Empty ("") when
            the script has no clean romanization (Perso-Arabic, Ol Chiki,
            Meetei Mayek) or on nocatch/empty-transcript outcomes. Clients
            hide the romanized line when this is empty. Optional for
            older-client compatibility; never stored or used in scoring.
        score:
          type: integer
          description: >-
            Deprecated — will be removed in a future release once all client
            builds have updated. Use `band` instead. Omitted when the server
            stops sending it; clients must treat this field as optional.
        band:
          type: string
          enum: [nocatch, perfect, great, good, almost, retry]
          description: >-
            Five-band pronunciation ladder value, top to bottom: `perfect` and
            `great` earn full XP, `good` and `almost` earn half XP, `retry` is
            below the passing threshold (no XP). `nocatch` = no usable audio
            detected (no XP); it is a separate system outcome, not a rung on
            the ladder.
        xpAwarded:
          type: integer
          description: XP earned for this attempt. Display only — the signed token is authoritative.
        xpBreakdown:
          type: string
          nullable: true
          description: Human-readable explanation of the XP awarded, e.g. "Full XP".
        passed:
          type: boolean
        feedback:
          type: string
        tip:
          type: string
        evaluationToken:
          type: string
          description: >-
            Server-signed token capturing this evaluation. Pass it to /attempts
            to record the attempt with the authoritative score and feedback.
      required:
        - transcript
        - passed
        - feedback
        - tip
        - evaluationToken
        - band
        - xpAwarded

    PhraseRequest:
      type: object
      properties:
        languageName:
          type: string
        categoryTitle:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
      required: []

    GeneratedPhrase:
      type: object
      properties:
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
      required:
        - nativeScript
        - romanized
        - english

    ChatTurnMessage:
      type: object
      description: A single prior turn in the rolling conversation-context window.
      properties:
        role:
          type: string
          description: learner | parrot
        text:
          type: string
      required:
        - role
        - text

    ChatTurnInput:
      type: object
      properties:
        languageCode:
          type: string
          description: The language the learner is chatting in (e.g. "hi", "gu").
        audioBase64:
          type: string
          minLength: 1
          description: >-
            The learner's recorded speech for this turn. Required when
            textInput is not provided.
        textInput:
          type: string
          minLength: 1
          description: >-
            Pre-supplied text for text-input turns. When set the STT step is
            skipped, the value is used directly as the transcript, and no
            chat-time seconds are charged. Required when audioBase64 is not
            provided.
        history:
          type: array
          description: >-
            A short recent-turn window (client-supplied; not persisted
            server-side) so replies stay contextual.
          items:
            $ref: "#/components/schemas/ChatTurnMessage"
        clientDurationSeconds:
          type: number
          nullable: true
          description: >-
            Client-measured duration (in seconds) of the recorded audio clip.
            When present the server uses this value to debit the caller's weekly
            chat-time allowance instead of inferring it from audio length.
            Optional; omitted by older clients.
        mimeType:
          type: string
          description: >-
            MIME type of the audio payload (e.g. "audio/m4a"). Optional; omitted
            by older clients that always send m4a.
        scenarioId:
          type: string
          description: >-
            Optional zone capstone scenario identifier (e.g. "greetings-manners").
            When supplied the server injects the scenario framing and steering
            instructions into the prompt, gates zone 2+ on Plus, tracks phrase
            usage, and writes a zone_conversation_stamp on majority completion.
      required:
        - languageCode

    ChatTurnResult:
      type: object
      properties:
        transcript:
          type: string
          description: What the server heard the learner say.
        transcriptEnglish:
          type: string
          description: >-
            Concise English translation of what the learner said. Empty string
            when the learner spoke in English or their speech was unclear.
        replyText:
          type: string
          description: Bolo's in-character reply, in the target language.
        replyEnglish:
          type: string
          description: English translation of Bolo's reply, shown as a bilingual caption.
        replyAudioBase64:
          type: string
          description: Ready-to-play synthesized speech of the reply.
        format:
          type: string
        languageCode:
          type: string
        secondsRemaining:
          type: ["integer", "null"]
          description: >-
            Seconds of weekly chat time left for the caller; null means
            unlimited (One Language and Plus).
        phrasesUsed:
          type: array
          items:
            type: string
          description: >-
            Romanized target phrases from the scenario's target list that the
            server detected in the learner's transcript this turn (case-insensitive
            substring match). Only present when a scenarioId was supplied.
        sceneDone:
          type: boolean
          description: >-
            True when the majority of the scenario's target phrases have been
            used across the session, signalling that the capstone is complete.
            Only present when a scenarioId was supplied.
        xpAwarded:
          type: integer
          description: >-
            XP awarded on this turn (non-zero only on the first sceneDone=true
            turn; 0 on replays). Only present when a scenarioId was supplied.
        tokensEarned:
          type: integer
          description: >-
            Chai tokens earned this turn (always 0 in build 32; the token
            engine stub will be wired when tokenEngine.ts lands).
            Only present when a scenarioId was supplied.
      required:
        - transcript
        - transcriptEnglish
        - replyText
        - replyEnglish
        - replyAudioBase64
        - format
        - languageCode
        - secondsRemaining

    ScenarioPublic:
      type: object
      description: >-
        Client-safe subset of a zone capstone scenario. Steering instructions
        are never sent to the client.
      properties:
        id:
          type: string
        zoneIndex:
          type: integer
          description: 0-based zone index.
        title:
          type: string
          description: Short scene title shown in the chat banner.
        framingCopy:
          type: string
          description: One-sentence scene setter shown below the title.
        targetPhrases:
          type: array
          items:
            type: object
            properties:
              romanized:
                type: string
              native:
                type: string
            required: [romanized, native]
          description: Phrases to use as chip targets in the chat UI.
      required:
        - id
        - zoneIndex
        - title
        - framingCopy
        - targetPhrases

    ZoneStamp:
      type: object
      description: Record that a learner completed a zone capstone conversation.
      properties:
        zoneIndex:
          type: integer
          description: 0-based zone index.
        languageCode:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - zoneIndex
        - languageCode
        - createdAt

    AddPhrasesInput:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How many new phrases to generate and append.
      required: []

    UpgradeRequired:
      type: object
      description: >-
        Returned with HTTP 402 when a Free action needs Bolo! Plus (a locked
        language, the daily new-lesson cap, or a Plus-only feature). A single
        shape across every gate so clients render the paywall uniformly.
      properties:
        error:
          type: string
          description: Always "upgrade_required".
        upgradeRequired:
          type: boolean
          description: Always true.
        reason:
          type: string
          description: >-
            language_locked | feature_locked | chat_time_limit |
            teaser_exhausted (the caller used up their free teaser phrases in
            this locked language) | phrase_ceiling (the topic holds as many
            phrases as this plan allows; only All-Access lifts it).
            daily_lesson_limit is retired and no longer sent.
        message:
          type: string
        feature:
          type: string
          nullable: true
          description: The related feature flag, when applicable (e.g. "allLanguages").
        requiredPlan:
          type: string
          description: >-
            The cheapest plan that unlocks the action ("one_language" or
            "plus").
        teaser:
          $ref: "#/components/schemas/TeaserProgress"
      required:
        - error
        - upgradeRequired
        - reason
        - message
        - feature
        - requiredPlan

    AppendRefused:
      type: object
      description: >-
        A refused "Add more phrases" tap that no upgrade would fix. Clients must
        branch on `reason`, never on the message text.
      properties:
        error:
          type: string
          description: Learner-facing explanation, safe to show as-is.
        reason:
          type: string
          description: >-
            append_in_progress (an append for this topic is already running) |
            topic_full (top tier, topic at its ceiling, no upgrade exists) |
            append_rate_limited (hourly per-learner burst bound reached).
        retryAfterSeconds:
          type: integer
          description: >-
            Seconds until the learner may append again. Only sent with
            append_rate_limited.
      required:
        - error
        - reason

    TeaserProgress:
      type: object
      description: >-
        M1 language teaser progress for a locked language: how many of the
        free teaser phrases (the first phrases of Greetings group 1) this
        user has attempted, lifetime. Present on locked-language 402 bodies,
        on teaser-state phrase rows, and on attempt results recorded through
        the teaser.
      properties:
        consumed:
          type: integer
          description: Distinct teaser phrases attempted so far.
        limit:
          type: integer
          description: Total teaser phrases available (currently 3).
      required:
        - consumed
        - limit

    PlanFeatures:
      type: object
      properties:
        allLanguages:
          type: boolean
        unlimitedLessons:
          type: boolean
        review:
          type: boolean
        advancedAnalytics:
          type: boolean
        extendedLibrary:
          type: boolean
          description: >-
            Whether the caller can access the deep, pre-seeded premium phrase
            library beyond each topic's free starter set. Plus only.
        unlimitedChatTime:
          type: boolean
          description: >-
            Whether the caller has no weekly ceiling on Bolo Parrot
            conversational chat time. Free is capped at 2 minutes/week; One
            Language and Plus are unlimited.
        phraseBuilder:
          type: boolean
          description: Whether the caller can access the Phrase Builder game. Plus only.
        speedRound:
          type: boolean
          description: Whether the caller can access the Speed Round game. Plus only.
      required:
        - allLanguages
        - unlimitedLessons
        - review
        - advancedAnalytics
        - extendedLibrary
        - unlimitedChatTime
        - phraseBuilder
        - speedRound

    DailyLessonAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Daily new-lesson ceiling; null means unlimited (Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining today; null means unlimited (Plus).
      required:
        - limit
        - used
        - remaining

    WeeklyChatAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: >-
            Weekly Bolo Parrot chat-time ceiling in seconds; null means
            unlimited (One Language and Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining this week; null means unlimited.
      required:
        - limit
        - used
        - remaining

    EntitlementLimits:
      type: object
      properties:
        dailyNewLessons:
          $ref: "#/components/schemas/DailyLessonAllowance"
        weeklyChatSeconds:
          $ref: "#/components/schemas/WeeklyChatAllowance"
      required:
        - dailyNewLessons
        - weeklyChatSeconds

    Entitlements:
      type: object
      properties:
        plan:
          type: string
          description: The effective plan ("free", "one_language", or "plus").
        status:
          type: string
          description: none | trialing | active | expired | canceled
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        chosenLanguage:
          type: string
          nullable: true
          description: >-
            The single language a One Language ($6.99) subscriber unlocked on
            top of free Hindi. Null for Free and all-access Plus.
        allowedLanguages:
          type: array
          items:
            type: string
          description: The concrete language codes the caller may access.
        features:
          $ref: "#/components/schemas/PlanFeatures"
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
      required:
        - plan
        - status
        - trialEndsAt
        - currentPeriodEnd
        - chosenLanguage
        - allowedLanguages
        - features
        - limits

    CategoryAnalytics:
      type: object
      properties:
        categoryId:
          type: integer
        title:
          type: string
        phraseCount:
          type: integer
        practicedCount:
          type: integer
        masteredCount:
          type: integer
        averageScore:
          type: integer
      required:
        - categoryId
        - title
        - phraseCount
        - practicedCount
        - masteredCount
        - averageScore

    DailyActivity:
      type: object
      properties:
        date:
          type: string
          description: UTC day (YYYY-MM-DD).
        attempts:
          type: integer
        averageScore:
          type: integer
      required:
        - date
        - attempts
        - averageScore

    ProgressAnalytics:
      type: object
      properties:
        languageCode:
          type: string
        totalXp:
          type: integer
        reviewDueCount:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAnalytics"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyActivity"
      required:
        - languageCode
        - totalXp
        - reviewDueCount
        - categories
        - daily

    SendFriendInviteInput:
      type: object
      properties:
        email:
          type: string
          description: The email address to invite. Must not belong to an existing learner.
      required:
        - email

    FriendInviteResult:
      type: object
      description: Confirmation that a referral invite was sent.
      properties:
        sent:
          type: boolean
          description: Always true when the invite email was dispatched.
        sendCount:
          type: integer
          description: How many times this (caller, email) pair has been invited in total.
      required:
        - sent
        - sendCount

    UserSummary:
      type: object
      description: A learner's public identity for friends features.
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - id
        - displayName
        - email

    SendFriendRequestInput:
      type: object
      properties:
        email:
          type: string
          description: The exact email of the learner to send a request to.
      required:
        - email

    FriendRequest:
      type: object
      description: A pending friend request plus the other learner's identity.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "pending" for a request.
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - createdAt
        - user

    AcceptedFriendship:
      type: object
      description: The result of accepting a request — a now-mutual friendship.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "accepted".
        friend:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - friend

    Friend:
      type: object
      description: An accepted friend in the caller's friends list.
      properties:
        friendshipId:
          type: integer
        since:
          type: string
          format: date-time
          nullable: true
          description: When the friendship was accepted.
        id:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - friendshipId
        - id
        - displayName
        - email

    ScriptTraceCharacterProgress:
      type: object
      description: A learner's tracing progress for a single character in a Script Trace chapter.
      properties:
        characterId:
          type: string
          description: The character's stable identifier within the chapter (e.g. "gu_a").
        passed:
          type: boolean
          description: Whether the learner has ever achieved a passing score (≥70%) for this character.
        bestScore:
          type: integer
          nullable: true
          description: Highest accuracy score (0–100) achieved across all traces. Null until the first trace.
        attemptCount:
          type: integer
          description: Total number of traces submitted for this character.
        updatedAt:
          type: string
          format: date-time
          description: When this progress row was last updated.
      required:
        - characterId
        - passed
        - bestScore
        - attemptCount
        - updatedAt

    ScriptTraceProgressInput:
      type: object
      description: The result of a single character trace attempt.
      properties:
        chapter:
          type: string
          enum:
            - gujarati-vowels
            - gujarati-consonants
            - hindi-vowels
            - hindi-consonants
        characterId:
          type: string
          minLength: 1
          maxLength: 30
        passed:
          type: boolean
        score:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - chapter
        - characterId
        - passed
        - score

    ContactFormInput:
      type: object
      description: A support message submitted via the Contact Us form.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          description: The submitter's email address (validated as a valid email format).
        category:
          type: string
          enum: [general, billing, technical, feedback, other]
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - name
        - email
        - category
        - message

    ContactFormResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    PhraseReportInput:
      type: object
      properties:
        reason:
          type: string
          enum: [translation_wrong, transliteration_wrong, audio_wrong, other]
        note:
          type: string
          maxLength: 280
          description: Optional free-text note, never required.
      required:
        - reason

    PhraseReportResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    McqTranslationQuestion:
      type: object
      description: See native script, pick correct English gloss from 4 choices.
      properties:
        type:
          type: string
          enum: [mcq_translation]
        phraseId:
          type: integer
        nativeScript:
          type: string
        romanized:
          type: string
        correctEnglish:
          type: string
        distractors:
          type: array
          items:
            type: string
          description: 3 wrong English glosses
      required:
        - type
        - phraseId
        - nativeScript
        - romanized
        - correctEnglish
        - distractors

    ListenIdentifyQuestion:
      type: object
      description: Hear audio for a phrase, pick the correct native-script card.
      properties:
        type:
          type: string
          enum: [listen_identify]
        phraseId:
          type: integer
        correctNativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        distractors:
          type: array
          items:
            type: string
          description: 3 wrong native-script strings
        distractorRomanizations:
          type: array
          items:
            type: string
          description: Romanized pronunciations matching each distractor (same order).
      required:
        - type
        - phraseId
        - correctNativeScript
        - romanized
        - english
        - distractors

    OrderWordsQuestion:
      type: object
      description: Arrange shuffled word/token tiles into the correct phrase.
      properties:
        type:
          type: string
          enum: [order_words]
        phraseId:
          type: integer
        nativeScript:
          type: string
          description: The correct answer (space-separated words)
        romanized:
          type: string
        english:
          type: string
        tiles:
          type: array
          items:
            type: string
          description: Shuffled word tiles to arrange
        tileRomanizations:
          type: array
          items:
            type: string
          description: >
            Romanized subtitle for each tile, parallel to `tiles`. Empty-string
            entries mean the tile's script has no clean romanization and
            clients render no subtitle. Absent on quizzes stored before the
            field shipped.
      required:
        - type
        - phraseId
        - nativeScript
        - romanized
        - english
        - tiles

    QuizQuestion:
      oneOf:
        - $ref: "#/components/schemas/McqTranslationQuestion"
        - $ref: "#/components/schemas/ListenIdentifyQuestion"
        - $ref: "#/components/schemas/OrderWordsQuestion"
      discriminator:
        propertyName: type

    DailyQuizResponse:
      type: object
      description: Today's quiz state for a learner.
      properties:
        quizDate:
          type: string
          description: ISO date string for today (UTC), e.g. "2026-07-18"
        completed:
          type: boolean
          description: Whether the learner has already submitted today's quiz
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
          description: The 5 quiz questions
        score:
          type: integer
          nullable: true
          description: Learner's score (0-5), only present when completed=true
        total:
          type: integer
          nullable: true
          description: Total questions (always 5), only present when completed=true
        xpAwarded:
          type: integer
          nullable: true
          description: XP awarded, only present when completed=true
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the learner completed the quiz
        quizStreak:
          type: integer
          nullable: true
          description: >-
            Number of consecutive days (ending today or yesterday) the learner
            has completed the daily quiz. null when the streak is unknown or zero.
      required:
        - quizDate
        - completed
        - questions

    CompleteDailyQuizInput:
      type: object
      properties:
        lang:
          type: string
          description: Language code (e.g. "gu")
        answers:
          type: array
          items:
            type: string
            nullable: true
          description: >-
            Array of 5 selected answers (one per question). For mcq_translation
            supply the chosen English string; for listen_identify supply the
            chosen nativeScript string; for order_words supply the tiles joined
            by spaces. null means the question was skipped or unanswered.
          minItems: 5
          maxItems: 5
      required:
        - lang
        - answers

    DailyQuizResult:
      type: object
      properties:
        score:
          type: integer
          description: Number of correct answers (0-5)
        total:
          type: integer
          description: Total questions (always 5)
        xpAwarded:
          type: integer
          description: XP awarded for this attempt
        perfect:
          type: boolean
          description: Whether the learner scored 5/5
        quizStreak:
          type: integer
          description: >-
            Number of consecutive days (including today) the learner has
            completed the daily quiz for this language.
      required:
        - score
        - total
        - xpAwarded
        - perfect
        - quizStreak

    TokenState:
      type: object
      required: [balance, stationPausesEquipped]
      properties:
        balance: { type: integer }
        stationPausesEquipped: { type: integer }
        expressMultiplierActiveUntil:
          type: string
          format: date-time
          nullable: true
        equippedOutfit:
          type: string
          nullable: true
          description: >-
            The garment id Bolo is wearing, or null for canonical undressed
            Bolo. Every mascot surface resolves its art from this value, so
            clients read it here rather than holding their own copy.
        equippedAccessory:
          type: string
          nullable: true
          description: >-
            The accessory id Bolo is wearing, or null for none. A separate slot
            from equippedOutfit because she wears both at once: clients stack
            the accessory's overlay art on top of whichever base the garment
            selects.
    OutfitCatalogItem:
      type: object
      required: [id, name, tagline, cost, owned, kind, preview]
      properties:
        id: { type: string }
        name: { type: string }
        tagline: { type: string }
        cost:
          type: integer
          description: >-
            Server-authoritative price in Chai, per item rather than one flat
            price. Clients must render this number, never a hardcoded one.
        owned:
          type: boolean
          description: Bought once, owned forever — derived from the ledger.
        kind:
          type: string
          enum: [garment, accessory]
          description: >-
            A garment redresses the whole bird; an accessory adds one thing to
            her. The shop groups its rack by this, so a new kind of stock does
            not need a client change.
        preview:
          type: string
          enum: [full, head]
          description: >-
            How to crop this item's thumbnail. A hat is unreadable in a
            full-body crop, so accessories ask for the head.
    OutfitCatalog:
      type: object
      required: [balance, equipped, outfits]
      properties:
        balance: { type: integer }
        equipped:
          type: string
          nullable: true
          description: The garment slot — see TokenState.equippedOutfit.
        equippedAccessory:
          type: string
          nullable: true
          description: The accessory slot, worn at the same time as the garment.
        outfits:
          type: array
          items:
            $ref: "#/components/schemas/OutfitCatalogItem"
    BuyOutfitInput:
      type: object
      required: [outfitId]
      properties:
        outfitId:
          type: string
          description: >-
            Catalog id. The price and the ledger refId (outfit:<id>) are both
            composed server-side, so no client-supplied idempotency key is
            accepted here.
    OutfitPurchaseResult:
      type: object
      required: [balance, outfitId, owned, charged, cost, equipped]
      properties:
        balance: { type: integer }
        outfitId: { type: string }
        owned: { type: boolean }
        charged:
          type: boolean
          description: >-
            False when the learner already owned this outfit — the call is a
            no-op that deducts nothing and leaves the equipped choice alone.
        cost: { type: integer }
        equipped:
          type: string
          nullable: true
        equippedAccessory:
          type: string
          nullable: true
    EquipOutfitInput:
      type: object
      required: [outfitId]
      properties:
        outfitId:
          type: string
          nullable: true
          description: >-
            An owned item id, or null to take something off. The slot an item
            occupies is read from the catalog server-side, so equipping a hat
            never disturbs the garment she is wearing.
        slot:
          type: string
          enum: [garment, accessory]
          description: >-
            Only consulted when outfitId is null, where there is no item to
            read the slot from: it says WHICH slot to clear. Omitting it with a
            null outfitId takes everything off.
    OutfitEquipResult:
      type: object
      required: [equipped]
      properties:
        equipped:
          type: string
          nullable: true
        equippedAccessory:
          type: string
          nullable: true
    TokensSpendInput:
      type: object
      required: [item]
      properties:
        item:
          type: string
          enum: [station_pause, express_multiplier]
        refId:
          type: string
          description: optional client idempotency key
    UnlockStopInput:
      type: object
      required: [lessonGroupId]
      properties:
        lessonGroupId:
          type: integer
          description: >-
            The station to open. The server resolves its language from the row
            itself and mints the ledger refId as stop:<language>:<groupId>, so
            no client-supplied idempotency key is accepted here.
    StopUnlockResult:
      type: object
      required: [balance, lessonGroupId, languageCode, unlocked, charged, cost]
      properties:
        balance: { type: integer }
        lessonGroupId: { type: integer }
        languageCode: { type: string }
        unlocked: { type: boolean }
        charged:
          type: boolean
          description: >-
            False when the learner already owned this stop — the call is a
            no-op that deducts nothing. Clients must not re-render a "spent"
            animation for it.
        cost: { type: integer }
    StreakRepairOffer:
      type: object
      required: [eligible, missedDay, restoresStreakDays, cost, balance]
      description: >-
        Whether the learner has a streak break worth mending, and what mending
        it would cost. `eligible` false means there is nothing to offer — no
        break, an absence too long to be a slip, or a break older than the
        repair window — and clients must show nothing at all in that case.
      properties:
        eligible: { type: boolean }
        missedDay:
          type: string
          nullable: true
          description: The YYYY-MM-DD local day that broke the streak.
        restoresStreakDays:
          type: integer
          description: >-
            The streak the learner would have again once the day is covered,
            measured on the same ladder the progress summary climbs.
        cost: { type: integer }
        balance: { type: integer }
    StreakRepairResult:
      type: object
      required: [balance, repairedDay, restoredStreakDays, charged, cost]
      properties:
        balance: { type: integer }
        repairedDay: { type: string }
        restoredStreakDays: { type: integer }
        charged:
          type: boolean
          description: >-
            False when this day was already repaired — the call is a no-op that
            deducts nothing.
        cost: { type: integer }
    StopUnlockOffer:
      type: object
      description: >-
        The served price of a Chai stop unlock. Present on a showroom journey
        payload only for the first zone, the only zone whose stops are
        purchasable. Clients must render this number, never a hardcoded one.
      properties:
        cost:
          type: integer
    TokenSpendResult:
      type: object
      required: [balance, granted, stationPausesEquipped]
      properties:
        balance: { type: integer }
        granted: { type: string }
        stationPausesEquipped: { type: integer }
        expressMultiplierActiveUntil:
          type: string
          format: date-time
          nullable: true

    LeaderboardEntry:
      type: object
      description: One learner's standing on the friends leaderboard.
      properties:
        userId:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        xp:
          type: integer
          description: Total XP summed across every language.
        rank:
          type: integer
          description: 1-based rank, highest XP first.
        isSelf:
          type: boolean
          description: True for the caller's own entry.
      required:
        - userId
        - displayName
        - email
        - xp
        - rank
        - isSelf

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Languages, categories, phrases, attempts and progress
  - name: openai
    description: OpenAI AI audio and content operations
  - name: friends
    description: Friends, friend requests, and the friends leaderboard
  - name: account
    description: Profile, notification and learning preferences, and account deletion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /languages:
    get:
      operationId: listLanguages
      tags: [learning]
      summary: List all supported learning languages
      responses:
        "200":
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /categories:
    get:
      operationId: listCategories
      tags: [learning]
      summary: List all lesson categories with progress for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /categories/{id}/sentences/{lang}:
    get:
      operationId: listCategorySentences
      tags: [learning]
      summary: List the topic's Plus-only sentence stage for a language
      description: >-
        The topic's final step after the phrase list — full, natural sentences
        that build on the topic's vocabulary. Bolo! Plus only: callers without
        the sentences feature receive a 402 upgrade payload and no sentence
        text. Generated + cached on first request for dynamically generated
        lessons.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sentences (same shape as phrases)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only feature or language)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/phrases/{lang}:
    get:
      operationId: listCategoryPhrases
      tags: [learning]
      summary: List phrases in a category for a language (generated + cached on first request)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language or Free daily lesson cap reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addCategoryPhrases
      tags: [learning]
      summary: Generate and append fresh AI phrases to a category's lesson
      description: >-
        Generates additional beginner phrases in the language's native script,
        avoiding phrases already in the lesson, and appends them to the existing
        lesson so they persist and count toward progress.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPhrasesInput"
      responses:
        "200":
          description: The newly added phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language or Free daily lesson cap reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review/phrases:
    get:
      operationId: listReviewPhrases
      tags: [learning]
      summary: The learner's not-yet-mastered phrases for a language, spaced-repetition ordered (due first)
      description: >-
        Returns the phrases the learner has practiced but not yet mastered
        (best attempt score below the mastery threshold) for the given
        language, ordered by a spaced-repetition schedule so phrases that are
        due (or overdue) to be reviewed surface first, with the weakest best
        score breaking ties. Each phrase climbs a Leitner-style spacing ladder
        on passing attempts (widening the gap before it resurfaces) and resets
        on a miss. Returns an empty array when there is nothing to review.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weak phrases to review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (review sessions are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /phrases/{id}:
    get:
      operationId: getPhrase
      tags: [learning]
      summary: Get a single phrase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attempts:
    post:
      operationId: createAttempt
      tags: [learning]
      summary: Record a pronunciation practice attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "201":
          description: Created attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"

  /attempts/recent:
    get:
      operationId: listRecentAttempts
      tags: [learning]
      summary: Recent practice attempts feed for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attempt"

  /badges:
    get:
      operationId: listBadges
      tags: [learning]
      summary: Badge catalog annotated with earned/locked status for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of badges with earned status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [learning]
      summary: Overall learning progress summary for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/analytics:
    get:
      operationId: getProgressAnalytics
      tags: [learning]
      summary: Advanced progress analytics for a language (Bolo! Plus only)
      description: >-
        A deeper progress breakdown than the basic summary: per-category
        mastery, a recent daily-activity trend, and how many phrases are due for
        review. Advanced analytics are a Bolo! Plus feature.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Advanced analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressAnalytics"
        "402":
          description: Upgrade required (advanced analytics are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /entitlements:
    get:
      operationId: getEntitlements
      tags: [entitlements]
      summary: The caller's plan, unlocked features, and daily limits
      description: >-
        Returns the authenticated user's effective plan (Free vs Bolo! Plus),
        subscription status, the languages they may access, the feature flags
        they have unlocked, and today's remaining daily new-lesson allowance.
        Clients call this to know what is unlocked and how to render the paywall.
      responses:
        "200":
          description: The caller's entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"

  /entitlements/chosen-language:
    post:
      operationId: setChosenLanguage
      tags: [entitlements]
      summary: Record the One Language tier's chosen language
      description: >-
        Records the single language a One Language ($6.99) subscriber unlocks on
        top of free Hindi, captured at purchase. Once set while on the middle
        tier the choice is locked: changing it returns 409, and only upgrading
        to all-access frees it. Choosing Hindi or an unknown language is
        rejected. Returns the fresh entitlements snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetChosenLanguageInput"
      responses:
        "200":
          description: The caller's updated entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "400":
          description: Missing or invalid language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Language not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The chosen language is locked for this subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: The caller's profile, preferences, and subscription summary
      description: >-
        Returns the authenticated learner's profile (name, email, avatar), their
        notification and learning preferences, and a compact subscription
        summary — everything the account settings screen renders from.
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the caller's account and all their data
      description: >-
        Permanently deletes the learner's Clerk identity and every local record
        (attempts, progress, friendships, subscription state). Idempotent and
        irreversible; the client signs the user out afterwards.
      responses:
        "200":
          description: The account was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResult"

  /account/profile:
    patch:
      operationId: updateAccountProfile
      tags: [account]
      summary: Update the caller's display name and/or avatar
      description: >-
        Updates the display name (mirrored to Clerk, the identity source of
        truth) and/or the avatar reference. Only the fields present in the body
        are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResult"
        "400":
          description: Nothing to update or an invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The identity service could not apply the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/preferences:
    patch:
      operationId: updateAccountPreferences
      tags: [account]
      summary: Update notification and/or learning preferences
      description: >-
        Updates any subset of the notification (daily reminder toggle + time)
        and learning (active language, daily goal, theme) preferences. Only the
        provided fields change; each is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesInput"
      responses:
        "200":
          description: The updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPreferencesResult"
        "400":
          description: An invalid preference value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The chosen language does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription:
    get:
      operationId: getAccountSubscription
      tags: [account]
      summary: The caller's full subscription-management snapshot
      description: >-
        Returns the tier/status, relevant dates, chosen language, a best-effort
        payment-method summary, and billing/invoice history. Softer fields
        (payment method, history) are pulled from the provider where available
        and degrade to null/empty when it isn't configured or doesn't expose
        them.
      responses:
        "200":
          description: The subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/cancel:
    post:
      operationId: cancelAccountSubscription
      tags: [account]
      summary: Cancel the caller's subscription at the period boundary
      description: >-
        Marks the subscription canceled. Paid access continues until the current
        period ends (the plan stays live until currentPeriodEnd lapses).
        Canceling also clears any active pause.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No active subscription to cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/pause:
    post:
      operationId: pauseAccountSubscription
      tags: [account]
      summary: Pause the caller's subscription for a bounded window
      description: >-
        Pauses the subscription for 1–3 months. While paused the provider
        suspends paid access but does not expire the subscription; it resumes
        automatically when the window closes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseSubscriptionInput"
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No active subscription to pause or an invalid month count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The subscription is already paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/resume:
    post:
      operationId: resumeAccountSubscription
      tags: [account]
      summary: Resume a canceling subscription (undo a pending cancel)
      description: >-
        Clears a pending cancellation, returning the subscription status from
        canceled to active. No discount is applied, the retention offer is not
        consumed, and the current period end is unchanged. Idempotent for an
        already-active paid subscription and repeatable any number of times.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No paid subscription to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The subscription is paused, not canceling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/unpause:
    post:
      operationId: unpauseAccountSubscription
      tags: [account]
      summary: Resume a paused subscription early
      description: >-
        Lets a learner who changes their mind come back before the pause
        window closes. Clears the pause and resumes the underlying paid tier
        immediately — the same outcome as waiting for pauseUntil to elapse
        naturally, just early. Only applies to a currently-paused
        subscription; a canceling, active, or expired subscription has
        nothing to unpause.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: The subscription is not paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/subscription/retention:
    post:
      operationId: acceptRetentionOffer
      tags: [account]
      summary: Accept the one-time discounted 3-month retention offer
      description: >-
        Redeems the discounted 3-month retention offer. Resumes/keeps the paid
        tier (clearing any pending cancel or pause), extends the current period
        by three months, and records that the offer was accepted so it can only
        be redeemed once.
      responses:
        "200":
          description: The updated subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetails"
        "400":
          description: No subscription eligible for the retention offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The retention offer was already redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/search:
    get:
      operationId: searchFriendByEmail
      tags: [friends]
      summary: Find a learner by their exact email
      description: >-
        Looks up a single learner by their exact email address so the caller can
        send them a friend request. The caller is never returned. Available to
        all authenticated learners.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The matching learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No learner found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests:
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request to a learner by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestInput"
      responses:
        "201":
          description: The created pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          description: Missing email or an attempt to friend yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No learner found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request or friendship already exists between the two learners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/incoming:
    get:
      operationId: listIncomingFriendRequests
      tags: [friends]
      summary: Pending friend requests awaiting the caller's response
      responses:
        "200":
          description: Incoming pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/outgoing:
    get:
      operationId: listOutgoingFriendRequests
      tags: [friends]
      summary: The caller's pending friend requests still awaiting the other learner
      responses:
        "200":
          description: Outgoing pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The now-accepted friendship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedFriendship"
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Request declined and removed
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: The caller's accepted friends
      responses:
        "200":
          description: Accepted friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"

  /friends/{userId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove an accepted friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Friendship removed
        "404":
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/invite:
    post:
      operationId: sendFriendInvite
      tags: [friends]
      summary: Invite a non-member to download Bolo! by email
      description: >-
        Sends a "download Bolo!" referral email to an address that does not
        belong to any existing learner. Rate-limited to one send per
        (caller, recipient) pair per 24 hours to prevent abuse. If the invited
        person later signs up with that email, a pending friend request is
        automatically created from the inviter so the new learner sees it
        immediately on sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendInviteInput"
      responses:
        "200":
          description: Invite sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendInviteResult"
        "400":
          description: Missing or invalid email, or that email belongs to an existing learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit reached — already sent an invite to this address recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/leaderboard:
    get:
      operationId: getFriendsLeaderboard
      tags: [friends]
      summary: The caller and their friends ranked by total XP
      description: >-
        Returns the caller plus their accepted friends ranked by total XP
        (summed across every language), highest first. Each entry carries a
        display name, XP, and 1-based rank, and the caller's own entry is flagged
        with `isSelf` so clients can highlight their position. Available to all
        authenticated learners.
      responses:
        "200":
          description: The friends leaderboard, ranked highest XP first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /openai/tts:
    post:
      operationId: synthesizeSpeech
      tags: [openai]
      summary: Convert text to spoken audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechInput"
      responses:
        "200":
          description: Synthesized audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechResult"

  /openai/pronunciation:
    post:
      operationId: evaluatePronunciation
      tags: [openai]
      summary: Evaluate a spoken attempt against a target phrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PronunciationInput"
      responses:
        "200":
          description: Pronunciation evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationResult"

  /openai/generate-phrase:
    post:
      operationId: generatePhrase
      tags: [openai]
      summary: Generate a fresh practice phrase with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhraseRequest"
      responses:
        "200":
          description: A generated phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPhrase"

  /openai/chat:
    post:
      operationId: chatTurn
      tags: [openai]
      summary: One turn of a live conversation with Bolo the parrot
      description: >-
        Given a learner's recorded speech and a target language, transcribes
        the audio, has Bolo the parrot reply in character and in-language
        (naturally answering "how do you say X" / translation-style meta
        questions), synthesizes the reply to speech, and returns all three
        plus the caller's remaining weekly chat-time allowance. Validates the
        requested language against the caller's plan and, for Free, the
        2-minutes-per-week chat cap before doing any AI work. One Language and
        Plus subscribers are never time-capped (still subject to the
        plan-based language allowlist). Accepts a short recent-turn history so
        replies stay contextual without server-side chat storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatTurnInput"
      responses:
        "200":
          description: The learner's transcript, Bolo's reply, and reply audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTurnResult"
        "402":
          description: >-
            Upgrade required (this language is locked for the caller's plan,
            or the Free weekly chat-time cap has been reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Unknown language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The caller's family-plan status
      description: >-
        Returns the caller's relationship to a family plan: "owner" (with the
        join code and full seat list), "member" (whose plan they're on), or
        "none". `active` reflects whether the owner's subscription currently
        grants the family Plus access.
      responses:
        "200":
          description: The family status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStatus"

  /family/invites:
    post:
      operationId: createFamilyInvite
      tags: [family]
      summary: Invite someone to the family plan by email (owner only)
      description: >-
        Reserves a pending seat and emails a personal join link. Duplicate
        emails are rejected without consuming a seat; a full plan (4 people
        including pending invites) is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                basePath:
                  type: string
                  description: The web app's base path, used to build the join link.
      responses:
        "201":
          description: The pending invite
          content:
            application/json:
              schema:
                type: object
                required: [id, status, email]
                properties:
                  id: { type: integer }
                  status: { type: string }
                  email: { type: string }
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate invite or the plan is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The invite email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/invites/{seatId}:
    delete:
      operationId: revokeFamilyInvite
      tags: [family]
      summary: Revoke a pending invite, freeing its seat (owner only)
      parameters:
        - name: seatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No pending invite with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/members/{memberUserId}:
    delete:
      operationId: removeFamilyMember
      tags: [family]
      summary: Remove a member from the family plan (owner only)
      description: >-
        Frees the member's seat immediately. The member drops to Free on their
        next request; none of their learning data is deleted.
      parameters:
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: That person isn't on the caller's plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/leave:
    post:
      operationId: leaveFamily
      tags: [family]
      summary: Give up the caller's own family seat
      responses:
        "200":
          description: Left the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: The caller isn't on a family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/code/regenerate:
    post:
      operationId: regenerateFamilyCode
      tags: [family]
      summary: Replace the shareable join code (owner only)
      description: The old code stops working immediately.
      responses:
        "200":
          description: The new join code
          content:
            application/json:
              schema:
                type: object
                required: [joinCode]
                properties:
                  joinCode: { type: string }
        "404":
          description: The caller has no family plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/join:
    post:
      operationId: joinFamily
      tags: [family]
      summary: Claim a family seat via join code or emailed invite link
      description: >-
        Joins a family plan. If the caller pays for their own Plus through
        Stripe, that subscription is canceled with proration credit before the
        seat is granted (`previousSubscriptionCanceled` is true in that case).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                inviteToken: { type: string }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [ok, ownerName, previousSubscriptionCanceled, active]
                properties:
                  ok: { type: boolean }
                  ownerName: { type: string }
                  previousSubscriptionCanceled: { type: boolean }
                  active: { type: boolean }
        "400":
          description: Neither a code nor an invite token was provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid code or invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Plan full, already on a plan, or the invite was used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The caller's existing subscription couldn't be closed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    FamilySeat:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, active]
        email:
          type: string
          nullable: true
        memberUserId:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        joinedAt:
          type: string
          nullable: true

    FamilyStatus:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, member, none]
        active:
          type: boolean
        joinCode:
          type: string
        capacity:
          type: integer
        seats:
          type: array
          items:
            $ref: "#/components/schemas/FamilySeat"
        ownerName:
          type: string
        joinedAt:
          type: string
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AccountProfile:
      type: object
      description: The learner's identity fields, mirrored from Clerk.
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - displayName
        - avatarUrl

    AccountNotificationPreferences:
      type: object
      properties:
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          nullable: true
          description: Preferred local send time as "HH:MM" (24h), or null.
      required:
        - dailyReminderEnabled
        - dailyReminderTime

    AccountLearningPreferences:
      type: object
      properties:
        activeLanguage:
          type: string
          nullable: true
          description: The language code the learner is actively studying, or null.
        dailyGoal:
          type: integer
          description: Target attempts per day (1–100).
        theme:
          type: string
          description: Client colour theme ("system" | "light" | "dark").
        timezone:
          type: string
          nullable: true
          description: >-
            IANA time zone (e.g. "America/Los_Angeles") used to bucket practice
            into local calendar days for streaks, or null (falls back to UTC).
        hasCompletedTour:
          type: boolean
          description: >-
            Whether the learner has completed (or explicitly skipped) the
            onboarding tour. Defaults to false for new and existing users.
      required:
        - activeLanguage
        - dailyGoal
        - theme
        - timezone
        - hasCompletedTour

    AccountPreferences:
      type: object
      properties:
        notifications:
          $ref: "#/components/schemas/AccountNotificationPreferences"
        learning:
          $ref: "#/components/schemas/AccountLearningPreferences"
      required:
        - notifications
        - learning

    AccountSubscriptionSummary:
      type: object
      description: A compact subscription block returned inline by GET /account.
      properties:
        tier:
          type: string
        status:
          type: string
        chosenLanguage:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        pauseUntil:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        retentionOfferAcceptedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - tier
        - status
        - chosenLanguage
        - trialEndsAt
        - currentPeriodEnd
        - pauseUntil
        - cancelAtPeriodEnd
        - retentionOfferAcceptedAt

    PaymentMethodSummary:
      type: object
      description: >-
        A best-effort summary of how the subscription is billed. Every field is
        nullable because the provider may not expose it.
      properties:
        store:
          type: string
          nullable: true
          description: The store/processor the subscription is billed through.
        managementUrl:
          type: string
          nullable: true
          description: A link where the customer can manage/cancel with the store.
      required:
        - store
        - managementUrl

    BillingHistoryEntry:
      type: object
      description: One subscription period from the provider's billing history.
      properties:
        productId:
          type: string
        store:
          type: string
          nullable: true
        purchasedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        periodType:
          type: string
          nullable: true
        status:
          type: string
          description: '"active" | "expired" | "canceled" — derived from the dates/flags.'
      required:
        - productId
        - store
        - purchasedAt
        - expiresAt
        - periodType
        - status

    SubscriptionDetails:
      type: object
      description: >-
        The full subscription-management snapshot: the server-authoritative
        tier/status/dates and chosen language, plus the softer provider-sourced
        payment method and billing history (which degrade gracefully).
      properties:
        tier:
          type: string
        status:
          type: string
        chosenLanguage:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        pauseUntil:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        retentionOfferAcceptedAt:
          type: string
          format: date-time
          nullable: true
        provider:
          type: string
          nullable: true
        paymentMethod:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentMethodSummary"
        billingHistory:
          type: array
          items:
            $ref: "#/components/schemas/BillingHistoryEntry"
      required:
        - tier
        - status
        - chosenLanguage
        - trialEndsAt
        - currentPeriodEnd
        - pauseUntil
        - cancelAtPeriodEnd
        - retentionOfferAcceptedAt
        - provider
        - paymentMethod
        - billingHistory

    PauseSubscriptionInput:
      type: object
      description: How long to pause the subscription for.
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 3
          description: Number of months to pause (1–3). Defaults to 1 if omitted.

    Account:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/AccountProfile"
        preferences:
          $ref: "#/components/schemas/AccountPreferences"
        subscription:
          $ref: "#/components/schemas/AccountSubscriptionSummary"
      required:
        - profile
        - preferences
        - subscription

    AccountProfileResult:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/AccountProfile"
      required:
        - profile

    AccountPreferencesResult:
      type: object
      properties:
        preferences:
          $ref: "#/components/schemas/AccountPreferences"
      required:
        - preferences

    UpdateProfileInput:
      type: object
      description: Any subset of the editable profile fields.
      properties:
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true

    UpdatePreferencesInput:
      type: object
      description: Any subset of the notification and learning preferences.
      properties:
        dailyReminderEnabled:
          type: boolean
        dailyReminderTime:
          type: string
          nullable: true
        activeLanguage:
          type: string
          nullable: true
        dailyGoal:
          type: integer
        theme:
          type: string
          enum: [system, light, dark]
        timezone:
          type: string
          nullable: true
        hasCompletedTour:
          type: boolean

    DeleteAccountResult:
      type: object
      properties:
        deleted:
          type: boolean
      required:
        - deleted

    SetChosenLanguageInput:
      type: object
      properties:
        language:
          type: string
          description: The language code to unlock (must not be Hindi).
      required:
        - language

    Language:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        nativeName:
          type: string
        script:
          type: string
        fontFamily:
          type: string
        rtl:
          type: boolean
        sortOrder:
          type: integer
      required:
        - code
        - name
        - nativeName
        - script
        - fontFamily
        - rtl
        - sortOrder

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        accent:
          type: string
        sortOrder:
          type: integer
        titleNative:
          type: ["string", "null"]
        phraseCount:
          type: integer
        masteredCount:
          type: integer
        lockedPhraseCount:
          type: integer
          description: >-
            How many additional phrases upgrading to Bolo! Plus would unlock for
            this topic. Always 0 for a caller who already has the extended
            library.
        sentenceCount:
          type: integer
          description: >-
            How many full sentences the topic's Plus-only sentence stage holds
            (the final step after the phrase list). 0 when the stage has not
            been generated yet for this language.
        sentencesLocked:
          type: boolean
          description: >-
            Whether the sentence stage is locked for this caller (true for
            everyone without Bolo! Plus). Server-authoritative; clients show
            an upgrade nudge instead of requesting the sentences.
      required:
        - id
        - slug
        - title
        - description
        - iconName
        - accent
        - sortOrder
        - titleNative
        - phraseCount
        - masteredCount
        - lockedPhraseCount
        - sentenceCount
        - sentencesLocked

    Phrase:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        hint:
          type: ["string", "null"]
        difficulty:
          type: integer
        sortOrder:
          type: integer
        bestScore:
          type: ["integer", "null"]
        mastered:
          type: boolean
        attemptCount:
          type: integer
      required:
        - id
        - categoryId
        - languageCode
        - nativeScript
        - romanized
        - english
        - hint
        - difficulty
        - sortOrder
        - bestScore
        - mastered
        - attemptCount

    AttemptInput:
      type: object
      properties:
        evaluationToken:
          type: string
          minLength: 1
          description: >-
            Opaque, server-signed token returned by /openai/pronunciation. It
            carries the authoritative language, score, feedback, transcript and
            target phrase, so clients cannot forge or inflate their own progress.
      required:
        - evaluationToken

    Attempt:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt

    Badge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: ["string", "null"]
          format: date-time
        progressCurrent:
          type: integer
          description: Current value of the metric this badge tracks, capped at the target.
        progressTarget:
          type: integer
          description: The metric value that unlocks this badge.
      required:
        - key
        - title
        - description
        - iconName
        - earned
        - earnedAt
        - progressCurrent
        - progressTarget

    EarnedBadge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earnedAt:
          type: string
          format: date-time
      required:
        - key
        - title
        - description
        - iconName
        - earnedAt

    AttemptResult:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
        newlyEarnedBadges:
          type: array
          items:
            $ref: "#/components/schemas/EarnedBadge"
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt
        - newlyEarnedBadges

    ProgressSummary:
      type: object
      properties:
        totalAttempts:
          type: integer
        phrasesPracticed:
          type: integer
        phrasesMastered:
          type: integer
        totalPhrases:
          type: integer
        averageScore:
          type: integer
        bestScore:
          type: integer
        currentStreakDays:
          type: integer
        attemptsToday:
          type: integer
        xp:
          type: integer
      required:
        - totalAttempts
        - phrasesPracticed
        - phrasesMastered
        - totalPhrases
        - averageScore
        - bestScore
        - currentStreakDays
        - attemptsToday
        - xp

    SpeechInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        voice:
          type: string
        languageName:
          type: string
      required:
        - text

    SpeechResult:
      type: object
      properties:
        audioBase64:
          type: string
        format:
          type: string
      required:
        - audioBase64
        - format

    PronunciationInput:
      type: object
      properties:
        phraseId:
          type: ["integer", "null"]
          description: >-
            Optional id of the catalog phrase being practiced. When supplied the
            server uses the phrase's stored text as the authoritative target.
        targetNative:
          type: string
          minLength: 1
        targetRomanized:
          type: string
        targetEnglish:
          type: string
        languageName:
          type: string
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
      required:
        - targetNative
        - targetRomanized
        - targetEnglish
        - audioBase64

    PronunciationResult:
      type: object
      properties:
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        tip:
          type: string
        evaluationToken:
          type: string
          description: >-
            Server-signed token capturing this evaluation. Pass it to /attempts
            to record the attempt with the authoritative score and feedback.
      required:
        - transcript
        - score
        - passed
        - feedback
        - tip
        - evaluationToken

    PhraseRequest:
      type: object
      properties:
        languageName:
          type: string
        categoryTitle:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
      required: []

    GeneratedPhrase:
      type: object
      properties:
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
      required:
        - nativeScript
        - romanized
        - english

    ChatTurnMessage:
      type: object
      description: A single prior turn in the rolling conversation-context window.
      properties:
        role:
          type: string
          description: learner | parrot
        text:
          type: string
      required:
        - role
        - text

    ChatTurnInput:
      type: object
      properties:
        languageCode:
          type: string
          description: The language the learner is chatting in (e.g. "hi", "gu").
        audioBase64:
          type: string
          minLength: 1
          description: The learner's recorded speech for this turn.
        history:
          type: array
          description: >-
            A short recent-turn window (client-supplied; not persisted
            server-side) so replies stay contextual.
          items:
            $ref: "#/components/schemas/ChatTurnMessage"
      required:
        - languageCode
        - audioBase64

    ChatTurnResult:
      type: object
      properties:
        transcript:
          type: string
          description: What the server heard the learner say.
        replyText:
          type: string
          description: Bolo's in-character reply, in the target language.
        replyAudioBase64:
          type: string
          description: Ready-to-play synthesized speech of the reply.
        format:
          type: string
        languageCode:
          type: string
        secondsRemaining:
          type: ["integer", "null"]
          description: >-
            Seconds of weekly chat time left for the caller; null means
            unlimited (One Language and Plus).
      required:
        - transcript
        - replyText
        - replyAudioBase64
        - format
        - languageCode
        - secondsRemaining

    AddPhrasesInput:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How many new phrases to generate and append.
      required: []

    UpgradeRequired:
      type: object
      description: >-
        Returned with HTTP 402 when a Free action needs Bolo! Plus (a locked
        language, the daily new-lesson cap, or a Plus-only feature). A single
        shape across every gate so clients render the paywall uniformly.
      properties:
        error:
          type: string
          description: Always "upgrade_required".
        upgradeRequired:
          type: boolean
          description: Always true.
        reason:
          type: string
          description: language_locked | daily_lesson_limit | feature_locked
        message:
          type: string
        feature:
          type: string
          nullable: true
          description: The related feature flag, when applicable (e.g. "allLanguages").
        requiredPlan:
          type: string
          description: >-
            The cheapest plan that unlocks the action ("one_language" or
            "plus").
      required:
        - error
        - upgradeRequired
        - reason
        - message
        - feature
        - requiredPlan

    PlanFeatures:
      type: object
      properties:
        allLanguages:
          type: boolean
        unlimitedLessons:
          type: boolean
        review:
          type: boolean
        advancedAnalytics:
          type: boolean
        extendedLibrary:
          type: boolean
          description: >-
            Whether the caller can access the deep, pre-seeded premium phrase
            library beyond each topic's free starter set. Plus only.
        unlimitedChatTime:
          type: boolean
          description: >-
            Whether the caller has no weekly ceiling on Bolo Parrot
            conversational chat time. Free is capped at 2 minutes/week; One
            Language and Plus are unlimited.
      required:
        - allLanguages
        - unlimitedLessons
        - review
        - advancedAnalytics
        - extendedLibrary
        - unlimitedChatTime

    DailyLessonAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Daily new-lesson ceiling; null means unlimited (Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining today; null means unlimited (Plus).
      required:
        - limit
        - used
        - remaining

    WeeklyChatAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: >-
            Weekly Bolo Parrot chat-time ceiling in seconds; null means
            unlimited (One Language and Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining this week; null means unlimited.
      required:
        - limit
        - used
        - remaining

    EntitlementLimits:
      type: object
      properties:
        dailyNewLessons:
          $ref: "#/components/schemas/DailyLessonAllowance"
        weeklyChatSeconds:
          $ref: "#/components/schemas/WeeklyChatAllowance"
      required:
        - dailyNewLessons
        - weeklyChatSeconds

    Entitlements:
      type: object
      properties:
        plan:
          type: string
          description: The effective plan ("free", "one_language", or "plus").
        status:
          type: string
          description: none | trialing | active | expired | canceled
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        chosenLanguage:
          type: string
          nullable: true
          description: >-
            The single language a One Language ($6.99) subscriber unlocked on
            top of free Hindi. Null for Free and all-access Plus.
        allowedLanguages:
          type: array
          items:
            type: string
          description: The concrete language codes the caller may access.
        features:
          $ref: "#/components/schemas/PlanFeatures"
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
      required:
        - plan
        - status
        - trialEndsAt
        - currentPeriodEnd
        - chosenLanguage
        - allowedLanguages
        - features
        - limits

    CategoryAnalytics:
      type: object
      properties:
        categoryId:
          type: integer
        title:
          type: string
        phraseCount:
          type: integer
        practicedCount:
          type: integer
        masteredCount:
          type: integer
        averageScore:
          type: integer
      required:
        - categoryId
        - title
        - phraseCount
        - practicedCount
        - masteredCount
        - averageScore

    DailyActivity:
      type: object
      properties:
        date:
          type: string
          description: UTC day (YYYY-MM-DD).
        attempts:
          type: integer
        averageScore:
          type: integer
      required:
        - date
        - attempts
        - averageScore

    ProgressAnalytics:
      type: object
      properties:
        languageCode:
          type: string
        totalXp:
          type: integer
        reviewDueCount:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAnalytics"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyActivity"
      required:
        - languageCode
        - totalXp
        - reviewDueCount
        - categories
        - daily

    SendFriendInviteInput:
      type: object
      properties:
        email:
          type: string
          description: The email address to invite. Must not belong to an existing learner.
      required:
        - email

    FriendInviteResult:
      type: object
      description: Confirmation that a referral invite was sent.
      properties:
        sent:
          type: boolean
          description: Always true when the invite email was dispatched.
        sendCount:
          type: integer
          description: How many times this (caller, email) pair has been invited in total.
      required:
        - sent
        - sendCount

    UserSummary:
      type: object
      description: A learner's public identity for friends features.
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - id
        - displayName
        - email

    SendFriendRequestInput:
      type: object
      properties:
        email:
          type: string
          description: The exact email of the learner to send a request to.
      required:
        - email

    FriendRequest:
      type: object
      description: A pending friend request plus the other learner's identity.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "pending" for a request.
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - createdAt
        - user

    AcceptedFriendship:
      type: object
      description: The result of accepting a request — a now-mutual friendship.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "accepted".
        friend:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - friend

    Friend:
      type: object
      description: An accepted friend in the caller's friends list.
      properties:
        friendshipId:
          type: integer
        since:
          type: string
          format: date-time
          nullable: true
          description: When the friendship was accepted.
        id:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - friendshipId
        - id
        - displayName
        - email

    LeaderboardEntry:
      type: object
      description: One learner's standing on the friends leaderboard.
      properties:
        userId:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        xp:
          type: integer
          description: Total XP summed across every language.
        rank:
          type: integer
          description: 1-based rank, highest XP first.
        isSelf:
          type: boolean
          description: True for the caller's own entry.
      required:
        - userId
        - displayName
        - email
        - xp
        - rank
        - isSelf

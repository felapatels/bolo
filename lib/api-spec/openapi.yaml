openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Languages, categories, phrases, attempts and progress
  - name: openai
    description: OpenAI AI audio and content operations
  - name: friends
    description: Friends, friend requests, and the friends leaderboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /languages:
    get:
      operationId: listLanguages
      tags: [learning]
      summary: List all supported learning languages
      responses:
        "200":
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /categories:
    get:
      operationId: listCategories
      tags: [learning]
      summary: List all lesson categories with progress for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /categories/{id}/phrases/{lang}:
    get:
      operationId: listCategoryPhrases
      tags: [learning]
      summary: List phrases in a category for a language (generated + cached on first request)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language or Free daily lesson cap reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addCategoryPhrases
      tags: [learning]
      summary: Generate and append fresh AI phrases to a category's lesson
      description: >-
        Generates additional beginner phrases in the language's native script,
        avoiding phrases already in the lesson, and appends them to the existing
        lesson so they persist and count toward progress.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPhrasesInput"
      responses:
        "200":
          description: The newly added phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language or Free daily lesson cap reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review/phrases:
    get:
      operationId: listReviewPhrases
      tags: [learning]
      summary: The learner's not-yet-mastered phrases for a language, spaced-repetition ordered (due first)
      description: >-
        Returns the phrases the learner has practiced but not yet mastered
        (best attempt score below the mastery threshold) for the given
        language, ordered by a spaced-repetition schedule so phrases that are
        due (or overdue) to be reviewed surface first, with the weakest best
        score breaking ties. Each phrase climbs a Leitner-style spacing ladder
        on passing attempts (widening the gap before it resurfaces) and resets
        on a miss. Returns an empty array when there is nothing to review.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weak phrases to review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (review sessions are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /phrases/{id}:
    get:
      operationId: getPhrase
      tags: [learning]
      summary: Get a single phrase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attempts:
    post:
      operationId: createAttempt
      tags: [learning]
      summary: Record a pronunciation practice attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "201":
          description: Created attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"

  /attempts/recent:
    get:
      operationId: listRecentAttempts
      tags: [learning]
      summary: Recent practice attempts feed for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attempt"

  /badges:
    get:
      operationId: listBadges
      tags: [learning]
      summary: Badge catalog annotated with earned/locked status for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of badges with earned status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [learning]
      summary: Overall learning progress summary for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/analytics:
    get:
      operationId: getProgressAnalytics
      tags: [learning]
      summary: Advanced progress analytics for a language (Bolo! Plus only)
      description: >-
        A deeper progress breakdown than the basic summary: per-category
        mastery, a recent daily-activity trend, and how many phrases are due for
        review. Advanced analytics are a Bolo! Plus feature.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Advanced analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressAnalytics"
        "402":
          description: Upgrade required (advanced analytics are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /entitlements:
    get:
      operationId: getEntitlements
      tags: [entitlements]
      summary: The caller's plan, unlocked features, and daily limits
      description: >-
        Returns the authenticated user's effective plan (Free vs Bolo! Plus),
        subscription status, the languages they may access, the feature flags
        they have unlocked, and today's remaining daily new-lesson allowance.
        Clients call this to know what is unlocked and how to render the paywall.
      responses:
        "200":
          description: The caller's entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"

  /entitlements/chosen-language:
    post:
      operationId: setChosenLanguage
      tags: [entitlements]
      summary: Record the One Language tier's chosen language
      description: >-
        Records the single language a One Language ($6.99) subscriber unlocks on
        top of free Hindi, captured at purchase. Once set while on the middle
        tier the choice is locked: changing it returns 409, and only upgrading
        to all-access frees it. Choosing Hindi or an unknown language is
        rejected. Returns the fresh entitlements snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetChosenLanguageInput"
      responses:
        "200":
          description: The caller's updated entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "400":
          description: Missing or invalid language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Language not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The chosen language is locked for this subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/search:
    get:
      operationId: searchFriendByEmail
      tags: [friends]
      summary: Find a learner by their exact email
      description: >-
        Looks up a single learner by their exact email address so the caller can
        send them a friend request. The caller is never returned. Available to
        all authenticated learners.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The matching learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No learner found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests:
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request to a learner by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestInput"
      responses:
        "201":
          description: The created pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          description: Missing email or an attempt to friend yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No learner found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request or friendship already exists between the two learners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/incoming:
    get:
      operationId: listIncomingFriendRequests
      tags: [friends]
      summary: Pending friend requests awaiting the caller's response
      responses:
        "200":
          description: Incoming pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/outgoing:
    get:
      operationId: listOutgoingFriendRequests
      tags: [friends]
      summary: The caller's pending friend requests still awaiting the other learner
      responses:
        "200":
          description: Outgoing pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The now-accepted friendship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedFriendship"
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline a pending friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Request declined and removed
        "404":
          description: Request not found or not addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: The caller's accepted friends
      responses:
        "200":
          description: Accepted friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"

  /friends/{userId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove an accepted friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Friendship removed
        "404":
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /friends/leaderboard:
    get:
      operationId: getFriendsLeaderboard
      tags: [friends]
      summary: The caller and their friends ranked by total XP
      description: >-
        Returns the caller plus their accepted friends ranked by total XP
        (summed across every language), highest first. Each entry carries a
        display name, XP, and 1-based rank, and the caller's own entry is flagged
        with `isSelf` so clients can highlight their position. Available to all
        authenticated learners.
      responses:
        "200":
          description: The friends leaderboard, ranked highest XP first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /openai/tts:
    post:
      operationId: synthesizeSpeech
      tags: [openai]
      summary: Convert text to spoken audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechInput"
      responses:
        "200":
          description: Synthesized audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechResult"

  /openai/pronunciation:
    post:
      operationId: evaluatePronunciation
      tags: [openai]
      summary: Evaluate a spoken attempt against a target phrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PronunciationInput"
      responses:
        "200":
          description: Pronunciation evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationResult"

  /openai/generate-phrase:
    post:
      operationId: generatePhrase
      tags: [openai]
      summary: Generate a fresh practice phrase with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhraseRequest"
      responses:
        "200":
          description: A generated phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPhrase"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SetChosenLanguageInput:
      type: object
      properties:
        language:
          type: string
          description: The language code to unlock (must not be Hindi).
      required:
        - language

    Language:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        nativeName:
          type: string
        script:
          type: string
        fontFamily:
          type: string
        rtl:
          type: boolean
        sortOrder:
          type: integer
      required:
        - code
        - name
        - nativeName
        - script
        - fontFamily
        - rtl
        - sortOrder

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        accent:
          type: string
        sortOrder:
          type: integer
        titleNative:
          type: ["string", "null"]
        phraseCount:
          type: integer
        masteredCount:
          type: integer
      required:
        - id
        - slug
        - title
        - description
        - iconName
        - accent
        - sortOrder
        - titleNative
        - phraseCount
        - masteredCount

    Phrase:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        hint:
          type: ["string", "null"]
        difficulty:
          type: integer
        sortOrder:
          type: integer
        bestScore:
          type: ["integer", "null"]
        mastered:
          type: boolean
        attemptCount:
          type: integer
      required:
        - id
        - categoryId
        - languageCode
        - nativeScript
        - romanized
        - english
        - hint
        - difficulty
        - sortOrder
        - bestScore
        - mastered
        - attemptCount

    AttemptInput:
      type: object
      properties:
        evaluationToken:
          type: string
          minLength: 1
          description: >-
            Opaque, server-signed token returned by /openai/pronunciation. It
            carries the authoritative language, score, feedback, transcript and
            target phrase, so clients cannot forge or inflate their own progress.
      required:
        - evaluationToken

    Attempt:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt

    Badge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: ["string", "null"]
          format: date-time
        progressCurrent:
          type: integer
          description: Current value of the metric this badge tracks, capped at the target.
        progressTarget:
          type: integer
          description: The metric value that unlocks this badge.
      required:
        - key
        - title
        - description
        - iconName
        - earned
        - earnedAt
        - progressCurrent
        - progressTarget

    EarnedBadge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earnedAt:
          type: string
          format: date-time
      required:
        - key
        - title
        - description
        - iconName
        - earnedAt

    AttemptResult:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
        newlyEarnedBadges:
          type: array
          items:
            $ref: "#/components/schemas/EarnedBadge"
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt
        - newlyEarnedBadges

    ProgressSummary:
      type: object
      properties:
        totalAttempts:
          type: integer
        phrasesPracticed:
          type: integer
        phrasesMastered:
          type: integer
        totalPhrases:
          type: integer
        averageScore:
          type: integer
        bestScore:
          type: integer
        currentStreakDays:
          type: integer
        attemptsToday:
          type: integer
        xp:
          type: integer
      required:
        - totalAttempts
        - phrasesPracticed
        - phrasesMastered
        - totalPhrases
        - averageScore
        - bestScore
        - currentStreakDays
        - attemptsToday
        - xp

    SpeechInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        voice:
          type: string
        languageName:
          type: string
      required:
        - text

    SpeechResult:
      type: object
      properties:
        audioBase64:
          type: string
        format:
          type: string
      required:
        - audioBase64
        - format

    PronunciationInput:
      type: object
      properties:
        phraseId:
          type: ["integer", "null"]
          description: >-
            Optional id of the catalog phrase being practiced. When supplied the
            server uses the phrase's stored text as the authoritative target.
        targetNative:
          type: string
          minLength: 1
        targetRomanized:
          type: string
        targetEnglish:
          type: string
        languageName:
          type: string
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
      required:
        - targetNative
        - targetRomanized
        - targetEnglish
        - audioBase64

    PronunciationResult:
      type: object
      properties:
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        tip:
          type: string
        evaluationToken:
          type: string
          description: >-
            Server-signed token capturing this evaluation. Pass it to /attempts
            to record the attempt with the authoritative score and feedback.
      required:
        - transcript
        - score
        - passed
        - feedback
        - tip
        - evaluationToken

    PhraseRequest:
      type: object
      properties:
        languageName:
          type: string
        categoryTitle:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
      required: []

    GeneratedPhrase:
      type: object
      properties:
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
      required:
        - nativeScript
        - romanized
        - english

    AddPhrasesInput:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How many new phrases to generate and append.
      required: []

    UpgradeRequired:
      type: object
      description: >-
        Returned with HTTP 402 when a Free action needs Bolo! Plus (a locked
        language, the daily new-lesson cap, or a Plus-only feature). A single
        shape across every gate so clients render the paywall uniformly.
      properties:
        error:
          type: string
          description: Always "upgrade_required".
        upgradeRequired:
          type: boolean
          description: Always true.
        reason:
          type: string
          description: language_locked | daily_lesson_limit | feature_locked
        message:
          type: string
        feature:
          type: string
          nullable: true
          description: The related feature flag, when applicable (e.g. "allLanguages").
        requiredPlan:
          type: string
          description: >-
            The cheapest plan that unlocks the action ("one_language" or
            "plus").
      required:
        - error
        - upgradeRequired
        - reason
        - message
        - feature
        - requiredPlan

    PlanFeatures:
      type: object
      properties:
        allLanguages:
          type: boolean
        unlimitedLessons:
          type: boolean
        review:
          type: boolean
        advancedAnalytics:
          type: boolean
      required:
        - allLanguages
        - unlimitedLessons
        - review
        - advancedAnalytics

    DailyLessonAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Daily new-lesson ceiling; null means unlimited (Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining today; null means unlimited (Plus).
      required:
        - limit
        - used
        - remaining

    EntitlementLimits:
      type: object
      properties:
        dailyNewLessons:
          $ref: "#/components/schemas/DailyLessonAllowance"
      required:
        - dailyNewLessons

    Entitlements:
      type: object
      properties:
        plan:
          type: string
          description: The effective plan ("free", "one_language", or "plus").
        status:
          type: string
          description: none | trialing | active | expired | canceled
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        chosenLanguage:
          type: string
          nullable: true
          description: >-
            The single language a One Language ($6.99) subscriber unlocked on
            top of free Hindi. Null for Free and all-access Plus.
        allowedLanguages:
          type: array
          items:
            type: string
          description: The concrete language codes the caller may access.
        features:
          $ref: "#/components/schemas/PlanFeatures"
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
      required:
        - plan
        - status
        - trialEndsAt
        - currentPeriodEnd
        - chosenLanguage
        - allowedLanguages
        - features
        - limits

    CategoryAnalytics:
      type: object
      properties:
        categoryId:
          type: integer
        title:
          type: string
        phraseCount:
          type: integer
        practicedCount:
          type: integer
        masteredCount:
          type: integer
        averageScore:
          type: integer
      required:
        - categoryId
        - title
        - phraseCount
        - practicedCount
        - masteredCount
        - averageScore

    DailyActivity:
      type: object
      properties:
        date:
          type: string
          description: UTC day (YYYY-MM-DD).
        attempts:
          type: integer
        averageScore:
          type: integer
      required:
        - date
        - attempts
        - averageScore

    ProgressAnalytics:
      type: object
      properties:
        languageCode:
          type: string
        totalXp:
          type: integer
        reviewDueCount:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAnalytics"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyActivity"
      required:
        - languageCode
        - totalXp
        - reviewDueCount
        - categories
        - daily

    UserSummary:
      type: object
      description: A learner's public identity for friends features.
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - id
        - displayName
        - email

    SendFriendRequestInput:
      type: object
      properties:
        email:
          type: string
          description: The exact email of the learner to send a request to.
      required:
        - email

    FriendRequest:
      type: object
      description: A pending friend request plus the other learner's identity.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "pending" for a request.
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - createdAt
        - user

    AcceptedFriendship:
      type: object
      description: The result of accepting a request — a now-mutual friendship.
      properties:
        id:
          type: integer
        status:
          type: string
          description: Always "accepted".
        friend:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - status
        - friend

    Friend:
      type: object
      description: An accepted friend in the caller's friends list.
      properties:
        friendshipId:
          type: integer
        since:
          type: string
          format: date-time
          nullable: true
          description: When the friendship was accepted.
        id:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - friendshipId
        - id
        - displayName
        - email

    LeaderboardEntry:
      type: object
      description: One learner's standing on the friends leaderboard.
      properties:
        userId:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        xp:
          type: integer
          description: Total XP summed across every language.
        rank:
          type: integer
          description: 1-based rank, highest XP first.
        isSelf:
          type: boolean
          description: True for the caller's own entry.
      required:
        - userId
        - displayName
        - email
        - xp
        - rank
        - isSelf

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Languages, categories, phrases, attempts and progress
  - name: openai
    description: OpenAI AI audio and content operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /languages:
    get:
      operationId: listLanguages
      tags: [learning]
      summary: List all supported learning languages
      responses:
        "200":
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /categories:
    get:
      operationId: listCategories
      tags: [learning]
      summary: List all lesson categories with progress for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "402":
          description: Upgrade required (this language is Bolo! Plus-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /categories/{id}/phrases/{lang}:
    get:
      operationId: listCategoryPhrases
      tags: [learning]
      summary: List phrases in a category for a language (generated + cached on first request)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language or Free daily lesson cap reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addCategoryPhrases
      tags: [learning]
      summary: Generate and append fresh AI phrases to a category's lesson
      description: >-
        Generates additional beginner phrases in the language's native script,
        avoiding phrases already in the lesson, and appends them to the existing
        lesson so they persist and count toward progress.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPhrasesInput"
      responses:
        "200":
          description: The newly added phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (Plus-only language or Free daily lesson cap reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review/phrases:
    get:
      operationId: listReviewPhrases
      tags: [learning]
      summary: The learner's not-yet-mastered phrases for a language, spaced-repetition ordered (due first)
      description: >-
        Returns the phrases the learner has practiced but not yet mastered
        (best attempt score below the mastery threshold) for the given
        language, ordered by a spaced-repetition schedule so phrases that are
        due (or overdue) to be reviewed surface first, with the weakest best
        score breaking ties. Each phrase climbs a Leitner-style spacing ladder
        on passing attempts (widening the gap before it resurfaces) and resets
        on a miss. Returns an empty array when there is nothing to review.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weak phrases to review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phrase"
        "402":
          description: Upgrade required (review sessions are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /phrases/{id}:
    get:
      operationId: getPhrase
      tags: [learning]
      summary: Get a single phrase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attempts:
    post:
      operationId: createAttempt
      tags: [learning]
      summary: Record a pronunciation practice attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "201":
          description: Created attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"

  /attempts/recent:
    get:
      operationId: listRecentAttempts
      tags: [learning]
      summary: Recent practice attempts feed for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attempt"

  /badges:
    get:
      operationId: listBadges
      tags: [learning]
      summary: Badge catalog annotated with earned/locked status for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of badges with earned status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [learning]
      summary: Overall learning progress summary for a language
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/analytics:
    get:
      operationId: getProgressAnalytics
      tags: [learning]
      summary: Advanced progress analytics for a language (Bolo! Plus only)
      description: >-
        A deeper progress breakdown than the basic summary: per-category
        mastery, a recent daily-activity trend, and how many phrases are due for
        review. Advanced analytics are a Bolo! Plus feature.
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Advanced analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressAnalytics"
        "402":
          description: Upgrade required (advanced analytics are a Bolo! Plus feature)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRequired"

  /entitlements:
    get:
      operationId: getEntitlements
      tags: [entitlements]
      summary: The caller's plan, unlocked features, and daily limits
      description: >-
        Returns the authenticated user's effective plan (Free vs Bolo! Plus),
        subscription status, the languages they may access, the feature flags
        they have unlocked, and today's remaining daily new-lesson allowance.
        Clients call this to know what is unlocked and how to render the paywall.
      responses:
        "200":
          description: The caller's entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"

  /openai/tts:
    post:
      operationId: synthesizeSpeech
      tags: [openai]
      summary: Convert text to spoken audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechInput"
      responses:
        "200":
          description: Synthesized audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechResult"

  /openai/pronunciation:
    post:
      operationId: evaluatePronunciation
      tags: [openai]
      summary: Evaluate a spoken attempt against a target phrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PronunciationInput"
      responses:
        "200":
          description: Pronunciation evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PronunciationResult"

  /openai/generate-phrase:
    post:
      operationId: generatePhrase
      tags: [openai]
      summary: Generate a fresh practice phrase with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhraseRequest"
      responses:
        "200":
          description: A generated phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPhrase"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Language:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        nativeName:
          type: string
        script:
          type: string
        fontFamily:
          type: string
        rtl:
          type: boolean
        sortOrder:
          type: integer
      required:
        - code
        - name
        - nativeName
        - script
        - fontFamily
        - rtl
        - sortOrder

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        accent:
          type: string
        sortOrder:
          type: integer
        titleNative:
          type: ["string", "null"]
        phraseCount:
          type: integer
        masteredCount:
          type: integer
      required:
        - id
        - slug
        - title
        - description
        - iconName
        - accent
        - sortOrder
        - titleNative
        - phraseCount
        - masteredCount

    Phrase:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        hint:
          type: ["string", "null"]
        difficulty:
          type: integer
        sortOrder:
          type: integer
        bestScore:
          type: ["integer", "null"]
        mastered:
          type: boolean
        attemptCount:
          type: integer
      required:
        - id
        - categoryId
        - languageCode
        - nativeScript
        - romanized
        - english
        - hint
        - difficulty
        - sortOrder
        - bestScore
        - mastered
        - attemptCount

    AttemptInput:
      type: object
      properties:
        evaluationToken:
          type: string
          minLength: 1
          description: >-
            Opaque, server-signed token returned by /openai/pronunciation. It
            carries the authoritative language, score, feedback, transcript and
            target phrase, so clients cannot forge or inflate their own progress.
      required:
        - evaluationToken

    Attempt:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt

    Badge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: ["string", "null"]
          format: date-time
        progressCurrent:
          type: integer
          description: Current value of the metric this badge tracks, capped at the target.
        progressTarget:
          type: integer
          description: The metric value that unlocks this badge.
      required:
        - key
        - title
        - description
        - iconName
        - earned
        - earnedAt
        - progressCurrent
        - progressTarget

    EarnedBadge:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        iconName:
          type: string
        earnedAt:
          type: string
          format: date-time
      required:
        - key
        - title
        - description
        - iconName
        - earnedAt

    AttemptResult:
      type: object
      properties:
        id:
          type: integer
        phraseId:
          type: ["integer", "null"]
        languageCode:
          type: string
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        createdAt:
          type: string
          format: date-time
        newlyEarnedBadges:
          type: array
          items:
            $ref: "#/components/schemas/EarnedBadge"
      required:
        - id
        - phraseId
        - languageCode
        - nativeScript
        - romanized
        - english
        - transcript
        - score
        - passed
        - feedback
        - createdAt
        - newlyEarnedBadges

    ProgressSummary:
      type: object
      properties:
        totalAttempts:
          type: integer
        phrasesPracticed:
          type: integer
        phrasesMastered:
          type: integer
        totalPhrases:
          type: integer
        averageScore:
          type: integer
        bestScore:
          type: integer
        currentStreakDays:
          type: integer
        attemptsToday:
          type: integer
        xp:
          type: integer
      required:
        - totalAttempts
        - phrasesPracticed
        - phrasesMastered
        - totalPhrases
        - averageScore
        - bestScore
        - currentStreakDays
        - attemptsToday
        - xp

    SpeechInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        voice:
          type: string
        languageName:
          type: string
      required:
        - text

    SpeechResult:
      type: object
      properties:
        audioBase64:
          type: string
        format:
          type: string
      required:
        - audioBase64
        - format

    PronunciationInput:
      type: object
      properties:
        phraseId:
          type: ["integer", "null"]
          description: >-
            Optional id of the catalog phrase being practiced. When supplied the
            server uses the phrase's stored text as the authoritative target.
        targetNative:
          type: string
          minLength: 1
        targetRomanized:
          type: string
        targetEnglish:
          type: string
        languageName:
          type: string
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
      required:
        - targetNative
        - targetRomanized
        - targetEnglish
        - audioBase64

    PronunciationResult:
      type: object
      properties:
        transcript:
          type: string
        score:
          type: integer
        passed:
          type: boolean
        feedback:
          type: string
        tip:
          type: string
        evaluationToken:
          type: string
          description: >-
            Server-signed token capturing this evaluation. Pass it to /attempts
            to record the attempt with the authoritative score and feedback.
      required:
        - transcript
        - score
        - passed
        - feedback
        - tip
        - evaluationToken

    PhraseRequest:
      type: object
      properties:
        languageName:
          type: string
        categoryTitle:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
      required: []

    GeneratedPhrase:
      type: object
      properties:
        nativeScript:
          type: string
        romanized:
          type: string
        english:
          type: string
      required:
        - nativeScript
        - romanized
        - english

    AddPhrasesInput:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How many new phrases to generate and append.
      required: []

    UpgradeRequired:
      type: object
      description: >-
        Returned with HTTP 402 when a Free action needs Bolo! Plus (a locked
        language, the daily new-lesson cap, or a Plus-only feature). A single
        shape across every gate so clients render the paywall uniformly.
      properties:
        error:
          type: string
          description: Always "upgrade_required".
        upgradeRequired:
          type: boolean
          description: Always true.
        reason:
          type: string
          description: language_locked | daily_lesson_limit | feature_locked
        message:
          type: string
        feature:
          type: string
          nullable: true
          description: The related feature flag, when applicable (e.g. "allLanguages").
        requiredPlan:
          type: string
          description: The plan that unlocks the action (e.g. "plus").
      required:
        - error
        - upgradeRequired
        - reason
        - message
        - feature
        - requiredPlan

    PlanFeatures:
      type: object
      properties:
        allLanguages:
          type: boolean
        unlimitedLessons:
          type: boolean
        review:
          type: boolean
        advancedAnalytics:
          type: boolean
      required:
        - allLanguages
        - unlimitedLessons
        - review
        - advancedAnalytics

    DailyLessonAllowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Daily new-lesson ceiling; null means unlimited (Plus).
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Remaining today; null means unlimited (Plus).
      required:
        - limit
        - used
        - remaining

    EntitlementLimits:
      type: object
      properties:
        dailyNewLessons:
          $ref: "#/components/schemas/DailyLessonAllowance"
      required:
        - dailyNewLessons

    Entitlements:
      type: object
      properties:
        plan:
          type: string
          description: The effective plan ("free" or "plus").
        status:
          type: string
          description: none | trialing | active | expired | canceled
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        allowedLanguages:
          type: array
          items:
            type: string
          description: The concrete language codes the caller may access.
        features:
          $ref: "#/components/schemas/PlanFeatures"
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
      required:
        - plan
        - status
        - trialEndsAt
        - currentPeriodEnd
        - allowedLanguages
        - features
        - limits

    CategoryAnalytics:
      type: object
      properties:
        categoryId:
          type: integer
        title:
          type: string
        phraseCount:
          type: integer
        practicedCount:
          type: integer
        masteredCount:
          type: integer
        averageScore:
          type: integer
      required:
        - categoryId
        - title
        - phraseCount
        - practicedCount
        - masteredCount
        - averageScore

    DailyActivity:
      type: object
      properties:
        date:
          type: string
          description: UTC day (YYYY-MM-DD).
        attempts:
          type: integer
        averageScore:
          type: integer
      required:
        - date
        - attempts
        - averageScore

    ProgressAnalytics:
      type: object
      properties:
        languageCode:
          type: string
        totalXp:
          type: integer
        reviewDueCount:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAnalytics"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyActivity"
      required:
        - languageCode
        - totalXp
        - reviewDueCount
        - categories
        - daily
